name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Same line as the dev machine (mise); go.mod's "go 1.21" is only the minimum
          go-version: "1.27"
          cache-dependency-path: tools/emulator/go.sum

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Same major version as the dev machine (mise), for deploy/deploy.test.js
          node-version: "24"

      # Go vet + unit tests, template tests (CI=true makes a missing snapshot fail),
      # the command linter, the deploy tooling tests, and a gofmt check
      - run: make ci
