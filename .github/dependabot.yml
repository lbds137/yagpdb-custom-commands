version: 2
updates:
  # GitHub Actions pins (claude-code-action, checkout, ...): weekly bumps keep
  # every repo on the latest action version. Same schedule as Tzurot's entry.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 5
    # These PRs merge on green checks with no review, so wait out the days in which a
    # hijacked release is usually caught. Security updates ignore the cooldown.
    cooldown:
      default-days: 3
    # One PR for every action bump: separate PRs that rewrite the same workflow file collide,
    # and the workflow token can't merge the rebased one (it lacks the workflows permission).
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
  # Go modules of the emulator (tools/emulator/go.mod). Same cooldown reason as above.
  - package-ecosystem: 'gomod'
    directory: '/tools/emulator'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
