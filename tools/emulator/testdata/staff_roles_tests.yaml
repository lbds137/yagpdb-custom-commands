name: "staff_roles (configures which roles count as staff)"
description: >
  Staff is pre-seeded (an empty dict) in every test here, as a bootstrapped server always
  has it (commands/plumbing/bootstrap.gohtml:25 sets it via `or ... sdict`); staff_roles.gohtml
  falls back the same way when "Roles" or "Staff" is unset.

defaults:
  guild:
    channels:
      - { id: 999999999, name: "yagpdb" }
    roles:
      - { id: 111111111111111111, name: "Mod" }
      - { id: 222222222222222222, name: "Helper" }
  channel:
    id: 123456789012345678
  user:
    id: 500000000000000001

setup_db:
  - user_id: 0
    key: "Global"
    value: { Delete Trigger Delay: 5, Delete Response Delay: 10, Command Prefix: "-" }
  - user_id: 0
    key: "Commands"
    value: { embed_exec: "1" }
  - user_id: 0
    key: "Channels"
    value: { YAGPDB: 999999999 }

command_map:
  1: "../../../commands/plumbing/embed_exec.gohtml"

tests:
  - name: "staff_roles: valid role IDs are stored, and the configured Roles > Staff is added when missing from the trigger"
    template: "../../../commands/members/staff_roles.gohtml"
    setup_db:
      - { user_id: 0, key: "Roles", value: { Staff: "222222222222222222" } }
      - { user_id: 0, key: "Staff", value: {} }
    context:
      message_content: "-staff_roles 111111111111111111"
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { Roles: ["111111111111111111", "222222222222222222"] } }
      sent_messages:
        - { embed_title: "Staff Roles Configuration", embed_contains: "<@&111111111111111111>" }
        - { embed_contains: "<@&222222222222222222>" }

  - name: "staff_roles: invalid role IDs are rejected and never stored"
    template: "../../../commands/members/staff_roles.gohtml"
    setup_db:
      - { user_id: 0, key: "Roles", value: { Staff: "222222222222222222" } }
      - { user_id: 0, key: "Staff", value: {} }
    context:
      message_content: "-staff_roles 222222222222222222 999999999999999999"
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { Roles: ["222222222222222222"] } }
      sent_messages:
        - { embed_contains: "were invalid" }
        - { embed_contains: "`999999999999999999`" }

  - name: "staff_roles: a missing Roles dictionary doesn't crash (Roles falls back to empty)"
    template: "../../../commands/members/staff_roles.gohtml"
    setup_db:
      - { user_id: 0, key: "Staff", value: {} }
    context:
      message_content: "-staff_roles 111111111111111111"
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { Roles: ["111111111111111111"] } }
      sent_messages:
        - { embed_title: "Staff Roles Configuration", embed_contains: "<@&111111111111111111>" }

  - name: "staff_roles: a missing Staff dictionary is created instead of storing null"
    template: "../../../commands/members/staff_roles.gohtml"
    setup_db:
      - { user_id: 0, key: "Roles", value: { Staff: "222222222222222222" } }
    context:
      message_content: "-staff_roles 111111111111111111"
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { Roles: ["111111111111111111", "222222222222222222"] } }
      sent_messages:
        - { embed_title: "Staff Roles Configuration" }

  - name: "staff_roles: an unset Roles > Staff doesn't crash the reFind presence check"
    template: "../../../commands/members/staff_roles.gohtml"
    setup_db:
      - { user_id: 0, key: "Roles", value: {} }
      - { user_id: 0, key: "Staff", value: {} }
    context:
      message_content: "-staff_roles 111111111111111111"
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { Roles: ["111111111111111111"] } }
      sent_messages:
        - { embed_title: "Staff Roles Configuration", embed_contains: "<@&111111111111111111>" }

  - name: "staff_roles: no valid role IDs leaves the configured staff roles untouched"
    template: "../../../commands/members/staff_roles.gohtml"
    setup_db:
      - { user_id: 0, key: "Roles", value: { Staff: "" } }
      - { user_id: 0, key: "Staff", value: { Roles: ["333333333333333333"] } }
    context:
      message_content: "-staff_roles 999999999999999999"
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { Roles: ["333333333333333333"] } }
      sent_messages:
        - { embed_title: "Invalid Role IDs", embed_contains: "`999999999999999999`" }

  # The picker panel (panel 97): a bare run used to append the Staff role and clobber
  # the stored list; it now posts the role select instead. Resetting to just the Staff
  # role is "pick only the Staff role in the panel and submit".
  - name: "staff_roles: a bare run posts the picker panel and leaves Staff.Roles alone"
    template: "../../../commands/members/staff_roles.gohtml"
    setup_db:
      - { user_id: 0, key: "Roles", value: { Staff: "222222222222222222" } }
      - { user_id: 0, key: "Staff", value: { Roles: ["111111111111111111"] } }
    context:
      message_content: "-staff_roles"
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { Roles: ["111111111111111111"] } }
      sent_messages:
        - embed_title: "Staff Roles Configuration"
          embed_contains: "<@&111111111111111111>"
          components_contains: "templates-sr:500000000000000001"
      deletions:
        - { of: trigger, delay: 5s }

  - name: "staff_roles: a bare run with no configured roles posts the empty-state panel"
    template: "../../../commands/members/staff_roles.gohtml"
    snapshot: true
    setup_db:
      - { user_id: 0, key: "Roles", value: { Staff: "222222222222222222" } }
    context:
      message_content: "-staff_roles"
    assertions:
      sent_messages:
        - embed_title: "Staff Roles Configuration"
          embed_contains: "No staff roles have been designated yet"
          components_contains: '"min_values": 1'

  - name: "staff_roles: the bare-run panel carries the current roles as default_values"
    template: "../../../commands/members/staff_roles.gohtml"
    snapshot: true
    setup_db:
      - { user_id: 0, key: "Roles", value: { Staff: "222222222222222222" } }
      - { user_id: 0, key: "Staff", value: { Roles: ["111111111111111111"] } }
    context:
      message_content: "-staff_roles"
    assertions:
      sent_messages:
        - embed_title: "Staff Roles Configuration"
          components_contains: '"id": "111111111111111111"'

  - name: "staff_roles_pick: a staff submit saves Staff.Roles and rebuilds the panel"
    template: "../../../commands/members/staff_roles_pick.gohtml"
    setup_db:
      - { user_id: 0, key: "Roles", value: { Staff: "111111111111111111" } }
      - { user_id: 0, key: "Staff", value: { Roles: ["333333333333333333"] } }
    context:
      user: { id: 500000000000000001, roles: [111111111111111111] }
      messages:
        - { id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Staff Roles Configuration" }] }
      interaction:
        { type: component, custom_id: "sr:500000000000000001", message_id: 7,
          component: role_menu, values: ["111111111111111111", "222222222222222222"] }
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { Roles: ["111111111111111111", "222222222222222222"] } }
      interaction_responses:
        - kind: update
          embed_contains: "<@&111111111111111111>"
          components_contains: "templates-sr:500000000000000001"
      edited_messages:
        - channel_id: 123456789012345678
          embed_contains: "<@&222222222222222222>"
          components_contains: '"id": "222222222222222222"'

  - name: "staff_roles_pick: a non-staff submit is refused ephemerally and saves nothing"
    template: "../../../commands/members/staff_roles_pick.gohtml"
    setup_db:
      - { user_id: 0, key: "Roles", value: { Staff: "111111111111111111" } }
      - { user_id: 0, key: "Staff", value: { Roles: ["333333333333333333"] } }
    context:
      user: { id: 555555555555555555, username: "Other" }
      messages:
        - { id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Staff Roles Configuration" }] }
      interaction:
        { type: component, custom_id: "sr:500000000000000001", message_id: 7,
          component: role_menu, values: ["111111111111111111"] }
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { Roles: ["333333333333333333"] } }
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "⚠️ Only staff can configure staff roles." }
      edited_messages: []

  # The Staff role is the gate, so a staffer's submit always has Roles.Staff set; the
  # unset branch in the template (no configured Staff role: nothing to append) is
  # unreachable through the gate, which refuses everyone when the role is unset.
  - name: "staff_roles_pick: a submit without the Staff role keeps it (rides along)"
    template: "../../../commands/members/staff_roles_pick.gohtml"
    setup_db:
      - { user_id: 0, key: "Roles", value: { Staff: "111111111111111111" } }
      - { user_id: 0, key: "Staff", value: { Roles: ["333333333333333333"] } }
    context:
      user: { id: 500000000000000001, roles: [111111111111111111] }
      messages:
        - { id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Staff Roles Configuration" }] }
      interaction:
        { type: component, custom_id: "sr:500000000000000001", message_id: 7,
          component: role_menu, values: ["222222222222222222"] }
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { Roles: ["222222222222222222", "111111111111111111"] } }
      interaction_responses:
        - kind: update
          embed_contains: "<@&111111111111111111>"
      edited_messages:
        - channel_id: 123456789012345678
          embed_contains: "<@&222222222222222222>"
          components_contains: '"id": "111111111111111111"'

  - name: "staff_roles_pick: a submit that already has the Staff role gets no duplicate"
    template: "../../../commands/members/staff_roles_pick.gohtml"
    setup_db:
      - { user_id: 0, key: "Roles", value: { Staff: "111111111111111111" } }
      - { user_id: 0, key: "Staff", value: { Roles: ["333333333333333333"] } }
    context:
      user: { id: 500000000000000001, roles: [111111111111111111] }
      messages:
        - { id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Staff Roles Configuration" }] }
      interaction:
        { type: component, custom_id: "sr:500000000000000001", message_id: 7,
          component: role_menu, values: ["111111111111111111", "222222222222222222"] }
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { Roles: ["111111111111111111", "222222222222222222"] } }
