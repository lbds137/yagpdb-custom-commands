name: "staff_roles (configures which roles count as staff)"
description: >
  Staff is pre-seeded (an empty dict) in every test here, as a bootstrapped server always
  has it (staff/bootstrap.gohtml:28 sets it via `or ... sdict`); staff_roles.gohtml
  falls back the same way when "Roles" or "Staff" is unset.

defaults:
  guild:
    channels:
      - { id: 999999999, name: "yagpdb" }
    roles:
      - { id: 111111111111111111, name: "Mod" }
      - { id: 222222222222222222, name: "Helper" }
  channel:
    id: 123456789012345678
  user:
    id: 500000000000000001

setup_db:
  - user_id: 0
    key: "Global"
    value: { Delete Trigger Delay: 5, Delete Response Delay: 10, Command Prefix: "-" }
  - user_id: 0
    key: "Commands"
    value: { embed_exec: "1" }
  - user_id: 0
    key: "Channels"
    value: { YAGPDB: 999999999 }

command_map:
  1: "../../../everyone/services/embed_exec.gohtml"

tests:
  - name: "staff_roles: valid role IDs are stored, and the configured Roles > Staff is added when missing from the trigger"
    template: "../../../staff/staff_roles.gohtml"
    setup_db:
      - { user_id: 0, key: "Roles", value: { Staff: "222222222222222222" } }
      - { user_id: 0, key: "Staff", value: {} }
    context:
      message_content: "-staff_roles 111111111111111111"
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { Roles: ["111111111111111111", "222222222222222222"] } }
      sent_messages:
        - { embed_title: "Staff Roles Configuration", embed_contains: "<@&111111111111111111>" }
        - { embed_contains: "<@&222222222222222222>" }

  - name: "staff_roles: invalid role IDs are rejected and never stored"
    template: "../../../staff/staff_roles.gohtml"
    setup_db:
      - { user_id: 0, key: "Roles", value: { Staff: "222222222222222222" } }
      - { user_id: 0, key: "Staff", value: {} }
    context:
      message_content: "-staff_roles 222222222222222222 999999999999999999"
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { Roles: ["222222222222222222"] } }
      sent_messages:
        - { embed_contains: "were invalid" }
        - { embed_contains: "`999999999999999999`" }

  - name: "staff_roles: a missing Roles dictionary doesn't crash (Roles falls back to empty)"
    template: "../../../staff/staff_roles.gohtml"
    setup_db:
      - { user_id: 0, key: "Staff", value: {} }
    context:
      message_content: "-staff_roles 111111111111111111"
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { Roles: ["111111111111111111"] } }
      sent_messages:
        - { embed_title: "Staff Roles Configuration", embed_contains: "<@&111111111111111111>" }

  - name: "staff_roles: a missing Staff dictionary is created instead of storing null"
    template: "../../../staff/staff_roles.gohtml"
    setup_db:
      - { user_id: 0, key: "Roles", value: { Staff: "222222222222222222" } }
    context:
      message_content: "-staff_roles 111111111111111111"
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { Roles: ["111111111111111111", "222222222222222222"] } }
      sent_messages:
        - { embed_title: "Staff Roles Configuration" }

  - name: "staff_roles: an unset Roles > Staff doesn't crash the reFind presence check"
    template: "../../../staff/staff_roles.gohtml"
    setup_db:
      - { user_id: 0, key: "Roles", value: {} }
      - { user_id: 0, key: "Staff", value: {} }
    context:
      message_content: "-staff_roles 111111111111111111"
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { Roles: ["111111111111111111"] } }
      sent_messages:
        - { embed_title: "Staff Roles Configuration", embed_contains: "<@&111111111111111111>" }

  - name: "staff_roles: no valid role IDs leaves the configured staff roles untouched"
    template: "../../../staff/staff_roles.gohtml"
    setup_db:
      - { user_id: 0, key: "Roles", value: { Staff: "" } }
      - { user_id: 0, key: "Staff", value: { Roles: ["333333333333333333"] } }
    context:
      message_content: "-staff_roles 999999999999999999"
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { Roles: ["333333333333333333"] } }
      sent_messages:
        - { embed_title: "Invalid Role IDs", embed_contains: "`999999999999999999`" }
