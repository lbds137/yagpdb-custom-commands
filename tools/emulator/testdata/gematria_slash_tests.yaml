name: "gematria_slash (/gematria)"

# The slash root of gematria: ONE execCC to gematria with Respond; gematria passes it on to
# embed_exec, which answers the interaction publicly (root -> gematria -> embed_exec: depth 2).
# The gematria tables come from gematria_bootstrap, as in gematria_tests.

setup_templates: ["../../../commands/gematria/gematria_bootstrap.gohtml"]

defaults:
  user: { id: 500000000000000001, username: "Invoker" }
  channel: { id: 123456789012345678 }
  guild:
    id: 333333333333333333
    name: "Test Server"
    channels:
      - { id: 900000000000000001, name: "yagpdb" }

setup_db:
  - user_id: 0
    key: "Global"
    value: { Embed Color: 9807270 }
  - user_id: 0
    key: "Commands"
    value: { gematria: "1", embed_exec: "2" }
  - user_id: 0
    key: "Channels"
    value: { YAGPDB: 900000000000000001 }

command_map:
  1: "../../../commands/gematria/gematria.gohtml"
  2: "../../../commands/plumbing/embed_exec.gohtml"

tests:
  - name: "gematria_slash: a Hebrew word answers publicly with its gematria"
    template: "../../../commands/gematria/gematria_slash.gohtml"
    context:
      interaction: { type: slash, options: { text: "אמת" } }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: false
          embed_title: "Gematria Calculator"
          embed_contains: "`441` > `9`"
      sent_messages:
        - { embed_contains: "`XXI` - The World" }
      scheduled_runs: []

  - name: "gematria_slash: several words get the per-word and total values"
    template: "../../../commands/gematria/gematria_slash.gohtml"
    context:
      interaction: { type: slash, options: { text: "hello world" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: false, embed_contains: "`1157` > `14` > `5`" }

  - name: "gematria_slash: a bare run prints the usage hint"
    template: "../../../commands/gematria/gematria_slash.gohtml"
    context:
      exec_data: { probe: true }
    expected:
      output_contains: "Use /gematria as a slash command"
