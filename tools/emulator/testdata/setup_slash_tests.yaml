name: "setup_slash (/setup view, roles, channels)"

# The pickers for the single-ID roles and channels. Every reply is an ephemeral embed of the
# saved section(s); roles/channels validate every given option first and write nothing on a
# refusal (db_checks pin the dict unchanged). An ephemeral response counts as a sent message
# in the emulator, so the tests that must send nothing else use snapshot: true, which lists
# every sent message.

defaults:
  # the invoker is an Administrator through a role (bit 8), not the owner
  user: { id: 500000000000000001, username: "Invoker", roles: [700000000000000010] }
  channel: { id: 123456789012345678 }
  guild:
    id: 111222333444555666
    name: "Test Server"
    owner_id: 222333444555666777
    roles:
      - { id: 111222333444555666, name: "@everyone" }
      - { id: 700000000000000001, name: "Staff" }
      - { id: 700000000000000002, name: "Member" }
      - { id: 700000000000000003, name: "Active" }
      - { id: 700000000000000004, name: "Inactive" }
      - { id: 700000000000000005, name: "Bump" }
      - { id: 700000000000000009, name: "Some Bot", managed: true }
      - { id: 700000000000000010, name: "Admin", permissions: 8 }
    channels:
      - { id: 888888888888888801, name: "yagpdb" }
      - { id: 888888888888888802, name: "mod-log" }
      - { id: 888888888888888803, name: "announcements", type: 5 }
      - { id: 888888888888888804, name: "a-category", type: 4 }
      - { id: 888888888888888805, name: "a-voice", type: 2 }

setup_db:
  - user_id: 0
    key: "Global"
    value: { Embed Color: 9807270 }

tests:
  - name: "setup_slash: view with nothing set shows every key as not set"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, subcommand: view }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          embed_title: "Server setup"
          embed_contains: "**Staff** not set, pick one with /setup roles\\n**Member** not set, pick one with /setup roles\\n**Active** not set, pick one with /setup roles\\n**Inactive** not set, pick one with /setup roles\\n**Bump** not set, pick one with /setup roles"

  - name: "setup_slash: view with everything set shows the mentions, both sections"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    snapshot: true
    setup_db:
      - user_id: 0
        key: "Roles"
        value: { Staff: "700000000000000001", Member: "700000000000000002", Active: "700000000000000003", Inactive: "700000000000000004", Bump: "700000000000000005" }
      - user_id: 0
        key: "Channels"
        value: { YAGPDB: "888888888888888801", Mod Log: "888888888888888802" }
    context:
      interaction: { type: slash, subcommand: view }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          embed_contains: "**Staff** <@&700000000000000001>, the role most staff commands check\\n**Member** <@&700000000000000002>, the role inactivity pings at start and end\\n**Active** <@&700000000000000003>, the role the inactivity prune picker treats as active\\n**Inactive** <@&700000000000000004>, the role inactivity reminders ping and the prune picker checks\\n**Bump** <@&700000000000000005>, the role the bump reminder pings"
    expected:
      output_equals: ""

  - name: "setup_slash: view's one embed also holds the Channels section"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    setup_db:
      - user_id: 0
        key: "Channels"
        value: { YAGPDB: "888888888888888801", Mod Log: "888888888888888802" }
    context:
      interaction: { type: slash, subcommand: view }
    assertions:
      interaction_responses:
        - kind: message
          embed_contains: "**Bot** <#888888888888888801>, the channel where helper commands run\\n**Mod log** <#888888888888888802>, the channel where hiatus and unhiatus post their record"

  - name: "setup_slash: roles with two options writes them as strings and leaves the rest"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    snapshot: true
    setup_db:
      - user_id: 0
        key: "Roles"
        value: { Staff: "700000000000000001", Bump: "700000000000000005", Extra: "keep me" }
      - user_id: 0
        key: "Channels"
        value: { YAGPDB: "888888888888888801" }
    context:
      interaction:
        type: slash
        subcommand: roles
        options: { member: 700000000000000002, staff: 700000000000000004 }
    assertions:
      db_checks:
        - user_id: 0
          key: "Roles"
          value_equals: { Staff: "700000000000000004", Member: "700000000000000002", Bump: "700000000000000005", Extra: "keep me" }
        - user_id: 0
          key: "Channels"
          value_equals: { YAGPDB: "888888888888888801" }
      interaction_responses:
        - kind: message
          ephemeral: true
          embed_contains: "**Staff** <@&700000000000000004>, the role most staff commands check (updated)\\n**Member** <@&700000000000000002>, the role inactivity pings at start and end (updated)\\n**Active** not set, pick one with /setup roles\\n**Inactive** not set, pick one with /setup roles\\n**Bump** <@&700000000000000005>, the role the bump reminder pings"

  - name: "setup_slash: roles shows only the Roles section"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    snapshot: true
    setup_db:
      - user_id: 0
        key: "Channels"
        value: { YAGPDB: "888888888888888801" }
    context:
      interaction: { type: slash, subcommand: roles, options: { bump: 700000000000000005 } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, embed_contains: "**Bump** <@&700000000000000005>, the role the bump reminder pings (updated)" }

  - name: "setup_slash: roles with no options shows the section and writes nothing"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    snapshot: true
    setup_db:
      - user_id: 0
        key: "Roles"
        value: { Staff: "700000000000000001" }
    context:
      interaction: { type: slash, subcommand: roles }
    assertions:
      db_checks:
        - { user_id: 0, key: "Roles", value_equals: { Staff: "700000000000000001" } }
      interaction_responses:
        - kind: message
          ephemeral: true
          embed_contains: "**Staff** <@&700000000000000001>, the role most staff commands check\\n**Member** not set, pick one with /setup roles"

  - name: "setup_slash: roles with no options and no dict yet writes nothing"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: roles }
    assertions:
      db_checks:
        - { user_id: 0, key: "Roles", not_exists: true }
      interaction_responses:
        - { kind: message, ephemeral: true, embed_contains: "**Staff** not set" }

  - name: "setup_slash: channels with both options writes them as strings"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    snapshot: true
    setup_db:
      - user_id: 0
        key: "Channels"
        value: { Other: "keep me" }
    context:
      interaction:
        type: slash
        subcommand: channels
        options: { bot: 888888888888888801, mod_log: 888888888888888802 }
    assertions:
      db_checks:
        - user_id: 0
          key: "Channels"
          value_equals: { YAGPDB: "888888888888888801", Mod Log: "888888888888888802", Other: "keep me" }
      interaction_responses:
        - kind: message
          ephemeral: true
          embed_contains: "**Bot** <#888888888888888801>, the channel where helper commands run (updated)\\n**Mod log** <#888888888888888802>, the channel where hiatus and unhiatus post their record (updated)"

  - name: "setup_slash: an announcement channel is accepted"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: channels, options: { mod_log: 888888888888888803 } }
    assertions:
      db_checks:
        - { user_id: 0, key: "Channels", value_equals: { Mod Log: "888888888888888803" } }
      interaction_responses:
        - { kind: message, ephemeral: true, embed_contains: "<#888888888888888803>, the channel where hiatus and unhiatus post their record (updated)" }

  - name: "setup_slash: @everyone is refused and nothing is written"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    snapshot: true
    setup_db:
      - user_id: 0
        key: "Roles"
        value: { Staff: "700000000000000001" }
    context:
      interaction: { type: slash, subcommand: roles, options: { member: 111222333444555666 } }
    assertions:
      db_checks:
        - { user_id: 0, key: "Roles", value_equals: { Staff: "700000000000000001" } }
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "`member`: @everyone can't be" }

  - name: "setup_slash: a managed role is refused and nothing is written"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    snapshot: true
    setup_db:
      - user_id: 0
        key: "Roles"
        value: { Staff: "700000000000000001" }
    context:
      interaction: { type: slash, subcommand: roles, options: { bump: 700000000000000009 } }
    assertions:
      db_checks:
        - { user_id: 0, key: "Roles", value_equals: { Staff: "700000000000000001" } }
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "`bump`: Some Bot is managed" }

  - name: "setup_slash: two refused options report the first in display order"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    snapshot: true
    setup_db:
      - user_id: 0
        key: "Roles"
        value: { Staff: "700000000000000001" }
    context:
      interaction:
        type: slash
        subcommand: roles
        options: { bump: 700000000000000009, staff: 111222333444555666 }
    assertions:
      db_checks:
        - { user_id: 0, key: "Roles", value_equals: { Staff: "700000000000000001" } }
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "`staff`: @everyone can't be" }

  - name: "setup_slash: staff from a non-Administrator is refused and nothing is written"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    snapshot: true
    setup_db:
      - user_id: 0
        key: "Roles"
        value: { Staff: "700000000000000001" }
    context:
      user: { id: 500000000000000001, username: "Invoker", roles: [700000000000000001] }
      interaction:
        type: slash
        subcommand: roles
        options: { staff: 700000000000000002, bump: 700000000000000005 }
    assertions:
      db_checks:
        - { user_id: 0, key: "Roles", value_equals: { Staff: "700000000000000001" } }
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "`staff`: only an Administrator" }

  - name: "setup_slash: a non-Administrator can still set the other roles"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    setup_db:
      - user_id: 0
        key: "Roles"
        value: { Staff: "700000000000000001" }
    context:
      user: { id: 500000000000000001, username: "Invoker", roles: [700000000000000001] }
      interaction: { type: slash, subcommand: roles, options: { bump: 700000000000000005 } }
    assertions:
      db_checks:
        - user_id: 0
          key: "Roles"
          value_equals: { Staff: "700000000000000001", Bump: "700000000000000005" }
      interaction_responses:
        - { kind: message, ephemeral: true, embed_contains: "**Bump** <@&700000000000000005>, the role the bump reminder pings (updated)" }

  - name: "setup_slash: the server owner may set staff without an Administrator role"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    context:
      user: { id: 222333444555666777, username: "Owner" }
      interaction: { type: slash, subcommand: roles, options: { staff: 700000000000000004 } }
    assertions:
      db_checks:
        - { user_id: 0, key: "Roles", value_equals: { Staff: "700000000000000004" } }

  - name: "setup_slash: a category channel is refused and nothing is written"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    snapshot: true
    setup_db:
      - user_id: 0
        key: "Channels"
        value: { YAGPDB: "888888888888888801" }
    context:
      interaction: { type: slash, subcommand: channels, options: { bot: 888888888888888804 } }
    assertions:
      db_checks:
        - { user_id: 0, key: "Channels", value_equals: { YAGPDB: "888888888888888801" } }
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "`bot`: pick a text or announcement channel." }

  - name: "setup_slash: a voice channel is refused and nothing is written"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    snapshot: true
    setup_db:
      - user_id: 0
        key: "Channels"
        value: { YAGPDB: "888888888888888801" }
    context:
      interaction: { type: slash, subcommand: channels, options: { mod_log: 888888888888888805 } }
    assertions:
      db_checks:
        - { user_id: 0, key: "Channels", value_equals: { YAGPDB: "888888888888888801" } }
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "`mod_log`: pick a text or announcement channel." }

  - name: "setup_slash: a mixed run (one valid, one invalid) writes nothing"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    snapshot: true
    setup_db:
      - user_id: 0
        key: "Roles"
        value: { Staff: "700000000000000001" }
    context:
      interaction:
        type: slash
        subcommand: roles
        options: { staff: 700000000000000002, bump: 700000000000000009 }
    assertions:
      db_checks:
        - { user_id: 0, key: "Roles", value_equals: { Staff: "700000000000000001" } }
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "`bump`: Some Bot is managed" }

  - name: "setup_slash: a mixed channels run writes nothing"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    context:
      interaction:
        type: slash
        subcommand: channels
        options: { bot: 888888888888888801, mod_log: 888888888888888804 }
    assertions:
      db_checks:
        - { user_id: 0, key: "Channels", not_exists: true }
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "`mod_log`: pick a text" }

  - name: "setup_slash: view of channels unset points at /setup channels, set shows the job"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    setup_db:
      - user_id: 0
        key: "Channels"
        value: { YAGPDB: "888888888888888801" }
    context:
      interaction: { type: slash, subcommand: channels }
    assertions:
      interaction_responses:
        - kind: message
          embed_contains: "**Bot** <#888888888888888801>, the channel where helper commands run\\n**Mod log** not set, pick one with /setup channels"

  - name: "setup_slash: a bare run prints the usage hint"
    template: "../../../commands/plumbing/setup_slash.gohtml"
    context:
      exec_data: { probe: true }
    expected:
      output_contains: "Use /setup as a slash command"
