name: "Database Command Tests"

# Shared defaults for all tests
defaults:
  user:
    id: 987654321098765432
    username: "TestUser"
    discriminator: "0001"
  channel:
    id: 123456789012345678
    name: "test-channel"
  guild:
    channels:
      - { id: 999999999, name: "yagpdb" }
    id: 111222333444555666
    name: "Test Server"
    roles:
      - { id: 888888888, name: "Staff" }

# Shared database setup
setup_db:
  - user_id: 0
    key: "Global"
    value:
      Delete Trigger Delay: 5
  - user_id: 0
    key: "Commands"
    value: # strings, as the bootstrap stores them (str); commands toInt them
      db: "456"
      embed_exec: "123"
  - user_id: 0
    key: "Channels"
    value:
      YAGPDB: 999999999
  - user_id: 0
    key: "Roles"
    value:
      Staff: 888888888

command_map:
  123: "../../../utility/embed_exec.gohtml"

# The global-data tests use `<op>:0`, which switches to user 0 only for a member with the
# Staff role (Roles "Staff" = 888888888)
tests:
  - name: "Get existing database entry"
    snapshot: true
    template: "../../../utility/db.gohtml"
    context:
      args: ["get:0", "Global"]
      user: { roles: [888888888] }
    # db.gohtml's embed_exec child is the real command; a child that fails fails the test

  - name: "Get non-existent key in a regular user's own namespace"
    snapshot: true
    template: "../../../utility/db.gohtml"
    context:
      args: ["get", "NonExistent"]
    # A regular (non-staff) user reads their own data (user ID = theirs): "No value found"

  - name: "Invalid operation"
    snapshot: true
    template: "../../../utility/db.gohtml"
    context:
      args: ["invalid_op", "SomeKey"]
    # Should complete without error (shows error message via embed)

  - name: "Keys operation on dictionary"
    snapshot: true
    template: "../../../utility/db.gohtml"
    context:
      args: ["keys:0", "Global"]
      user: { roles: [888888888] }
    # Lists keys in the Global dictionary

  - name: "db get - A long value is cut between characters, fence and all"
    template: "../../../utility/db.gohtml"
    context:
      args: ["get:0", "Long"]
      user: { roles: [888888888] }
    # "Long" is 4086 "a"s and two 3-byte characters: db keeps 4087 characters and "…",
    # which with the code fence is Discord's 4096, so embed_exec doesn't cut it again
    setup_templates: ["templates/long_value_setup.gohtml"]
    strict: true
    assertions:
      sent_messages: [{ embed_contains: 'a€…\n```' }]

  - name: "embed_exec cuts a long description between characters"
    template_source: |
      {{ $s := "" }}{{ range seq 0 4094 }}{{ $s = print $s "a" }}{{ end }}
      {{ execCC 123 nil 0 (sdict "Title" "t" "Description" (print $s "€€€")) }}
    # 4097 characters: embed_exec keeps 4095 and adds "…", Discord's 4096
    strict: true
    assertions:
      sent_messages: [{ embed_contains: 'a€…"' }]

  - name: "embed_exec keeps a description of exactly 4096 characters"
    template_source: |
      {{ $s := "" }}{{ range seq 0 4094 }}{{ $s = print $s "a" }}{{ end }}
      {{ execCC 123 nil 0 (sdict "Title" "t" "Description" (print $s "€€")) }}
    strict: true
    assertions:
      sent_messages: [{ embed_contains: 'a€€"' }]

  - name: "embed_exec cuts the description to keep the whole embed within 6000 characters"
    template_source: |
      {{ $b := "" }}{{ range seq 0 1000 }}{{ $b = print $b "b" }}{{ end }}
      {{ $f := sdict "name" "n" "value" $b }}
      {{ $s := "" }}{{ range seq 0 1982 }}{{ $s = print $s "a" }}{{ end }}
      {{ execCC 123 nil 0 (sdict "Title" "t" "Fields" (cslice $f $f $f $f)
        "Description" (print $s "€€€")) }}
    # The title (1), author name ("Test Server", 11) and four fields (1 + 1000 each) leave
    # 1984 characters: embed_exec keeps 1983 of the 1985 and adds "…"
    strict: true
    assertions:
      sent_messages: [{ embed_contains: 'a€…"' }]

  - name: "embed_exec drops the description when the rest of the embed leaves no room"
    snapshot: true
    template_source: |
      {{ $b := "" }}{{ range seq 0 1000 }}{{ $b = print $b "b" }}{{ end }}
      {{ $f := sdict "name" "n" "value" $b }}
      {{ execCC 123 nil 0 (sdict "Title" "t" "Fields" (cslice $f $f $f $f $f $f)
        "Description" "a") }}
    # Six fields (1 + 1000 each) are over 6000 already: the description goes (the snapshot
    # has none) and Discord refuses the embed anyway, a warning outside strict mode
    expected:
      warning_contains: "6000"
    assertions:
      sent_messages: [{ embed_title: "t" }]
