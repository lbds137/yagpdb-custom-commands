name: "Database Command Tests"

# Shared defaults for all tests
defaults:
  user:
    id: 987654321098765432
    username: "TestUser"
    discriminator: "0001"
  channel:
    id: 123456789012345678
    name: "test-channel"
  guild:
    channels:
      - { id: 999999999, name: "yagpdb" }
    id: 111222333444555666
    name: "Test Server"
    roles:
      - { id: 888888888, name: "Staff" }

# Shared database setup
setup_db:
  - user_id: 0
    key: "Global"
    value:
      Delete Trigger Delay: 5
  - user_id: 0
    key: "Commands"
    value: # strings, as the bootstrap stores them (str); commands toInt them
      db: "456"
      embed_exec: "123"
  - user_id: 0
    key: "Channels"
    value:
      YAGPDB: 999999999
  - user_id: 0
    key: "Roles"
    value:
      Staff: 888888888

command_map:
  123: "../../../utility/embed_exec.gohtml"

# The global-data tests use `<op>:0`, which switches to user 0 only for a member with the
# Staff role (Roles "Staff" = 888888888)
tests:
  - name: "Get existing database entry"
    snapshot: true
    template: "../../../utility/db.gohtml"
    context:
      args: ["get:0", "Global"]
      user: { roles: [888888888] }
    # db.gohtml's embed_exec child is the real command; a child that fails fails the test

  - name: "Get non-existent key in a regular user's own namespace"
    snapshot: true
    template: "../../../utility/db.gohtml"
    context:
      args: ["get", "NonExistent"]
    # A regular (non-staff) user reads their own data (user ID = theirs): "No value found"

  - name: "Invalid operation"
    snapshot: true
    template: "../../../utility/db.gohtml"
    context:
      args: ["invalid_op", "SomeKey"]
    # Should complete without error (shows error message via embed)

  - name: "Keys operation on dictionary"
    snapshot: true
    template: "../../../utility/db.gohtml"
    context:
      args: ["keys:0", "Global"]
      user: { roles: [888888888] }
    # Lists keys in the Global dictionary
