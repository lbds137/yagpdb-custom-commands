name: "embed_exec (description truncation math)"
description: >
  Direct runs of embed_exec.gohtml via ExecData, isolating its description-length math
  (lines ~47-68) from any real command's fan-out. Discord allows 4096 characters of
  description, and 6000 total across title, description, field names/values and author
  name; embed_exec cuts the description to fit both.

defaults:
  user:
    id: 1
    username: "Tester"
  channel:
    id: 100
    name: "general"
  guild:
    id: 200
    name: "G"

tests:
  - name: "embed_exec: a description over 4096 alone is cut to exactly 4096 (4095 chars + the ellipsis)"
    template: "../../../commands/plumbing/embed_exec.gohtml"
    strict: true
    context:
      exec_data: { Title: "T", Description: "" }
    assertions:
      sent_messages:
        - embed_contains: '"description": "…"'

  - name: "embed_exec: fields that push the whole embed past 6000 shrink the description budget further"
    template: "../../../commands/plumbing/embed_exec.gohtml"
    strict: true
    context:
      exec_data:
        Title: "T"
        Description: ""
        Fields:
          - { name: "F1", value: "" }
          - { name: "F2", value: "" }
          - { name: "F3", value: "" }
          - { name: "F4", value: "" }
          - { name: "F5", value: "" }
    assertions:
      sent_messages:
        - embed_contains: '"description": "…"'

  - name: "embed_exec: a title over 256 characters truncates to 255 chars + the ellipsis"
    template: "../../../commands/plumbing/embed_exec.gohtml"
    strict: true
    context:
      exec_data: { Title: "" }
    assertions:
      sent_messages:
        - embed_title: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx…"

  - name: "embed_exec: a title of exactly 256 characters is sent unchanged"
    template: "../../../commands/plumbing/embed_exec.gohtml"
    strict: true
    context:
      exec_data: { Title: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }
    assertions:
      sent_messages:
        - embed_title: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

  - name: "embed_exec: a multi-byte title truncates by runes, not bytes"
    template: "../../../commands/plumbing/embed_exec.gohtml"
    strict: true
    context:
      exec_data: { Title: "אאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאא" }
    assertions:
      sent_messages:
        - embed_title: "אאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאא…"

  - name: "embed_exec: a 300-char title shrinks the description budget by its truncated (256), not raw, length"
    template: "../../../commands/plumbing/embed_exec.gohtml"
    strict: true
    context:
      exec_data:
        Title: ""
        Description: ""
        Fields:
          - { name: "F1", value: "" }
          - { name: "F2", value: "" }
    assertions:
      sent_messages:
        - embed_contains: '"description": "…"'

  # Respond and Embeds are opt-in: a slash root's execCC answers the interaction the child
  # inherits, and a list of embeds goes out as one message. The root here is a bare
  # template_source; the child is the real embed_exec.
  - name: "embed_exec Respond: the embed answers the interaction publicly and deletes nothing"
    template_source: |
      {{- /*
        Trigger type: `Slash Command`
        Trigger: `probe`
        Group: `Utility`
        Defer mode: `None`
      */ -}}
      {{ execCC 1 .Channel.ID 0 (sdict "Respond" true "Title" "Answer" "Description" "body") }}
    command_map:
      1: "../../../commands/plumbing/embed_exec.gohtml"
    context:
      interaction: { type: slash }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: false, embed_title: "Answer", embed_contains: "body" }
      deletions: []

  - name: "embed_exec Respond: DeleteResponse makes the answer ephemeral instead of deleting it"
    template_source: |
      {{- /*
        Trigger type: `Slash Command`
        Trigger: `probe`
        Group: `Utility`
        Defer mode: `None`
      */ -}}
      {{ execCC 1 .Channel.ID 0 (sdict "Respond" true "Title" "Oops" "DeleteResponse" true "DeleteDelay" 5) }}
    command_map:
      1: "../../../commands/plumbing/embed_exec.gohtml"
    context:
      interaction: { type: slash }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, embed_title: "Oops" }
      deletions: []

  - name: "embed_exec Respond: Components ride the interaction response"
    template_source: |
      {{- /*
        Trigger type: `Slash Command`
        Trigger: `probe`
        Group: `Utility`
        Defer mode: `None`
      */ -}}
      {{ execCC 1 .Channel.ID 0 (sdict "Respond" true "Title" "Buttons" "Components" (cbutton "label" "Go" "custom_id" "probe:go")) }}
    command_map:
      1: "../../../commands/plumbing/embed_exec.gohtml"
    context:
      interaction: { type: slash }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: false, embed_title: "Buttons", components_contains: "probe:go" }

  - name: "embed_exec Embeds: a list goes out as one message, each embed with the same author"
    template_source: |
      {{ execCC 1 nil 0 (sdict "AuthorID" .User.ID "Embeds" (cslice
        (sdict "Title" "First" "Description" "one" "Color" 255)
        (sdict "Title" "Second" "Fields" (cslice (sdict "name" "n" "value" "v" "inline" false)))
      )) }}
    command_map:
      1: "../../../commands/plumbing/embed_exec.gohtml"
    snapshot: true
    context:
      user: { id: 500000000000000001, username: "Tester" }
    assertions:
      sent_messages:
        - { embed_title: "First", embed_contains: "one" }
        - { embed_title: "Second", embed_contains: '"name": "n"' }
        - { embed_contains: "https://discordapp.com/users/500000000000000001" }

  - name: "embed_exec Embeds + Respond: a list answers the interaction in one response"
    template_source: |
      {{- /*
        Trigger type: `Slash Command`
        Trigger: `probe`
        Group: `Utility`
        Defer mode: `None`
      */ -}}
      {{ execCC 1 .Channel.ID 0 (sdict "Respond" true "Embeds" (cslice
        (sdict "Title" "A")
        (sdict "Title" "B")
      )) }}
    command_map:
      1: "../../../commands/plumbing/embed_exec.gohtml"
    context:
      interaction: { type: slash }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: false, embed_title: "A" }
      sent_messages:
        - embed_title: "B"

  - name: "embed_exec Embeds: the 6000 total covers all embeds, so a second long description is cut"
    template_source: |
      {{ execCC 1 nil 0 (sdict "Embeds" (cslice
        (sdict "Title" "One" "Description" "")
        (sdict "Title" "Two" "Description" "")
      )) }}
    command_map:
      1: "../../../commands/plumbing/embed_exec.gohtml"
    snapshot: true
    assertions:
      sent_messages:
        - { embed_title: "One" }
        - { embed_title: "Two", embed_contains: "y…" }
