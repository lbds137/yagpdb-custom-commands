name: "embed_exec (description truncation math)"
description: >
  Direct runs of embed_exec.gohtml via ExecData, isolating its description-length math
  (lines ~47-68) from any real command's fan-out. Discord allows 4096 characters of
  description, and 6000 total across title, description, field names/values and author
  name; embed_exec cuts the description to fit both.

defaults:
  user:
    id: 1
    username: "Tester"
  channel:
    id: 100
    name: "general"
  guild:
    id: 200
    name: "G"

tests:
  - name: "embed_exec: a description over 4096 alone is cut to exactly 4096 (4095 chars + the ellipsis)"
    template: "../../../commands/plumbing/embed_exec.gohtml"
    strict: true
    context:
      exec_data: { Title: "T", Description: "" }
    assertions:
      sent_messages:
        - embed_contains: '"description": "…"'

  - name: "embed_exec: fields that push the whole embed past 6000 shrink the description budget further"
    template: "../../../commands/plumbing/embed_exec.gohtml"
    strict: true
    context:
      exec_data:
        Title: "T"
        Description: ""
        Fields:
          - { name: "F1", value: "" }
          - { name: "F2", value: "" }
          - { name: "F3", value: "" }
          - { name: "F4", value: "" }
          - { name: "F5", value: "" }
    assertions:
      sent_messages:
        - embed_contains: '"description": "…"'

  - name: "embed_exec: a title over 256 characters truncates to 255 chars + the ellipsis"
    template: "../../../commands/plumbing/embed_exec.gohtml"
    strict: true
    context:
      exec_data: { Title: "" }
    assertions:
      sent_messages:
        - embed_title: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx…"

  - name: "embed_exec: a title of exactly 256 characters is sent unchanged"
    template: "../../../commands/plumbing/embed_exec.gohtml"
    strict: true
    context:
      exec_data: { Title: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }
    assertions:
      sent_messages:
        - embed_title: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

  - name: "embed_exec: a multi-byte title truncates by runes, not bytes"
    template: "../../../commands/plumbing/embed_exec.gohtml"
    strict: true
    context:
      exec_data: { Title: "אאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאא" }
    assertions:
      sent_messages:
        - embed_title: "אאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאאא…"

  - name: "embed_exec: a 300-char title shrinks the description budget by its truncated (256), not raw, length"
    template: "../../../commands/plumbing/embed_exec.gohtml"
    strict: true
    context:
      exec_data:
        Title: ""
        Description: ""
        Fields:
          - { name: "F1", value: "" }
          - { name: "F2", value: "" }
    assertions:
      sent_messages:
        - embed_contains: '"description": "…"'
