name: "inactivity (the periodic prune cycle)"

# The prune subaction's kick is behind the picker panel's confirm now (panel 99,
# inactivity_prune_pick), on both paths: `prune <user>` execCCs the picker with
# ExecData (User, Spawner) instead of kicking, and a bare `prune` posts the user
# select. date/end/remind/start are untouched. 600000000000000001 is the staffer
# (Staff role 111111111111111111), 700000000000000001 the prune target (Active role
# 333333333333333333, Inactive role 444444444444444444), 800000000000000001 a
# non-staff member. Message 7 is the panel the clicks land on.

defaults:
  guild:
    channels:
      - { id: 999999999, name: "yagpdb" }
    roles:
      - { id: 111111111111111111, name: "Mod" }
      - { id: 333333333333333333, name: "Active" }
      - { id: 444444444444444444, name: "Inactive" }
      - { id: 555555555555555555, name: "Member" }
  channel:
    id: 123456789012345678
  user: { id: 600000000000000001, username: "Staffer", roles: [111111111111111111] }
  members: [600000000000000001, 700000000000000001, 800000000000000001]

setup_db:
  - user_id: 0
    key: "Global"
    value: { Delete Trigger Delay: 5, Delete Response Delay: 10, Command Prefix: "-", Embed Color: 3447003 }
  - user_id: 0
    key: "Commands"
    value: { embed_exec: "1", db_slash: "90", inactivity_prune_pick: "99" }
  - user_id: 0
    key: "Channels"
    value: { YAGPDB: 999999999 }
  - user_id: 0
    key: "Roles"
    value: { Staff: "111111111111111111", Active: "333333333333333333", Inactive: "444444444444444444", Member: "555555555555555555" }
  - user_id: 0
    key: "Inactivity Prune"
    value: { Previous Date: "2026-09-01", Next Date: "2026-10-01", Message Threshold: 0, Minute Threshold: 100 }

command_map:
  1: "../../../commands/plumbing/embed_exec.gohtml"
  90: "../../../commands/db/db_slash.gohtml"
  99: "../../../commands/members/inactivity_prune_pick.gohtml"

tests:
  # The text path no longer kicks directly: it hands the target to the picker, which
  # posts the confirm state (one confirm mechanism, no bypass).
  - name: "inactivity: prune <inactive user> posts the confirm panel instead of kicking"
    template: "../../../commands/members/inactivity.gohtml"
    context:
      message_content: "-inactivity prune 700000000000000001"
      member_roles: { 700000000000000001: [444444444444444444] }
    assertions:
      execs: []
      scheduled_runs: []
      sent_messages:
        - channel_id: 123456789012345678
          embed_contains: "will be kicked"
          components_contains: "templates-ip:600000000000000001:kick"

  - name: "inactivity: prune with an unknown user keeps the text path's error embed"
    template: "../../../commands/members/inactivity.gohtml"
    context:
      message_content: "-inactivity prune 999999999999999999"
    assertions:
      execs: []
      sent_messages:
        - { embed_title: "Invalid User Parameter", embed_contains: "⚠️ You must enter a valid user parameter!" }

  - name: "inactivity: a bare prune posts the picker panel"
    template: "../../../commands/members/inactivity.gohtml"
    context:
      message_content: "-inactivity prune"
    assertions:
      sent_messages:
        - embed_title: "Inactivity Prune"
          embed_contains: "Next prune: 2026-10-01"
          components_contains: "templates-ip:600000000000000001"

  - name: "inactivity: the bare-prune panel (user select, prev/next dates)"
    template: "../../../commands/members/inactivity.gohtml"
    snapshot: true
    context:
      message_content: "-inactivity prune"

  - name: "inactivity: date with a param still goes through db_slash"
    template: "../../../commands/members/inactivity.gohtml"
    context:
      message_content: "-inactivity date 2026-11-01"
    assertions:
      db_checks:
        - { user_id: 0, key: "Inactivity Prune", value_contains: "2026-11-01" }

  - name: "inactivity_prune_pick: selecting an inactive member shows the confirm with Kick enabled"
    template: "../../../commands/members/inactivity_prune_pick.gohtml"
    snapshot: true
    context:
      member_roles: { 700000000000000001: [444444444444444444] }
      messages:
        - { id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Inactivity Prune" }] }
      interaction:
        { type: component, custom_id: "ip:600000000000000001", message_id: 7,
          component: user_menu, values: ["700000000000000001"] }
    assertions:
      execs: []
      interaction_responses:
        - kind: update
          embed_contains: "<@700000000000000001> will be kicked!"
          components_contains: '"style": 4'
      edited_messages:
        - channel_id: 123456789012345678
          components_contains: "templates-ip:600000000000000001:kick"

  - name: "inactivity_prune_pick: selecting an active member disables Kick"
    template: "../../../commands/members/inactivity_prune_pick.gohtml"
    context:
      member_roles: { 700000000000000001: [333333333333333333] }
      messages:
        - { id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Inactivity Prune" }] }
      interaction:
        { type: component, custom_id: "ip:600000000000000001", message_id: 7,
          component: user_menu, values: ["700000000000000001"] }
    assertions:
      execs: []
      interaction_responses:
        - kind: update
          embed_contains: "is not inactive."
          components_contains: '"disabled": true'
      edited_messages:
        - channel_id: 123456789012345678
          components_contains: "templates-ip:600000000000000001:cancel"

  - name: "inactivity_prune_pick: Kick re-checks, execs, posts the result and restores the picker"
    template: "../../../commands/members/inactivity_prune_pick.gohtml"
    context:
      member_roles: { 700000000000000001: [444444444444444444] }
      messages:
        - { id: 7, channel_id: 123456789012345678, author_id: 1234567890,
            embeds: [{ title: "Inactivity Prune", description: "🥾 <@700000000000000001> will be kicked!" }] }
      interaction: { type: component, custom_id: "ip:600000000000000001:kick", message_id: 7 }
      exec_responses:
        # moderation GenericCmdResp(MAKick, ...): "<emoji> <prefix> `<user>`"
        'kick 700000000000000001 "pruned due to inactivity"': "👢 Kicked `Target#0`"
    assertions:
      execs:
        - { line: 'kick 700000000000000001 "pruned due to inactivity"' }
      interaction_responses:
        - { kind: update, components_contains: "Pick a member to prune" }
      edited_messages:
        - channel_id: 123456789012345678
          components_contains: "Pick a member to prune"
      sent_messages:
        - channel_id: 123456789012345678
          embed_title: "Inactivity Prune"
          embed_contains: "has been kicked!"

  # exec returns failure as text in these cases (moderation/commands.go Kick RunFunc:
  # "Member not found"; commands/tmplexec.go execCmd: "Error: "+err, "Unknown command").
  # Errors the kick command RETURNS (hierarchy, perms) make exec itself error, which
  # the template catches; the test after this one declares that with exec_errors.
  - name: "inactivity_prune_pick: a kick that comes back as failure text is reported, not 'kicked'"
    template: "../../../commands/members/inactivity_prune_pick.gohtml"
    context:
      member_roles: { 700000000000000001: [444444444444444444] }
      messages:
        - { id: 7, channel_id: 123456789012345678, author_id: 1234567890,
            embeds: [{ title: "Inactivity Prune", description: "🥾 <@700000000000000001> will be kicked!" }] }
      interaction: { type: component, custom_id: "ip:600000000000000001:kick", message_id: 7 }
      exec_responses:
        'kick 700000000000000001 "pruned due to inactivity"': "Member not found"
    assertions:
      execs:
        - { line: 'kick 700000000000000001 "pruned due to inactivity"' }
      sent_messages:
        - channel_id: 123456789012345678
          embed_title: "Inactivity Prune"
          embed_contains: "Couldn't kick"

  - name: "inactivity_prune_pick: a kick that errors (exec/execadmin, run) is caught and reported, not 'kicked'"
    template: "../../../commands/members/inactivity_prune_pick.gohtml"
    context:
      member_roles: { 700000000000000001: [444444444444444444] }
      messages:
        - { id: 7, channel_id: 123456789012345678, author_id: 1234567890,
            embeds: [{ title: "Inactivity Prune", description: "🥾 <@700000000000000001> will be kicked!" }] }
      interaction: { type: component, custom_id: "ip:600000000000000001:kick", message_id: 7 }
      exec_errors:
        'kick 700000000000000001 "pruned due to inactivity"': "Missing Permissions"
    assertions:
      execs:
        - { line: 'kick 700000000000000001 "pruned due to inactivity"' }
      sent_messages:
        - channel_id: 123456789012345678
          embed_title: "Inactivity Prune"
          embed_contains: "exec/execadmin, run: Missing Permissions"

  - name: "inactivity_prune_pick: Kick on a member who left shows the verdict, no exec"
    template: "../../../commands/members/inactivity_prune_pick.gohtml"
    context:
      members: [600000000000000001]
      messages:
        - { id: 7, channel_id: 123456789012345678, author_id: 1234567890,
            embeds: [{ title: "Inactivity Prune", description: "🥾 <@700000000000000001> will be kicked!" }] }
      interaction: { type: component, custom_id: "ip:600000000000000001:kick", message_id: 7 }
    assertions:
      execs: []
      interaction_responses:
        - { kind: update, embed_contains: "is no longer in the server." }
      sent_messages: []

  - name: "inactivity_prune_pick: Kick on a member who became active shows the verdict, no exec"
    template: "../../../commands/members/inactivity_prune_pick.gohtml"
    context:
      member_roles: { 700000000000000001: [333333333333333333] }
      messages:
        - { id: 7, channel_id: 123456789012345678, author_id: 1234567890,
            embeds: [{ title: "Inactivity Prune", description: "🥾 <@700000000000000001> will be kicked!" }] }
      interaction: { type: component, custom_id: "ip:600000000000000001:kick", message_id: 7 }
    assertions:
      execs: []
      interaction_responses:
        - { kind: update, embed_contains: "is not inactive." }
      sent_messages: []

  - name: "inactivity_prune_pick: Cancel restores the picker state"
    template: "../../../commands/members/inactivity_prune_pick.gohtml"
    context:
      messages:
        - { id: 7, channel_id: 123456789012345678, author_id: 1234567890,
            embeds: [{ title: "Inactivity Prune", description: "🥾 <@700000000000000001> will be kicked!" }] }
      interaction: { type: component, custom_id: "ip:600000000000000001:cancel", message_id: 7 }
    assertions:
      execs: []
      interaction_responses:
        - { kind: update, embed_contains: "Pick a member to review for pruning." }
      edited_messages:
        - channel_id: 123456789012345678
          components_contains: "Pick a member to prune"

  - name: "inactivity_prune_pick: the ExecData path posts the confirm for an inactive member"
    template: "../../../commands/members/inactivity_prune_pick.gohtml"
    context:
      member_roles: { 700000000000000001: [444444444444444444] }
      exec_data: { User: 700000000000000001, Spawner: 600000000000000001 }
    assertions:
      execs: []
      interaction_responses: []
      sent_messages:
        - channel_id: 123456789012345678
          embed_contains: "will be kicked!"
          components_contains: "templates-ip:600000000000000001:kick"

  - name: "inactivity_prune_pick: the ExecData path posts the verdict for an active member"
    template: "../../../commands/members/inactivity_prune_pick.gohtml"
    context:
      member_roles: { 700000000000000001: [333333333333333333] }
      exec_data: { User: 700000000000000001, Spawner: 600000000000000001 }
    assertions:
      sent_messages:
        - channel_id: 123456789012345678
          embed_contains: "is not inactive."
          components_contains: '"disabled": true'

  - name: "inactivity_prune_pick: a non-staff click is refused ephemerally"
    template: "../../../commands/members/inactivity_prune_pick.gohtml"
    context:
      user: { id: 800000000000000001, username: "Member", roles: [555555555555555555] }
      member_roles: { 700000000000000001: [444444444444444444] }
      messages:
        - { id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Inactivity Prune" }] }
      interaction:
        { type: component, custom_id: "ip:600000000000000001", message_id: 7,
          component: user_menu, values: ["700000000000000001"] }
    assertions:
      execs: []
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "⚠️ Only staff can prune members." }
      edited_messages: []
