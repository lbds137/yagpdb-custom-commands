name: "timestamp_slash (/timestamp)"
description: >
  The slash root of timestamp: ONE execCC to embed_exec with Respond (public); anything
  that is not a snowflake or a mention is an ephemeral refusal with no execCC. The known
  ID is Discord's own documented example snowflake, as in timestamp_tests:
  (175928847299117063 // 4194304) + 1420070400000 = 1462015105796 ms
  = 2016-04-30T11:18:25.796Z, computed independently of the command's own code.

defaults:
  user: { id: 111111111111111111, username: "Invoker" }
  channel: { id: 123456789012345678 }
  guild:
    id: 333333333333333333
    name: "Test Server"

setup_db:
  - user_id: 0
    key: "Global"
    value: { Embed Color: 9807270 }
  - user_id: 0
    key: "Commands"
    value: { embed_exec: "1" }

command_map:
  1: "../../../commands/plumbing/embed_exec.gohtml"

tests:
  # command_status: execCC fails as YAGPDB's does for a command whose group is disabled
  - name: "timestamp_slash: an embed_exec in a disabled group is an ephemeral refusal"
    template: "../../../commands/general/timestamp_slash.gohtml"
    context:
      interaction: { type: slash }
    command_status:
      1: group_disabled
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "This command isn't set up on this server yet." }

  # config_sync is an Interval command: execCC to it errors as YAGPDB's does for a stale id
  - name: "timestamp_slash: an embed_exec id YAGPDB cannot execCC is an ephemeral refusal"
    template: "../../../commands/general/timestamp_slash.gohtml"
    context:
      interaction: { type: slash }
    command_map:
      1: "../../../commands/plumbing/config_sync.gohtml"
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "This command isn't set up on this server yet." }

  - name: "timestamp_slash: no id decodes the invoker's own ID"
    template: "../../../commands/general/timestamp_slash.gohtml"
    context:
      interaction: { type: slash }
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: false
          embed_title: "Timestamp Parser"
          embed_contains: "111111111111111111"

  - name: "timestamp_slash: a bare snowflake decodes to its known time"
    template: "../../../commands/general/timestamp_slash.gohtml"
    context:
      interaction: { type: slash, options: { id: "175928847299117063" } }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: false
          embed_title: "Timestamp Parser"
          embed_contains: "175928847299117063"
      sent_messages:
        - { embed_contains: "2016-04-30 11:18:25.796 +0000 UTC" }

  - name: "timestamp_slash: a user mention <@id>"
    template: "../../../commands/general/timestamp_slash.gohtml"
    context:
      interaction: { type: slash, options: { id: "<@175928847299117063>" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: false, embed_contains: "2016-04-30 11:18:25.796 +0000 UTC" }

  - name: "timestamp_slash: a nickname mention <@!id>"
    template: "../../../commands/general/timestamp_slash.gohtml"
    context:
      interaction: { type: slash, options: { id: "<@!175928847299117063>" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: false, embed_contains: "2016-04-30 11:18:25.796 +0000 UTC" }

  - name: "timestamp_slash: a role mention <@&id>"
    template: "../../../commands/general/timestamp_slash.gohtml"
    context:
      interaction: { type: slash, options: { id: "<@&175928847299117063>" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: false, embed_contains: "2016-04-30 11:18:25.796 +0000 UTC" }

  - name: "timestamp_slash: a channel mention <#id>, with surrounding spaces"
    template: "../../../commands/general/timestamp_slash.gohtml"
    context:
      interaction: { type: slash, options: { id: "  <#175928847299117063> " } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: false, embed_contains: "2016-04-30 11:18:25.796 +0000 UTC" }

  # An ephemeral response is itself a sent message in the emulator, so `sent_messages: []`
  # can't pin "no extra channel message"; the snapshot lists every sent message, so a
  # stray embed_exec send would change it. Every refusal case is snapshotted.
  - name: "timestamp_slash: invalid input is an ephemeral refusal with no execCC"
    template: "../../../commands/general/timestamp_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, options: { id: "notanumber" } }
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          content_contains: "`notanumber` isn't a Discord ID or mention."

  - name: "timestamp_slash: a short number is refused too"
    template: "../../../commands/general/timestamp_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, options: { id: "12345" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "`12345` isn't a Discord ID" }

  - name: "timestamp_slash: a 20-digit id is refused, not decoded as MaxInt64"
    template: "../../../commands/general/timestamp_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, options: { id: "12345678901234567890" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "`12345678901234567890` isn't a Discord ID" }

  - name: "timestamp_slash: a 20-digit mention is refused too"
    template: "../../../commands/general/timestamp_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, options: { id: "<@12345678901234567890>" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "isn't a Discord ID or mention." }

  - name: "timestamp_slash: backticks in the echoed input become quotes"
    template: "../../../commands/general/timestamp_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, options: { id: "a`b`c" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "`a'b'c` isn't a Discord ID or mention." }

  - name: "timestamp_slash: without embed_exec in Commands is an ephemeral refusal"
    template: "../../../commands/general/timestamp_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash }
    setup_db:
      - user_id: 0
        key: "Commands"
        value: { }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "This command isn't set up on this server yet." }

  - name: "timestamp_slash: a bare run prints the usage hint"
    template: "../../../commands/general/timestamp_slash.gohtml"
    context:
      exec_data: { probe: true }
    expected:
      output_contains: "Use /timestamp as a slash command"

  - name: "timestamp_slash: the echoed input is cut to exactly 100 characters"
    template: "../../../commands/general/timestamp_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, options: { id: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" } }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          content_contains: "`aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa` isn't a Discord ID or mention."
