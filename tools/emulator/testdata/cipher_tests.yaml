name: "cipher_slash (/cipher encode, decode, crack, newcipher)"

# Vigenère encode answers publicly; decode and crack answer ephemerally, and every
# refusal is ephemeral. The canonical vector is Wikipedia's (LEMON / ATTACKATDAWN ->
# LXFOPVEFRNHR). The crack fixture is the 581-letter prose below encoded with the
# 10-letter keyword NIGHTHOUSE; the encode test pins the whole ciphertext byte for
# byte, so the crack input is exactly what this command's own encode produces.
# The command reads no database, so there is no setup_db.
#
# newcipher decodes her 2009 NewCipher: the seed is the middle character's code
# point (Random(seed + length)), every other position is unshifted by nextInt(125)
# - 25, and the seed position (length/2) passes through untouched. The two truth
# vectors are external truth: produced by her actual 2009 Cipher.java on a real
# JVM (eclipse-temurin:8, podman) in cipher unit 1, pinned in the spec. Vector 1's
# seed character is a space at position 25 (the odd-length edge); vector 2's is an
# 'e' at position 42. The full-plaintext assertions pin the seed-position
# pass-through: any shift applied there would break them. The ciphertexts are
# written as \uXXXX escapes because the raw format lands on control code points.
# The six newcipher non-ASCII vectors below (Cyrillic to the lone surrogate) come
# from her Cipher.java on JDK 8 (podman, 2026-10-18) and pin the
# UTF-16 code-unit behaviour (astral = two units, (char) wrap both ways).

defaults:
  user: { id: 500000000000000001, username: "Invoker" }
  channel: { id: 123456789012345678 }
  guild:
    id: 333333333333333333
    name: "Test Server"

tests:
  - name: "encode: the canonical vector LEMON / ATTACKATDAWN answers publicly with LXFOPVEFRNHR"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: encode, options: { key: "LEMON", text: "ATTACKATDAWN" } }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: false
          embed_title: "Vigenère ciphertext"
          embed_contains: "LXFOPVEFRNHR"

  - name: "encode: case is preserved, non-letters pass through, the key advances on letters only"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: encode, options: { key: "night", text: "Attack at dawn!" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: false, embed_contains: "Nbzhvx iz ktjv!" }

  - name: "decode: the roundtrip with a mixed-case key answers privately with the plaintext"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: decode, options: { key: "NiGhT", text: "Nbzhvx iz ktjv!" } }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          embed_title: "Vigenère plaintext"
          embed_contains: "Attack at dawn!"

  - name: "encode: a keyword with non-letters is an ephemeral refusal"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: encode, options: { key: "L3MON", text: "ATTACKATDAWN" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "letters only" }

  - name: "encode: text with no letters at all is an ephemeral refusal"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: encode, options: { key: "LEMON", text: "12345 !!!" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "no letters" }

  - name: "decode: text with no letters at all is an ephemeral refusal"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: decode, options: { key: "LEMON", text: "12345 !!!" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "no letters" }

  - name: "crack: text with no letters at all is an ephemeral not-enough-text refusal"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: crack, options: { text: "12345 !!!" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "Not enough text to attack" }

  - name: "crack: seven letters is under the eight-letter minimum"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: crack, options: { text: "Hi there!" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "need at least 8 letters" }

  - name: "crack: structureless letters get no key guessed, privately"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction:
        type: slash
        subcommand: crack
        options: { text: "dbvjuehinqkgylznazyumrrgxcbxnotyeujpbref" }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          content_contains: "No clear Vigenère key found."

  - name: "encode: the crack fixture, prose with NIGHTHOUSE, is pinned byte for byte"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction:
        type: slash
        subcommand: encode
        options:
          key: "NIGHTHOUSE"
          text: >-
            The old lighthouse keeper wrote every evening in a small blue
            notebook. She recorded the weather, the ships that passed beyond
            the rocks, and the small repairs she made to the lamp. Visitors
            rarely climbed the long stair, so the notebook became her
            closest companion. Each page began with the date and ended with
            a single sentence about the sea. In winter the waves struck the
            tower like a fist, and she learned to read their rhythm the way
            a doctor reads a pulse. When the fog arrived, thick and grey,
            she sounded the horn at steady intervals and trusted the pattern
            more than her own eyes. Years later a young historian found the
            notebooks in a wooden box and discovered a whole life recorded
            in plain, patient sentences.
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: false
          embed_title: "Vigenère ciphertext"
          embed_contains: >-
            Gpk vek zcylgpubll yywtrz cyhas ynieg kcxuwhy ma i yttsz vdyr
            vuaxicic. Wum xlvvfxwh gpk dxhhbwv, gpk zapdm llnb vhlzsx tilwtk
            mos lggxa, guw avy kqntr yxwocjw fpk ttks ng xum rhfw. Jckmgwxz
            khfydc ptotulr nzi ywtn laocj, wb bnl gvhytsbs hlvhay zie
            krvllgn uszxgubvb. Ysgu xgnx isasr jqzo mos xsxr itk xuryv avbn
            h lpbadi fmtaxuqy sfbcz aal gys. Ma eoumlf nzi jibll zhlmgx bnl
            mvkyj pvsk h ypgn, srq anl elolfiq bu yxhr nzivz xoravg llr egf
            t kcwlse zkhwz o jmpfm. Coxu hbw jbo gykpjyv, xuqir tur ajil,
            anl lvihviq bnl avfh sx fbkhwf whliedgsl hbx lvhazlw avy hegbkyg
            tclw xuit oxy cqf ilmy. Fxhfm degmx h rvihy lvazvkpoh xshvj aal
            biliowurl pb u osblku uvl ufh qqyjhcslwh n envel zcxi emivkksx
            ar ctgpg, wonaiab ylgashuif.

  - name: "crack: the NIGHTHOUSE ciphertext is cracked, privately, with a confidence line"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction:
        type: slash
        subcommand: crack
        options:
          text: >-
            Gpk vek zcylgpubll yywtrz cyhas ynieg kcxuwhy ma i yttsz vdyr
            vuaxicic. Wum xlvvfxwh gpk dxhhbwv, gpk zapdm llnb vhlzsx tilwtk
            mos lggxa, guw avy kqntr yxwocjw fpk ttks ng xum rhfw. Jckmgwxz
            khfydc ptotulr nzi ywtn laocj, wb bnl gvhytsbs hlvhay zie
            krvllgn uszxgubvb. Ysgu xgnx isasr jqzo mos xsxr itk xuryv avbn
            h lpbadi fmtaxuqy sfbcz aal gys. Ma eoumlf nzi jibll zhlmgx bnl
            mvkyj pvsk h ypgn, srq anl elolfiq bu yxhr nzivz xoravg llr egf
            t kcwlse zkhwz o jmpfm. Coxu hbw jbo gykpjyv, xuqir tur ajil,
            anl lvihviq bnl avfh sx fbkhwf whliedgsl hbx lvhazlw avy hegbkyg
            tclw xuit oxy cqf ilmy. Fxhfm degmx h rvihy lvazvkpoh xshvj aal
            biliowurl pb u osblku uvl ufh qqyjhcslwh n envel zcxi emivkksx
            ar ctgpg, wonaiab ylgashuif.
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          embed_title: "Vigenère crack"
          embed_contains: "NIGHTHOUSE"
      # the same private response, one substring per entry
      sent_messages:
        - { ephemeral: true, embed_contains: "Confidence" }
        - { ephemeral: true, embed_contains: "high" }
        - { ephemeral: true, embed_contains: "average index of coincidence" }
        - { ephemeral: true, embed_contains: "lighthouse keeper" }

  - name: "encode: text over 2000 characters is an ephemeral refusal"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "2000" }
    context:
      interaction:
        type: slash
        subcommand: encode
        options: { key: "LEMON", text: "" }

  - name: "encode: the 2000 cap counts characters, not bytes"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction:
        type: slash
        subcommand: encode
        options: { key: "LEMON", text: "ééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééabc" }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: false
          embed_title: "Vigenère ciphertext"

  - name: "newcipher: truth vector 1 (her 2009 Cipher.java, JDK 8) decodes exactly, privately"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: newcipher, options: { text: "\u0045\u008A\u0092\u0068\u00B1\u00C7\u0075\u006D\u0078\u0025\u007C\u0095\u005A\u006A\u009E\u0010\u0055\u00AD\u00A1\u005C\u009C\u00D5\u005D\u00A6\u006D\u0020\u00AE\u00B9\u008B\u00C7\u0028\u00CF\u008A\u0097\u002F\u00B3\u0087\u00CA\u00B7\u0074\u0060\u008F\u0083\u0081\u0024\u009E\u0088\u0065\u007B\u00A5\u001E" } }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          embed_title: "NewCipher plaintext"
          # 51 chars, odd length: the seed character is a space at position 25 and
          # passes through unshifted; the full-sentence assert pins that pass-through
          embed_contains: "The quick brown fox jumps over the lazy dog, twice!"

  - name: "newcipher: truth vector 2 (her 2009 Cipher.java, JDK 8) decodes exactly, privately"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: newcipher, options: { text: "\u0067\u008E\u0079\u0099\u0075\u0078\u005D\u000C\u0095\u00CD\u002B\u00CD\u0097\u00C6\u0017\u00A3\u00CB\u00D0\u007E\u00BC\u0011\u006F\u00A6\u0085\u0097\u00B2\u0073\u00C6\u00CB\u00AD\u00B1\u0098\u00D3\u007F\u00A2\u0047\u004B\u00A7\u003F\u00B6\u00C4\u0061\u0065\u0073\u00A7\u00A1\u00A3\u0050\u006C\u009A\u00B2\u00C1\u00A5\u002A\u0062\u00C2\u005B\u0064\u009F\u00A7\u00AA\u0084\u000D\u00BF\u0050\u004D\u00B7\u0089\u00C8\u00B2\u0098\u0060\u00BE\u008B\u0099\u0017\u005D\u0060\u009A\u0092\u0009\u00AE\u00C5\u0073\u00CC" } }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          embed_title: "NewCipher plaintext"
          # 85 chars: the seed character is an 'e' at position 42 and passes
          # through unshifted, pinned by the full-sentence assert
          embed_contains: "Meet me at the usual place tomorrow at nine and bring the maps we discussed last week"

  - name: "newcipher: a draw shift past the character code wraps like Java's (char) cast"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      # '!<' (2 chars): position 0's draw shift is 99, so cp 33 - 99 = -66 wraps
      # to 65536 - 66 = 0xFFBE; the seed char '<' at position 1 passes through
      interaction: { type: slash, subcommand: newcipher, options: { text: "!<" } }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          embed_contains: "\uFFBE<"

  - name: "newcipher: Cyrillic plaintext (ciphertext above U+0400) decodes exactly"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: newcipher, options: { text: "M³iÁf§NiсШѮсЯ҅xcoO\u0088¾-8a¼YÃ\u009E<\u0085 ¶\u008Do" } }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          embed_title: "NewCipher plaintext"
          embed_contains: "He said привет to me, twice over!"

  - name: "newcipher: a Hebrew seed character (code point above 1024) decodes exactly"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: newcipher, options: { text: "\u05DF\u0633\u061F\u05E7\u0030\u063B\u05D5\u0635\u05E8\u0070\u0605\u0626" } }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          embed_title: "NewCipher plaintext"
          embed_contains: "שלום עולם מה"

  - name: "newcipher: curly quotes and an em dash decode exactly"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: newcipher, options: { text: "‘¯q°Çⁱ¿\u0098Ug ”x¢\u0099\u0099\u0018tTËN," } }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          embed_title: "NewCipher plaintext"
          embed_contains: "“Wait—what?” she said."

  - name: "newcipher: an emoji plaintext (a surrogate pair, two Java chars) decodes exactly"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      # U+1EE94 is the pair D83B DE94 in Java; the length is 11 code units
      interaction: { type: slash, subcommand: newcipher, options: { text: "U\u0083J\U0001EE94 ¤ÃRÈ}" } }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          embed_title: "NewCipher plaintext"
          embed_contains: "hi 🙂 there"

  - name: "newcipher: a decoded unit past U+FFFF wraps like Java's (char) cast"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      # position 0's shift is -6 (U+FFFD + 6 = 0x10003 wraps to U+0003); embed_contains
      # matches the embed as JSON, which escapes the control characters as \u0003
      interaction: { type: slash, subcommand: newcipher, options: { text: "\uFFFD@@<@@" } }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          embed_title: "NewCipher plaintext"
          embed_contains: "\\u00034$<\\u0003\uFFFE"

  - name: "newcipher: a lone surrogate in the decode comes out as U+FFFD"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      # 3 units; the seed is the lone low surrogate DE94; Java gives D7DB DE94 004D
      interaction: { type: slash, subcommand: newcipher, options: { text: "\U0001EE94<" } }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          embed_title: "NewCipher plaintext"
          embed_contains: "\uD7DB\uFFFDM"

  - name: "newcipher: empty text is an ephemeral refusal"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: newcipher, options: { text: "" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "empty" }

  - name: "newcipher: text over 2000 characters is an ephemeral refusal"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction:
        type: slash
        subcommand: newcipher
        options: { text: "" }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "2000" }

  - name: "newcipher: the 2000 cap counts characters, not bytes"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction:
        type: slash
        subcommand: newcipher
        options: { text: "ééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééé" }
    assertions:
      interaction_responses:
