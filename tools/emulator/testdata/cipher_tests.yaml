          ephemeral: true
          embed_title: "NewCipher plaintext"

  # oldcipher forwards to the cipher_old child by execCC. The truth vectors are her
  # actual 2009 Cipher.java output (eclipse-temurin:8, podman, roundtrip-verified): the
  # two-line vector pins the line-count and word-index metrics, the quirk vector pins
  # punctuation and digits passing through the stream while only the metrics strip them
  # (leaving an empty token between "number" and "lives").
  - name: "oldcipher: the two-line truth vector decodes privately through the child"
    template: "../../../commands/cipher/cipher_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: oldcipher, options: { text: "Vcs kealb heuny dug\nlomsz mauo zqi gxsj ebg" } }
    setup_db:
      - { user_id: 0, key: "Commands", value: { cipher_old: "1" } }
    command_map:
      1: "../../../commands/cipher/cipher_old.gohtml"
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          embed_title: "OldCipher plaintext"
          embed_contains: "The quick brown fox"
