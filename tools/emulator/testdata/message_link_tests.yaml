name: "message_link (regex trigger on message links)"

# Someone posts a link in #general (123456789012345678) to message 700...001 in
# #introduction (900...002), written by 500...001.
defaults:
  user:
    id: 987654321098765432
    username: "Linker"
  channel:
    id: 123456789012345678
  guild:
    channels:
      - { id: 900000000000000001, name: "yagpdb" }
      - { id: 900000000000000002, name: "introduction" }
    id: 111222333444555666
    name: "Test Server"
    roles:
      - { id: 111111111111111111, name: "Staff" }
  messages:
    - id: 700000000000000001
      channel_id: 900000000000000002
      author_id: 500000000000000001
      content: "Hi! I'm Guest, I like tea."

setup_db:
  - user_id: 0
    key: "Global"
    value: { Command Prefix: "-", Embed Color: 5793266, Delete Trigger Delay: 5, Default Avatar: "https://example.com/a.png" }
  - user_id: 0
    key: "Commands"
    value: { embed_exec: "1" } # a string, as the bootstrap stores it
  - user_id: 0
    key: "Roles"
    value: { Staff: 111111111111111111 }
  - user_id: 0
    key: "Channels"
    value: { YAGPDB: 900000000000000001 }

command_map:
  1: "../../../commands/plumbing/embed_exec.gohtml"

tests:
  - name: "message_link: expands a quoted link"
    template: "../../../commands/plumbing/message_link.gohtml"
    context:
      message_content: "look https://discord.com/channels/111222333444555666/900000000000000002/700000000000000001"
      exec_data:
        Message:
          Content: "look https://discord.com/channels/111222333444555666/900000000000000002/700000000000000001"
          GuildID: 111222333444555666
          ChannelID: 123456789012345678
          Author: { ID: 987654321098765432, String: "Linker#0001" }
    assertions:
      sent_messages:
        - { channel_id: 123456789012345678, embed_title: "Message Link", content_contains: "quoted a message:\nlook" }
    snapshot: true

  - name: "message_link: shows the author's nickname"
    template: "../../../commands/plumbing/message_link.gohtml"
    context:
      message_content: "https://discord.com/channels/111222333444555666/900000000000000002/700000000000000001"
      exec_data:
        Message:
          Content: "https://discord.com/channels/111222333444555666/900000000000000002/700000000000000001"
          GuildID: 111222333444555666
          ChannelID: 123456789012345678
          Author: { ID: 987654321098765432, String: "Linker#0001" }
      member_nicks: { 500000000000000001: "Tea Guest" }
    assertions:
      sent_messages:
        - { channel_id: 123456789012345678, embed_contains: "Tea Guest (" }

  - name: "message_link: deleted message is ignored"
    template: "../../../commands/plumbing/message_link.gohtml"
    context:
      message_content: "https://discord.com/channels/111222333444555666/900000000000000002/700000000000000099"
      exec_data:
        Message:
          Content: "https://discord.com/channels/111222333444555666/900000000000000002/700000000000000099"
          GuildID: 111222333444555666
          ChannelID: 123456789012345678
          Author: { ID: 987654321098765432, String: "Linker#0001" }
    expected:
      output_equals: ""
    snapshot: true

  # Renamed 2026-09-27 (was "links in code are ignored"): the old regex-trigger ignore
  # filter (prefix/code-block detection) only applies without exec_data. log_user always
  # calls with exec_data.Message set, so $execDataCheck is true unconditionally and this
  # code-block content is no longer ignored -- that's exactly what log_user relies on
  # (it does its own filtering before calling message_link).
  - name: "message_link: exec_data bypasses the code-block ignore filter"
    template: "../../../commands/plumbing/message_link.gohtml"
    context:
      message_content: "`https://discord.com/channels/111222333444555666/900000000000000002/700000000000000001`"
      exec_data:
        Message:
          Content: "`https://discord.com/channels/111222333444555666/900000000000000002/700000000000000001`"
          GuildID: 111222333444555666
          ChannelID: 123456789012345678
          Author: { ID: 987654321098765432, String: "Linker#0001" }
    assertions:
      sent_messages:
        - { channel_id: 123456789012345678, embed_title: "Message Link", content_contains: "quoted a message:\n``" }

  - name: "message_link: the linker left the server"
    template: "../../../commands/plumbing/message_link.gohtml"
    context:
      message_content: "https://discord.com/channels/111222333444555666/900000000000000002/700000000000000001"
      exec_data:
        Message:
          Content: "https://discord.com/channels/111222333444555666/900000000000000002/700000000000000001"
          GuildID: 111222333444555666
          ChannelID: 123456789012345678
          Author: { ID: 987654321098765432, String: "Linker#0001" }
      members: [500000000000000001]
    assertions:
      sent_messages:
        - { channel_id: 123456789012345678, embed_title: "Message Link", content_contains: "linked a message" }

  - name: "message_link: execCC data without a link"
    template: "../../../commands/plumbing/message_link.gohtml"
    context:
      exec_data: { ChannelID: 900000000000000003, DisableQuote: true }
    snapshot: true

  # The linked message has an embed: message_link carries its parts over as fields
  - name: "message_link: a quoted embed's parts become fields"
    template: "../../../commands/plumbing/message_link.gohtml"
    context:
      message_content: "https://discord.com/channels/111222333444555666/900000000000000002/700000000000000005"
      exec_data:
        Message:
          Content: "https://discord.com/channels/111222333444555666/900000000000000002/700000000000000005"
          GuildID: 111222333444555666
          ChannelID: 123456789012345678
          Author: { ID: 987654321098765432, String: "Linker#0001" }
      messages:
        - id: 700000000000000005
          channel_id: 900000000000000002
          author_id: 500000000000000001
          content: "see below"
          embeds:
            - title: "House Rules"
              description: "Be kind."
              color: 255
              author: { name: "Rules Bot" }
              fields: [{ name: "Quiet hours", value: "22:00-07:00" }]
              footer: { text: "Updated weekly" }
              image: { url: "https://example.com/rules.png" }
    assertions:
      sent_messages:
        - channel_id: 123456789012345678
          embed_title: "Message Link"
          embed_contains: '"name": "📎 Quiet hours"'
    snapshot: true

  - name: "message_link: a quoted embed's long description is cut to Discord's 1024"
    template: "../../../commands/plumbing/message_link.gohtml"
    context:
      message_content: "https://discord.com/channels/111222333444555666/900000000000000002/700000000000000005"
      exec_data:
        Message:
          Content: "https://discord.com/channels/111222333444555666/900000000000000002/700000000000000005"
          GuildID: 111222333444555666
          ChannelID: 123456789012345678
          Author: { ID: 987654321098765432, String: "Linker#0001" }
      messages:
        # 1025 characters, the last three 3 bytes long: the field holds 1023 and "…"
        - id: 700000000000000005
          channel_id: 900000000000000002
          author_id: 500000000000000001
          embeds: [{ description: "€€€" }]
    strict: true
    assertions:
      sent_messages: [{ embed_contains: 'a€…"' }]

  - name: "message_link: a quoted embed's description of exactly 1024 is kept"
    template: "../../../commands/plumbing/message_link.gohtml"
    context:
      message_content: "https://discord.com/channels/111222333444555666/900000000000000002/700000000000000005"
      exec_data:
        Message:
          Content: "https://discord.com/channels/111222333444555666/900000000000000002/700000000000000005"
          GuildID: 111222333444555666
          ChannelID: 123456789012345678
          Author: { ID: 987654321098765432, String: "Linker#0001" }
      messages:
        - id: 700000000000000005
          channel_id: 900000000000000002
          author_id: 500000000000000001
          embeds: [{ description: "€€" }]
    strict: true
    assertions:
      sent_messages: [{ embed_contains: 'a€€"' }]

  # Linking a Message Link re-sends its embed as it is (the embed read from the message)
  - name: "message_link: linking a Message Link re-sends its embed"
    template: "../../../commands/plumbing/message_link.gohtml"
    context:
      message_content: "https://discord.com/channels/111222333444555666/900000000000000002/700000000000000006"
      exec_data:
        Message:
          Content: "https://discord.com/channels/111222333444555666/900000000000000002/700000000000000006"
          GuildID: 111222333444555666
          ChannelID: 123456789012345678
          Author: { ID: 987654321098765432, String: "Linker#0001" }
      messages:
        - id: 700000000000000006
          channel_id: 900000000000000002
          author_id: 1234567890
          embeds:
            - title: "Message Link"
              description: "the original quote"
              fields: [{ name: "Original Channel", value: "#introduction" }]
    strict: true
    assertions:
      sent_messages:
        - channel_id: 123456789012345678
          embed_title: "Message Link"
          embed_contains: '"description": "the original quote"'

  # Mirrors exactly how log_user calls message_link: DisableAuthor/DisableQuote/KeepTrigger
  # all true, so neither the quote/author preamble nor the trigger deletion happens -- only
  # the embed is sent, and the trigger message is left alone.
  - name: "message_link: exec_data mirrors log_user (DisableAuthor/DisableQuote/KeepTrigger)"
    template: "../../../commands/plumbing/message_link.gohtml"
    context:
      message_content: "look https://discord.com/channels/111222333444555666/900000000000000002/700000000000000001"
      exec_data:
        Message:
          Content: "look https://discord.com/channels/111222333444555666/900000000000000002/700000000000000001"
          GuildID: 111222333444555666
          ChannelID: 123456789012345678
          Author: { ID: 987654321098765432, String: "Linker#0001" }
        DisableAuthor: true
        DisableQuote: true
        KeepTrigger: true
    assertions:
      sent_messages:
        - { channel_id: 123456789012345678, embed_title: "Message Link", content_equals: "" }
      deletions: []
