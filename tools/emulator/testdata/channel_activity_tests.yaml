    assertions:
      interaction_responses:
        - { kind: update, embed_contains: '**Stale**, oldest first — page 1 of 2\n<#500000001> — <t:1001:R>', components_contains: "\"label\": \"Stale (17)\",\n      \"style\": 1" }

