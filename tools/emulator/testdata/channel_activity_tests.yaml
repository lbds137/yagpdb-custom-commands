  # ExecData path (channel_activity's execCC): no interaction, so the page is a sent message
  - name: "channel_activity_pager: ExecData Bucket quiet is honoured (sent message, no interaction)"
    template: "../../../staff/channel_activity_pager.gohtml"
    context:
      clock: 2026-01-01T00:00:00Z
      guild: *bucketGuild
      exec_data: { Bucket: "quiet", Page: 1 }
    setup_db: *bucketDB
    assertions:
      interaction_responses: []
      edited_messages: []
      sent_messages:
        - channel_id: 99
          embed_contains: '**Quiet**, oldest first — page 1 of 1\n<#14> — <t:1764720000:R>\n<#12> — <t:1766620800:R>'
          components_contains: "\"label\": \"Quiet (2)\",\n      \"style\": 1"

  - name: "channel_activity_pager: ExecData Page 2 is honoured"
    template: "../../../staff/channel_activity_pager.gohtml"
    context:
      clock: 2026-01-01T00:00:00Z
      guild: *pagingGuild
      exec_data: { Bucket: "stale", Page: 2 }
    setup_db: *pagingDB
    assertions:
      sent_messages:
        - channel_id: 99
          embed_contains: '**Stale**, oldest first — page 2 of 2\n<#500000016> — <t:1016:R>\n<#500000017> — <t:1017:R>'

  - name: "channel_activity_pager: ca:noop (the disabled page counter) rebuilds Stale page 1"
    template: "../../../staff/channel_activity_pager.gohtml"
    context:
      clock: 2026-01-01T00:00:00Z
      messages: [{ id: 7, channel_id: 99, author_id: 1234567890, embeds: [{ title: "Channel activity" }] }]
      interaction: { type: component, custom_id: "ca:noop", message_id: 7 }
      guild: *pagingGuild
    setup_db: *pagingDB
    assertions:
      interaction_responses:
        - { kind: update, embed_contains: '**Stale**, oldest first — page 1 of 2\n<#500000001> — <t:1001:R>' }

  - name: "channel_activity_pager: an unknown bucket (ca:bogus:1) falls back to Stale page 1"
