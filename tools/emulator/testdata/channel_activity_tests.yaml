name: "channel_tracker + channel_activity (dead-channel audit)"
description: >
  channel_tracker (everyone/general, Regex `.*`) records a channel's last-active time on
  every message, since no template function can read a channel's last message. staff's
  channel_activity cleans up deleted channels' records and execCCs channel_activity_pager,
  which reads the records back into a browse view: a summary, one bucket (active / quiet /
  stale / never seen) per page of 15, bucket and paging buttons, and a CSV download.

# 10 "Info" is a normal category; 11/12/13/14 are its channels (text, announcement, voice,
# forum). 20 "Excluded Cat" is excluded wholesale (Directory's Exclude Categories); its
# child 21 would otherwise be eligible. 22 is excluded directly (Exclude Channels), also
# under 10. 99 is where staff run commands; it is deliberately NOT declared as a guild
# channel, matching how the emulator adds an undeclared trigger channel.
defaults:
  channel: { id: 99, name: "staff" }
  guild:
    id: 111222333444555666
    name: "Test Server"
    channels:
      - { id: 10, name: "Info", type: 4, position: 0 }
      - { id: 11, name: "general", type: 0, parent_id: 10, position: 0 }
      - { id: 12, name: "announce", type: 5, parent_id: 10, position: 1 }
      - { id: 13, name: "voice", type: 2, parent_id: 10, position: 2 }
      - { id: 14, name: "forum", type: 15, parent_id: 10, position: 3 }
      - { id: 20, name: "Excluded Cat", type: 4, position: 1 }
      - { id: 21, name: "excluded-cat-channel", type: 0, parent_id: 20, position: 0 }
      - { id: 22, name: "excluded-channel", type: 0, parent_id: 10, position: 4 }

setup_db:
  - { user_id: 0, key: "Global", value: { Delete Trigger Delay: 5, Embed Color: 3447003 } }
  # 99 (staff) is where commands run: the emulator auto-adds an undeclared trigger channel
  # as a real text channel (runner.go), so it must be excluded to keep it out of the audit
  - { user_id: 0, key: "Directory", value: { Exclude Categories: [20], Exclude Channels: [22, 99] } }
  # the pager's CC id, as channel_activity finds it (bootstrap stores ids as strings)
  - { user_id: 0, key: "Commands", value: { channel_activity_pager: "42" } }

command_map: { 42: "../../../staff/channel_activity_pager.gohtml" }

tests:
  # channel_tracker
  - name: "channel_tracker: normal channel records .Channel.ID with a numeric value"
    template: "../../../everyone/general/channel_tracker.gohtml"
    context:
      channel: { id: 11, name: "general" }
      message_content: "just chatting"
      clock: 2026-01-01T00:00:00Z
    assertions:
      db_checks:
        - { user_id: 11, key: "Last Active", value_equals: 1767225600 }
      sent_messages: []
      deletions: []

  - name: "channel_tracker: a thread credits .Channel.ParentID, not the thread itself"
    # channel 30 (type 11 = GUILD_PUBLIC_THREAD, parent 11 "general") must still be
    # declared under guild.channels to get a type at all: the emulator only builds a
    # triggering channel's CtxChannel details (type, parent_id, IsThread, ...) from a
    # matching guild.channels entry (runner.go), and context.channel alone carries no
    # type. What IS now modelled, matching vendor's baseChannelArg
    # (common/templates/context_funcs.go): a declared thread is absent from
    # .Guild.Channels/ChannelOrder (dstate.GuildSet.Channels holds no threads) and
    # getChannel errors "channel not in state" for it (GS.GetChannel finds channels only),
    # but it's still a real send/getChannelOrThread/name-lookup target via
    # ctx.Threads/ThreadOrder (GS.GetChannelOrThread, GS.Threads) — see
    # TestThreadNotInGuildState, TestGetChannelOrThreadResolvesAThread,
    # TestSendMessageToThreadByID and TestThreadNameLookupOrder,
    # tools/emulator/internal/runtime/channels_test.go. Not modelled: ChannelArgNoDMNoThread
    # (no emulator function maps to it — only vendor's editChannelTopic uses it, and the
    # emulator doesn't implement editChannelTopic) and tmplGetThread's live-Discord-API
    # fallback for an undeclared thread (getThread itself isn't implemented at all).
    template: "../../../everyone/general/channel_tracker.gohtml"
    context:
      channel: { id: 30, name: "a-thread" }
      guild:
        channels:
          - { id: 10, name: "Info", type: 4, position: 0 }
          - { id: 11, name: "general", type: 0, parent_id: 10, position: 0 }
          - { id: 30, name: "a-thread", type: 11, parent_id: 11, position: 0 }
      message_content: "just chatting in the thread"
      clock: 2026-01-01T00:00:00Z
    assertions:
      db_checks:
        - { user_id: 11, key: "Last Active", value_equals: 1767225600 }
        - { user_id: 30, key: "Last Active", not_exists: true }
      sent_messages: []
      deletions: []

  # channel_activity
  - name: "channel_activity: entry path sends page 1 of Stale with the counts and buttons; ordering, exclusion, deleted-channel cleanup"
    template: "../../../staff/channel_activity.gohtml"
    snapshot: true
    context:
      clock: 2026-01-01T00:00:00Z
    setup_db:
      - { user_id: 999999, key: "Last Active", value: 1000 } # deleted channel: not in .Guild.Channels -> cleaned up
      - { user_id: 11, key: "Last Active", value: 2000 } # general: eligible, oldest of the eligible
      - { user_id: 22, key: "Last Active", value: 3000 } # excluded-channel: excluded directly
      - { user_id: 21, key: "Last Active", value: 4000 } # excluded-cat-channel: parent category excluded
      - { user_id: 12, key: "Last Active", value: 5000 } # announce: eligible, newer
      # 14 (forum) is eligible but never tracked -> counted as never seen
      # 13 (voice) is untracked too but not a text-like type -> omitted entirely
    assertions:
      db_checks:
        - { user_id: 999999, key: "Last Active", not_exists: true }
        - { user_id: 22, key: "Last Active", value_equals: 3000 } # ineligible but existing: kept
      sent_messages:
        - channel_id: 99
          embed_title: "Channel activity"
          # embed_contains matches the embed's JSON, so a newline is the two characters \n
          embed_contains: '3 channels: 0 active · 0 quiet · 2 stale · 1 never seen\n\n**Stale**, oldest first — page 1 of 1\n<#11> — <t:2000:R>\n<#12> — <t:5000:R>'
          components_contains: '"custom_id": "templates-ca:quiet:1:b"'
      interaction_responses: []
      deletions:
        - { of: trigger, channel_id: 99, delay: 5s }

  - name: "channel_activity: nothing recorded yet"
    template: "../../../staff/channel_activity.gohtml"
    context:
      guild: { channels: [] }
    assertions:
      sent_messages:
        - { channel_id: 99, embed_title: "Channel activity", embed_contains: "channel_tracker is running" }
      deletions:
        - { channel_id: 99 }



  # channel_activity_pager, clicked directly. The clicked message is the bot's earlier page
  # (a real click carries the page state in the button's custom ID, not in the message)
  - name: "channel_activity_pager: buckets by days quiet (quiet page: 7 and 29 days, oldest first)"
    template: "../../../staff/channel_activity_pager.gohtml"
    snapshot: true
    context:
      clock: 2026-01-01T00:00:00Z # 1767225600
      guild: &bucketGuild
        channels:
          - { id: 10, name: "Info", type: 4, position: 0 }
          - { id: 11, name: "general", type: 0, parent_id: 10, position: 0 }
          - { id: 12, name: "announce", type: 5, parent_id: 10, position: 1 }
          - { id: 14, name: "forum", type: 15, parent_id: 10, position: 3 }
          - { id: 15, name: "old", type: 0, parent_id: 10, position: 4 }
          - { id: 16, name: "fresh", type: 0, parent_id: 10, position: 5 }
      messages: [{ id: 7, channel_id: 99, author_id: 1234567890, embeds: [{ title: "Channel activity" }] }]
      interaction: { type: component, custom_id: "ca:quiet:1", message_id: 7 }
    setup_db: &bucketDB
      - { user_id: 11, key: "Last Active", value: 1766966400 } # 3 days: active
      - { user_id: 12, key: "Last Active", value: 1766620800 } # exactly 7 days: quiet
      - { user_id: 14, key: "Last Active", value: 1764720000 } # 29 days: quiet
      - { user_id: 15, key: "Last Active", value: 1764633600 } # exactly 30 days: stale
      - { user_id: 16, key: "Last Active", value: 1766620801 } # 6 days 23:59:59: active
    expected:
      output_equals: ""
    assertions:
      sent_messages: []
      edited_messages:
        - channel_id: 99
          embed_title: "Channel activity"
          embed_contains: "5 channels: 2 active · 2 quiet · 1 stale · 0 never seen"
      interaction_responses:
        - { kind: update, embed_contains: '**Quiet**, oldest first — page 1 of 1\n<#14> — <t:1764720000:R>\n<#12> — <t:1766620800:R>', components_contains: '"label": "Quiet (2)"' }

  - name: "channel_activity_pager: active page (under 7 days) and stale page (30 days and up)"
    template: "../../../staff/channel_activity_pager.gohtml"
    context:
      clock: 2026-01-01T00:00:00Z
      guild:
        channels:
          - { id: 11, name: "general", type: 0 }
          - { id: 15, name: "old", type: 0 }
          - { id: 16, name: "fresh", type: 0 }
      messages: [{ id: 7, channel_id: 99, author_id: 1234567890, embeds: [{ title: "Channel activity" }] }]
      interaction: { type: component, custom_id: "ca:active:1", message_id: 7 }
    setup_db:
      - { user_id: 11, key: "Last Active", value: 1766966400 } # 3 days: active
      - { user_id: 15, key: "Last Active", value: 1764633600 } # exactly 30 days: stale
      - { user_id: 16, key: "Last Active", value: 1766620801 } # 6 days 23:59:59: active
    assertions:
      interaction_responses:
        - { kind: update, embed_contains: '**Active**, oldest first — page 1 of 1\n<#16> — <t:1766620801:R>\n<#11> — <t:1766966400:R>', components_contains: '"label": "Stale (1)"' }

  - name: "channel_activity_pager: never-seen page lists untracked eligible channels with the caveat"
    template: "../../../staff/channel_activity_pager.gohtml"
    context:
      clock: 2026-01-01T00:00:00Z
      messages: [{ id: 7, channel_id: 99, author_id: 1234567890, embeds: [{ title: "Channel activity" }] }]
      interaction: { type: component, custom_id: "ca:never:1", message_id: 7 }
    setup_db:
      - { user_id: 11, key: "Last Active", value: 2000 }
      - { user_id: 12, key: "Last Active", value: 5000 }
      # 14 (forum) is eligible but never tracked; 13 (voice), 21 and 22 are ineligible
    assertions:
      interaction_responses:
        - kind: update
          embed_contains: '3 channels: 0 active · 0 quiet · 2 stale · 1 never seen\n\n**Never seen**, in channel order — page 1 of 1\n_Bot and webhook posts aren''t seen, nor channels where YAGPDB can''t send._\n<#14>'
          components_contains: '"label": "Never seen (1)"'

  - name: "channel_activity_pager: a click deletes nothing (the cleanup is channel_activity's)"
    template: "../../../staff/channel_activity_pager.gohtml"
    context:
      clock: 2026-01-01T00:00:00Z
      messages: [{ id: 7, channel_id: 99, author_id: 1234567890, embeds: [{ title: "Channel activity" }] }]
      interaction: { type: component, custom_id: "ca:stale:1", message_id: 7 }
    setup_db:
      - { user_id: 999999, key: "Last Active", value: 1000 } # deleted channel
      - { user_id: 11, key: "Last Active", value: 2000 }
    assertions:
      db_checks:
        - { user_id: 999999, key: "Last Active", value_equals: 1000 }
      interaction_responses:
        - { kind: update, embed_contains: '**Stale**, oldest first — page 1 of 1\n<#11> — <t:2000:R>' }

  - name: "channel_activity_pager: CSV download is an ephemeral file reply (quoted name, never-seen row)"
    # the file's content is pinned by the snapshot (files:); YAML has no file assertion
    template: "../../../staff/channel_activity_pager.gohtml"
    snapshot: true
    context:
      clock: 2026-01-01T00:00:00Z
      guild:
        channels:
          - { id: 10, name: "Info", type: 4, position: 0 }
          - { id: 11, name: 'say "hi", ok', type: 0, parent_id: 10, position: 0 }
          - { id: 12, name: "plain", type: 0, parent_id: 10, position: 1 }
          - { id: 13, name: "line\nbreak", type: 0, parent_id: 10, position: 2 } # never seen, quoted
          - { id: 14, name: "forum", type: 15, position: 3 }
      messages: [{ id: 7, channel_id: 99, author_id: 1234567890, embeds: [{ title: "Channel activity" }] }]
      interaction: { type: component, custom_id: "ca:csv", message_id: 7 }
    setup_db:
      - { user_id: 11, key: "Last Active", value: 1766966400 } # 3 days: active
      - { user_id: 12, key: "Last Active", value: 1764633600 } # 30 days: stale
    expected:
      output_equals: ""
    assertions:
      edited_messages: []
      sent_messages:
        - { channel_id: 99, ephemeral: true, content_equals: "4 channels: 1 active · 0 quiet · 1 stale · 2 never seen" }
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "4 channels" }

