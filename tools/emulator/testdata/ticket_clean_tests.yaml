name: "ticket_clean (regex-cleans stray messages in the ticket-open channel)"

defaults:
  guild:
    channels:
      - { id: 999999999, name: "yagpdb" }
  channel:
    id: 123456789012345678

setup_db:
  - user_id: 0
    key: "Global"
    value: { Delete Trigger Delay: 5, Delete Response Delay: 10, Command Prefix: "-" }
  - user_id: 0
    key: "Commands"
    value: { embed_exec: "1" }
  - user_id: 0
    key: "Channels"
    value: { YAGPDB: 999999999 }

command_map:
  1: "../../../everyone/services/embed_exec.gohtml"

tests:
  - name: "ticket_clean: a correctly formatted ticket open command is left alone"
    template: "../../../everyone/general/ticket_clean.gohtml"
    context:
      message_content: "-tickets open a valid reason"
    assertions:
      deletions: []

  - name: "ticket_clean: anything else gets the usage embed, and the trigger and response are deleted"
    template: "../../../everyone/general/ticket_clean.gohtml"
    context:
      message_content: "-tickets nonsense"
    assertions:
      sent_messages:
        - { embed_title: "Invalid Ticket Command", embed_contains: "`-tickets open [reason]`" }
      deletions:
        - { of: "message", channel_id: 123456789012345678 }
        - { of: "trigger" }
