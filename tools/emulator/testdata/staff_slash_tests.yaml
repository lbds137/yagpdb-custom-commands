name: "staff_slash (/staff roles, bump_reset, delrep, bootstrap)"

# The router of the staff slash commands, with the /staff path of the four handlers built so
# far (staff_roles, bump_reset, batch_delrep, bootstrap): ONE execCC to the handler with the
# options in ExecData, the handler answers the inherited interaction. Public results,
# ephemeral refusals. `deletions: []` pins only real message deletes: a slash run's trigger has
# no ID (as in YAGPDB), so it can't catch a stray deleteTrigger. An
# ephemeral response counts as a sent message in the emulator, so the refusal tests use
# snapshot: true to pin "no stray channel message". Handlers' text-path tests stay in their
# own files, unchanged.

defaults:
  user: { id: 500000000000000001, username: "Invoker" }
  channel: { id: 123456789012345678 }
  guild:
    id: 333333333333333333
    name: "Test Server"
    roles:
      - { id: 111111111111111111, name: "Mod" }
      - { id: 222222222222222222, name: "Helper" }
    channels:
      - { id: 999999999, name: "yagpdb" }

setup_db:
  - user_id: 0
    key: "Global"
    value: { Embed Color: 9807270, Delete Trigger Delay: 5, Delete Response Delay: 10, Last Bump: "earlier" }
  - user_id: 0
    key: "Commands"
    value: { embed_exec: "1", staff_roles: "2", bump_reset: "3", batch_delrep: "4", bootstrap: "5" }
  - user_id: 0
    key: "Channels"
    value: { YAGPDB: 999999999 }
  - user_id: 0
    key: "Roles"
    value: { Staff: "222222222222222222" }
  - user_id: 0
    key: "Staff"
    value: {}

command_map:
  1: "../../../commands/plumbing/embed_exec.gohtml"
  2: "../../../commands/members/staff_roles.gohtml"
  3: "../../../commands/bump/bump_reset.gohtml"
  4: "../../../commands/members/batch_delrep.gohtml"
  5: "../../../commands/plumbing/bootstrap.gohtml"

tests:
  # ---- handlers refuse up front when the ids they execCC are missing from Commands
  # (staff_roles and batch_delrep are present: the router finds them, they refuse)
  - name: "staff_slash roles: staff_roles without embed_exec in Commands refuses up front, nothing stored"
    template: "../../../commands/members/staff_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, subcommand: roles, options: { roles: "<@&111111111111111111>" } }
    setup_db:
      - user_id: 0
        key: "Commands"
        value: { staff_roles: "2" }
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { } }
      deletions: []
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "Part of this command isn't installed on this server yet. Please tell an admin." }

  - name: "staff_slash delrep: batch_delrep without embed_exec in Commands refuses up front, no delrep exec"
    template: "../../../commands/members/staff_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, subcommand: delrep, options: { users: "111111111111111111" } }
    setup_db:
      - user_id: 0
        key: "Commands"
        value: { batch_delrep: "4" }
    assertions:
      execs: []
      deletions: []
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "Part of this command isn't installed on this server yet. Please tell an admin." }

  # ---- roles
  - name: "staff_slash roles: role IDs are stored (the Staff role rides along), answered publicly"
    template: "../../../commands/members/staff_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: roles, options: { roles: "<@&111111111111111111>" } }
    expected:
      output_equals: ""
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: { Roles: ["111111111111111111", "222222222222222222"] } }
      deletions: []
      interaction_responses:
        - { kind: message, ephemeral: false, embed_title: "Staff Roles Configuration", embed_contains: "<@&111111111111111111>" }

  - name: "staff_slash roles: only invalid role IDs are an ephemeral refusal, nothing stored"
    template: "../../../commands/members/staff_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, subcommand: roles, options: { roles: "999999999999999999" } }
    setup_db:
      # no configured Staff role: it would ride along and be a valid ID
      - { user_id: 0, key: "Roles", value: {} }
    assertions:
      db_checks:
        - { user_id: 0, key: "Staff", value_equals: {} }
      deletions: []
      interaction_responses:
        - { kind: message, ephemeral: true, embed_title: "Invalid Role IDs", embed_contains: "`999999999999999999`" }

  - name: "staff_slash roles: no roles opens the picker panel publicly, with the sr: select"
    template: "../../../commands/members/staff_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: roles }
    setup_db:
      - { user_id: 0, key: "Staff", value: { Roles: ["111111111111111111"] } }
    expected:
      output_equals: ""
    assertions:
      deletions: []
      interaction_responses:
        - kind: message
          ephemeral: false
          embed_title: "Staff Roles Configuration"
          embed_contains: "<@&111111111111111111>"
          components_contains: '"custom_id": "templates-sr:500000000000000001"'

  # ---- a handler whose execCC fails (command_status declares it) still answers the interaction
  - name: "staff_slash: a disabled handler is an ephemeral refusal and nothing ran"
    template: "../../../commands/members/staff_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: bump_reset }
    command_status:
      3: disabled
    assertions:
      db_checks:
        # bump_reset didn't run: Last Bump is still set
        - { user_id: 0, key: "Global", value_equals: { Embed Color: 9807270, Delete Trigger Delay: 5, Delete Response Delay: 10, Last Bump: "earlier" } }
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "Part of this command isn't installed on this server yet. Please tell an admin." }

  # ---- bump_reset
  - name: "staff_slash bump_reset: Last Bump is cleared, the reply is ephemeral and never deleted"
    template: "../../../commands/members/staff_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, subcommand: bump_reset }
    expected:
      output_equals: ""
    assertions:
      db_checks:
        - { user_id: 0, key: "Global", value_equals: { Embed Color: 9807270, Delete Trigger Delay: 5, Delete Response Delay: 10 } }
      deletions: []
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "✅ Bump timer reset." }

  # ---- delrep
  - name: "staff_slash delrep: the IDs become delrep exec calls, the result embed is public"
    template: "../../../commands/members/staff_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: delrep, options: { users: "<@100000000000000001> 100000000000000002" } }
      exec_responses:
        'delrep "100000000000000001"': "ok"
        'delrep "100000000000000002"': "ok"
    expected:
      output_equals: ""
    assertions:
      execs:
        - { line: 'delrep "100000000000000001"' }
        - { line: 'delrep "100000000000000002"' }
      deletions: []
      interaction_responses:
        - { kind: message, ephemeral: false, embed_title: "Batch Reputation Deletion", embed_contains: "<@100000000000000002>" }

  - name: "staff_slash delrep: more than 5 IDs purges the first 5 and lists the rest"
    template: "../../../commands/members/staff_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: delrep, options: { users: "100000000000000001 100000000000000002 100000000000000003 100000000000000004 100000000000000005 100000000000000006" } }
      exec_responses:
        'delrep "100000000000000001"': "ok"
        'delrep "100000000000000002"': "ok"
        'delrep "100000000000000003"': "ok"
        'delrep "100000000000000004"': "ok"
        'delrep "100000000000000005"': "ok"
    assertions:
      execs:
        - { line: 'delrep "100000000000000001"' }
        - { line: 'delrep "100000000000000002"' }
        - { line: 'delrep "100000000000000003"' }
        - { line: 'delrep "100000000000000004"' }
        - { line: 'delrep "100000000000000005"' }
      interaction_responses:
        - { kind: message, ephemeral: false, embed_contains: "could not be purged due to custom command limits" }

  - name: "staff_slash delrep: no user ID in the text is an ephemeral refusal, nothing purged"
    template: "../../../commands/members/staff_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, subcommand: delrep, options: { users: "nobody" } }
    assertions:
      execs: []
      deletions: []
      interaction_responses:
        - { kind: message, ephemeral: true, embed_title: "Missing User IDs", embed_contains: "at least one user ID" }

  # ---- bootstrap
  - name: "staff_slash bootstrap: the staff_role option sets Roles > Staff, the completion embed is public"
    template: "../../../commands/members/staff_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: bootstrap, options: { staff_role: 111111111111111111 } }
    expected:
      output_equals: ""
    assertions:
      db_checks:
        - { user_id: 0, key: "Roles", value_equals: { Staff: "111111111111111111" } }
        - { user_id: 0, key: "Channels", value_equals: { YAGPDB: "123456789012345678" } }
      deletions: []
      interaction_responses:
        - { kind: message, ephemeral: false, embed_title: "Server defaults saved" }

  - name: "staff_slash bootstrap: no staff_role keeps the current Staff role"
    template: "../../../commands/members/staff_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: bootstrap }
    assertions:
      db_checks:
        - { user_id: 0, key: "Roles", value_equals: { Staff: "222222222222222222" } }
      deletions: []
      interaction_responses:
        - { kind: message, ephemeral: false, embed_title: "Server defaults saved" }

  - name: "staff_slash bootstrap: a non-Administrator is refused ephemerally, nothing written (F16)"
    template: "../../../commands/members/staff_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: bootstrap, options: { staff_role: 111111111111111111 } }
      guild: { owner_id: 1 }
      members: [500000000000000001]
    assertions:
      db_checks:
        - { user_id: 0, key: "Roles", value_equals: { Staff: "222222222222222222" } }
        - { user_id: 0, key: "Directory", not_exists: true }
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "Only an Administrator can run bootstrap." }

  - name: "staff_slash bootstrap: needs no embed_exec key (it sends its own embed)"
    template: "../../../commands/members/staff_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: bootstrap }
    setup_db:
      - { user_id: 0, key: "Commands", value: { bootstrap: "5" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: false, embed_title: "Server defaults saved" }

  # ---- the router's own refusals
  - name: "staff_slash: a handler missing from the Commands dict is an ephemeral refusal with no execCC"
    template: "../../../commands/members/staff_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, subcommand: bump_reset }
    setup_db:
      - { user_id: 0, key: "Commands", value: { embed_exec: "1" } }
      - { user_id: 0, key: "Global", value: { Last Bump: "kept" } }
    expected:
      output_equals: ""
    assertions:
      db_checks:
        - { user_id: 0, key: "Global", value_equals: { Last Bump: "kept" } }
      deletions: []
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "isn't installed on this server yet. Please tell an admin." }

  # A Slash Command trigger takes an interaction, so the bare run rides the execCC
  # path (no trigger check there) — the smoke's plain-message run, which lands here
  - name: "staff_slash: a bare run prints the usage hint"
    template: "../../../commands/members/staff_slash.gohtml"
    context:
      exec_data: { probe: true }
    expected:
      output_contains: "Use /staff as a slash command"
