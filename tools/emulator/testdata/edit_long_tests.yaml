name: "/edit: a rule too long to prefill"

# Rule #9's text is 4001 runes (seeded by shell: a modal's value caps at 4000, so the
# spawner must open the form without a prefill instead of silently truncating it — the
# engine records only the modal's shape, so the case pins that the modal still opens).
defaults:
  user: { id: 111111111111111111, username: "Invoker" }
  channel: { id: 222222222222222222, name: "test-channel" }
  clock: 2026-01-02T15:04:05Z
  guild:
    id: 333333333333333333
    name: "Test Server"
    roles: [{ id: 888888888, name: "Staff" }]

tests:
  - name: "edit rule: a >4000-rune rule opens a no-prefill modal"
    snapshot: true
    template: "../../../commands/edit/edit_slash.gohtml"
    context:
      user: { roles: [888888888] }
      interaction: { type: slash, subcommand: rule, options: { rule: 9 } }
    assertions:
      interaction_responses:
        - { kind: modal, title: "Edit rule 9", custom_id: "edit:rule:9:1767366245",
            fields: ["rule_text"] }

setup_db:
  - { user_id: 0, key: "Roles", value: { Staff: 888888888 } }
  - { user_id: 0, key: "Rules", value: { "Rule #9": "" } }
