name: "avatar_viewer"

# Links point at messages in #logs (900...002). YAGPDB's own messages are by user
# 204255221017214977; its `whois` output and mod log entries carry someone else's avatar.
defaults:
  user:
    id: 987654321098765432
    username: "Viewer"
  channel:
    id: 123456789012345678
  guild:
    id: 111222333444555666
    name: "Test Server"
    channels:
      - { id: 900000000000000001, name: "yagpdb" }
      - { id: 900000000000000002, name: "logs" }

setup_db:
  - user_id: 0
    key: "Global"
    value: { Delete Trigger Delay: 5, Default Avatar: "https://example.com/default.png" }
  - user_id: 0
    key: "Commands"
    value: { embed_exec: "1" }
  - user_id: 0
    key: "Channels"
    value: { YAGPDB: 900000000000000001 }

command_map:
  1: "templates/recording_embed_exec.gohtml"

tests:
  # whois's embed as YAGPDB builds it (logs/plugin_bot.go): title "<user> <nick>", eight
  # fields always, then past usernames and nicknames
  - name: "avatar_viewer: a whois message gives the looked-up user's avatar"
    template: "../../../utility/avatar_viewer.gohtml"
    context:
      args: ["https://discord.com/channels/111222333444555666/900000000000000002/700000000000000001", "256"]
      messages:
        - id: 700000000000000001
          channel_id: 900000000000000002
          author_id: 204255221017214977
          embeds:
            - title: "target Tea"
              thumbnail: { url: "https://cdn.discordapp.com/avatars/555555555555555555/abc.png" }
              fields:
                - { name: "ID", value: "555555555555555555", inline: true }
                - { name: "Avatar", value: "[Link](https://cdn.discordapp.com/avatars/555555555555555555/abc.png)", inline: true }
                - { name: "Account Created", value: "Jan 01 2020", inline: true }
                - { name: "Account Age", value: "5 years", inline: true }
                - { name: "Joined Server At", value: "Jan 02 2020", inline: true }
                - { name: "Join Server Age", value: "5 years", inline: true }
                - { name: "Status", value: "Online", inline: true }
                - { name: "Roles", value: "<@&111>", inline: true }
                - { name: "5 last usernames", value: "target" }
                - { name: "5 last nicknames", value: "Tea" }
    strict: true
    assertions:
      sent_messages:
        - embed_title: "Avatar Viewer"
          embed_contains: '"url": "https://cdn.discordapp.com/avatars/555555555555555555/abc.png?size=256"'
    snapshot: true

  # With name tracking off, whois says so in "Usernames" and "Nicknames" fields
  - name: "avatar_viewer: a whois message without name tracking"
    template: "../../../utility/avatar_viewer.gohtml"
    context:
      args: ["https://discord.com/channels/111222333444555666/900000000000000002/700000000000000001"]
      messages:
        - id: 700000000000000001
          channel_id: 900000000000000002
          author_id: 204255221017214977
          embeds:
            - title: "target "
              thumbnail: { url: "https://cdn.discordapp.com/avatars/555555555555555555/abc.png" }
              fields:
                - { name: "ID", value: "555555555555555555" }
                - { name: "Avatar", value: "[Link](https://example.com)" }
                - { name: "Account Created", value: "Jan 01 2020" }
                - { name: "Account Age", value: "5 years" }
                - { name: "Joined Server At", value: "Jan 02 2020" }
                - { name: "Join Server Age", value: "5 years" }
                - { name: "Status", value: "Online" }
                - { name: "Roles", value: "None" }
                - { name: "Usernames", value: "Username tracking disabled" }
                - { name: "Nicknames", value: "Nickname tracking disabled" }
    strict: true
    assertions:
      sent_messages:
        - embed_contains: '"value": "555555555555555555"'

  # A field that isn't whois's means it isn't a whois message: no avatar is found in it,
  # which gets an error (an empty ID field would make Discord refuse the whole embed)
  - name: "avatar_viewer: an embed with other fields isn't taken for whois"
    template: "../../../utility/avatar_viewer.gohtml"
    context:
      args: ["https://discord.com/channels/111222333444555666/900000000000000002/700000000000000001"]
      messages:
        - id: 700000000000000001
          channel_id: 900000000000000002
          author_id: 204255221017214977
          embeds:
            - title: "Poll"
              thumbnail: { url: "https://example.com/poll.png" }
              fields: [{ name: "ID", value: "555555555555555555" }, { name: "Votes", value: "3" }]
    strict: true
    assertions:
      sent_messages:
        - embed_contains: "No avatar found in that message"
    snapshot: true

  - name: "avatar_viewer: a link to a message that's gone"
    template: "../../../utility/avatar_viewer.gohtml"
    context:
      args: ["https://discord.com/channels/111222333444555666/900000000000000002/700000000000000099"]
    strict: true
    assertions:
      sent_messages:
        - embed_contains: "No avatar found in that message"

  # A mod log entry as YAGPDB writes it (moderation/modlog.go): "**<emoji><action>**
  # <user> *(ID <id>)*", then the reason
  - name: "avatar_viewer: a mod log entry gives the moderated user's avatar"
    template: "../../../utility/avatar_viewer.gohtml"
    context:
      args: ["https://discord.com/channels/111222333444555666/900000000000000002/700000000000000002"]
      messages:
        - id: 700000000000000002
          channel_id: 900000000000000002
          author_id: 204255221017214977
          embeds:
            - description: "**🔨Banned** bad_user *(ID 666666666666666666)*\n📄**Reason:** spam"
              thumbnail: { url: "https://cdn.discordapp.com/avatars/666666666666666666/def.png" }
    strict: true
    assertions:
      sent_messages:
        - embed_contains: '"value": "666666666666666666"'
    snapshot: true

  # Every action counts, not only bans: a warning, a role given (the action names the
  # role, which can hold a "*"), an older entry with the name in bold too, and a name full
  # of digits (the ID is the one in "(ID ...)")
  - name: "avatar_viewer: a warning in the mod log"
    template: "../../../utility/avatar_viewer.gohtml"
    context:
      args: ["https://discord.com/channels/111222333444555666/900000000000000002/700000000000000002"]
      messages:
        - id: 700000000000000002
          channel_id: 900000000000000002
          author_id: 204255221017214977
          embeds: [{ thumbnail: { url: "https://cdn.discordapp.com/avatars/666666666666666666/def.png" }, description: "**⚠Warned** bad_user *(ID 666666666666666666)*\n📄**Reason:** rude" }]
    strict: true
    assertions:
      sent_messages: [{ embed_contains: '"value": "666666666666666666"' }]

  - name: "avatar_viewer: a role given in the mod log"
    template: "../../../utility/avatar_viewer.gohtml"
    context:
      args: ["https://discord.com/channels/111222333444555666/900000000000000002/700000000000000002"]
      messages:
        - id: 700000000000000002
          channel_id: 900000000000000002
          author_id: 204255221017214977
          embeds: [{ thumbnail: { url: "https://cdn.discordapp.com/avatars/666666666666666666/def.png" }, description: "**➕Gave the role Mod*Team to ** new_mod *(ID 666666666666666666)*\n📄**Reason:** (no reason specified)" }]
    strict: true
    assertions:
      sent_messages: [{ embed_contains: '"value": "new_mod"' }]

  - name: "avatar_viewer: an older mod log entry"
    template: "../../../utility/avatar_viewer.gohtml"
    context:
      args: ["https://discord.com/channels/111222333444555666/900000000000000002/700000000000000002"]
      messages:
        - id: 700000000000000002
          channel_id: 900000000000000002
          author_id: 204255221017214977
          embeds: [{ thumbnail: { url: "https://cdn.discordapp.com/avatars/666666666666666666/def.png" }, description: "**🔨Banned Bad**#1234 *(ID 666666666666666666)*" }]
    strict: true
    assertions:
      sent_messages: [{ embed_contains: '"value": "Bad#1234"' }]

  - name: "avatar_viewer: a mod log name full of digits"
    template: "../../../utility/avatar_viewer.gohtml"
    context:
      args: ["https://discord.com/channels/111222333444555666/900000000000000002/700000000000000002"]
      messages:
        - id: 700000000000000002
          channel_id: 900000000000000002
          author_id: 204255221017214977
          embeds: [{ thumbnail: { url: "https://cdn.discordapp.com/avatars/666666666666666666/def.png" }, description: "**🔨Banned** user12345678901234567 *(ID 666666666666666666)*" }]
    strict: true
    assertions:
      sent_messages: [{ embed_contains: '"value": "666666666666666666"' }]

  - name: "avatar_viewer: an ordinary message gives its author's avatar"
    template: "../../../utility/avatar_viewer.gohtml"
    context:
      args: ["https://discord.com/channels/111222333444555666/900000000000000002/700000000000000003"]
      messages:
        - { id: 700000000000000003, channel_id: 900000000000000002, author_id: 500000000000000001, content: "hi" }
    strict: true
    snapshot: true

  - name: "avatar_viewer: a user ID"
    template: "../../../utility/avatar_viewer.gohtml"
    context:
      args: ["500000000000000001"]
    strict: true
    snapshot: true

  - name: "avatar_viewer: no argument shows your own"
    template: "../../../utility/avatar_viewer.gohtml"
    strict: true
    snapshot: true
