name: "rule_slash (/rule)"

# The slash root of rule: a number shows that rule (ONE execCC to embed_exec with Respond,
# public); no number opens the browse view (ONE execCC to rules_pager, whose first render
# answers the slash interaction with its buttons and select); a missing rule or browse view
# is an ephemeral refusal with no execCC. The rules_pager first render is tested here
# rather than in rules_browse_tests, which stays unchanged.

defaults:
  user: { id: 987654321098765432, username: "Invoker" }
  channel: { id: 123456789012345678, name: "general" }
  guild:
    id: 111222333444555666
    name: "Test Server"

setup_db:
  - user_id: 0
    key: "Global"
    value:
      Embed Color: 3447003
      Server URL: "https://example.com"
      Guild Premium Tier: 0
      Default Avatar: "https://example.com/a.png"
  - user_id: 0
    key: "Commands"
    value: { embed_exec: "123", rules_pager: "130" }
  - user_id: 0
    key: "Rules"
    value:
      "Rule #1": "Be respectful to all members."
      "Rule #2": "No spamming or flooding the chat."
      "Rule #3": "Keep discussions on topic."

command_map:
  123: "../../../commands/plumbing/embed_exec.gohtml"
  130: "../../../commands/rules/rules_pager.gohtml"

tests:
  - name: "rule_slash: a number shows that rule publicly"
    template: "../../../commands/rules/rule_slash.gohtml"
    context:
      interaction: { type: slash, options: { number: 2 } }
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: false
          embed_title: "Rule #2"
          embed_contains: "No spamming or flooding the chat."

  - name: "rule_slash: the only rule is titled Rules"
    template: "../../../commands/rules/rule_slash.gohtml"
    context:
      interaction: { type: slash, options: { number: 1 } }
    setup_db:
      - user_id: 0
        key: "Rules"
        value: { "Rule #1": "The one rule." }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: false, embed_title: "Rules", embed_contains: "The one rule." }

  # An ephemeral response is itself a sent message in the emulator, so `sent_messages: []`
  # can't pin "no extra channel message"; the snapshot lists every sent message, so a
  # stray embed_exec send would change it. Every refusal case is snapshotted.
  - name: "rule_slash: a missing rule is an ephemeral refusal with no execCC"
    template: "../../../commands/rules/rule_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, options: { number: 9 } }
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          content_contains: "Could not find rule `9`. Use /rule without a number to browse the rules."

  - name: "rule_slash: a missing middle rule is not claimed to be in a valid range"
    template: "../../../commands/rules/rule_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, options: { number: 2 } }
    setup_db:
      - user_id: 0
        key: "Rules"
        value: { "Rule #1": "One.", "Rule #3": "Three." }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          content_contains: "Could not find rule `2`. Use /rule without a number"

  - name: "rule_slash: rule 0 is a lookup that fails, not the browse view"
    template: "../../../commands/rules/rule_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, options: { number: 0 } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "Could not find rule `0`" }

  - name: "rule_slash: no rules configured says so, ephemerally"
    template: "../../../commands/rules/rule_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, options: { number: 1 } }
    setup_db:
      - user_id: 0
        key: "Rules"
        value: {}
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "No rules are configured yet." }

  - name: "rule_slash: no number opens the browse view as ONE public response with components"
    template: "../../../commands/rules/rule_slash.gohtml"
    context:
      interaction: { type: slash }
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: false
          embed_title: "Rule #1"
          embed_contains: "Be respectful to all members."
          components_contains: '"custom_id": "templates-rules:jump:987654321098765432"'
      sent_messages:
        - channel_id: 123456789012345678
          embed_title: "Rule #1"
          components_contains: '"custom_id": "templates-rules:close:987654321098765432"'
      edited_messages: []

  - name: "rule_slash: browse without rules_pager in Commands is an ephemeral refusal"
    template: "../../../commands/rules/rule_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash }
    setup_db:
      - user_id: 0
        key: "Commands"
        value: { embed_exec: "123" }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          content_contains: "The rules browse view isn't set up on this server yet."

  - name: "rule_slash: a number without embed_exec in Commands is an ephemeral refusal"
    template: "../../../commands/rules/rule_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, options: { number: 2 } }
    setup_db:
      - user_id: 0
        key: "Commands"
        value: { rules_pager: "130" }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: true
          content_contains: "This command isn't set up on this server yet."

  - name: "rule_slash: a bare run prints the usage hint"
    template: "../../../commands/rules/rule_slash.gohtml"
    context:
      exec_data: { probe: true }
    expected:
      output_contains: "Use /rule as a slash command"
