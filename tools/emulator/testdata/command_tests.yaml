name: "Command Integration Tests"
description: "Tests for utility and staff_utility commands that require arguments"

defaults:
  user:
    id: 987654321098765432
    username: "TestUser"
    discriminator: "0001"
  channel:
    id: 123456789012345678
    name: "test-channel"
  guild:
    channels:
      - { id: 999999999, name: "yagpdb" }
      - { id: 888888888888888888, name: "introduction" }
      - { id: 777777777, name: "introduction-archive" }
      - { id: 666666666, name: "welcome" }
      - { id: 555555555, name: "admission-log" }
    id: 111222333444555666
    name: "Test Server"
    roles:
      - { id: 111111111, name: "Staff" }
      - { id: 222222222, name: "Guest" }
      - { id: 333333333, name: "Member" }
      - { id: 444444444, name: "Minor" }
      - { id: 555555555, name: "Adult" }

# The Gematria tables come from the real bootstrap (alefbet, atbash, pyramid and rand_hebrew
# read them; gematria has its own suite)
setup_templates: ["../../../staff_utility/gematria_bootstrap.gohtml"]

# Common database setup for all tests
setup_db:
  - user_id: 0
    key: "Global"
    value:
      Delete Trigger Delay: 5
      Delete Response Delay: 10
      ExecCC Limit: 10
  - user_id: 0
    key: "Commands"
    value: # strings, as the bootstrap stores them (str); commands toInt them
      embed_exec: "123"
      gematria: "124"
      message_link: "125"
      db_get_embed: "126"
      db_get_text: "127"
      contrast: "128"
      db: "129"
  - user_id: 0
    key: "Channels"
    value:
      YAGPDB: 999999999
      Introduction: 888888888888888888
      Introduction Archive: 777777777
      Welcome: 666666666
      Admission Log: 555555555
  - user_id: 0
    key: "Roles"
    value:
      Staff: 111111111
      Guest: 222222222
      Member: 333333333
      Minor: 444444444
      Adult: 555555555
  - user_id: 0
    key: "Admin"
    value:
      Welcome Message: "Welcome to the server!"
  - user_id: 0
    key: "Rules"
    value:
      "Rule #1": "Be respectful to all members."
      "Rule #2": "No spamming or flooding the chat."
      "Rule #3": "Keep discussions on topic."
  - user_id: 0
    key: "Knowledge"
    value: # keys title-cased, as kb/simple_db_edit store and look them up ("FAQ" -> "Faq")
      Faq: "This is the FAQ content."
      Guidelines: "These are the guidelines."
  - user_id: 0
    key: "Directory"
    value:
      Exclude Categories:
        - "Staff Only"
        - "Bot Commands"
        - "Archive"
      Show Empty: false
      Show NSFW: false

command_map:
  123: "../../../utility/embed_exec.gohtml"
  124: "../../../utility/gematria.gohtml"
  125: "../../../utility/message_link.gohtml"
  126: "../../../utility/db_get_embed.gohtml"
  127: "../../../utility/db_get_text.gohtml"
  128: "../../../utility/contrast.gohtml"
  129: "../../../utility/db.gohtml"

tests:
  # ===== Utility Commands =====

  - name: "alefbet - Paleo-Hebrew to Hebrew"
    snapshot: true
    template: "../../../utility/alefbet.gohtml"
    context:
      args: ["𐤔𐤋𐤌"]

  - name: "alefbet - Rejects text that is already Hebrew"
    snapshot: true
    template: "../../../utility/alefbet.gohtml"
    context:
      args: ["שלום"]

  - name: "alefbet - Arabic to Hebrew"
    snapshot: true
    template: "../../../utility/alefbet.gohtml"
    context:
      args: ["سلام"]

  - name: "atbash - Basic cipher"
    snapshot: true
    template: "../../../utility/atbash.gohtml"
    context:
      args: ["אבגד"]

  - name: "atbash - No mapped characters gets an error instead of an empty cipher"
    template: "../../../utility/atbash.gohtml"
    context:
      args: ["!!! ???"]
    assertions:
      sent_messages: [{ embed_title: "Invalid Argument" }]

  - name: "contrast - Valid hex color"
    snapshot: true
    template: "../../../utility/contrast.gohtml"
    context:
      args: ["#FF5500"]

  - name: "contrast - Hex without hash"
    snapshot: true
    template: "../../../utility/contrast.gohtml"
    context:
      args: ["00FF00"]

  - name: "contrast - Role ID"
    snapshot: true
    template: "../../../utility/contrast.gohtml"
    context:
      args: ["876543210987654321"]
      guild:
        roles:
          - { id: 876543210987654321, name: "Blurple", color: 5793266, position: 3 }

  - name: "contrast - White is the embed color once"
    template: "../../../utility/contrast.gohtml"
    context:
      args: ["#ffffff"]
    assertions:
      sent_messages: [{ embed_contains: '"color": 16777215' }]

  - name: "contrasts - Multiple colors"
    snapshot: true
    template: "../../../utility/contrasts.gohtml"
    context:
      args: ["FF0000 00FF00 0000FF"]

  - name: "contrasts - Colors separated by a comma"
    snapshot: true
    template: "../../../utility/contrasts.gohtml"
    context:
      args: ["#ff0000,", "00ff00"]
    assertions:
      sent_messages:
        - { embed_title: "Contrast Ratios for `#ff0000`" }
        - { embed_title: "Contrast Ratios for `#00ff00`", nth: 2 }

  - name: "contrasts - Colors in a sentence"
    template: "../../../utility/contrasts.gohtml"
    context:
      args: ["#ff0000;#00ff00 and 0000ff."]
    assertions:
      sent_messages:
        - { embed_title: "Contrast Ratios for `#ff0000`" }
        - { embed_title: "Contrast Ratios for `#00ff00`", nth: 2 }
        - { embed_title: "Contrast Ratios for `#0000ff`", nth: 3 }

  - name: "contrasts - A role ID"
    snapshot: true
    template: "../../../utility/contrasts.gohtml"
    context:
      args: ["876543210987654321"]
      guild:
        roles:
          - { id: 876543210987654321, name: "Blurple", color: 5793266, position: 3 }
    assertions:
      sent_messages: [{ embed_title: "Contrast Ratios for `#5865f2`" }]

  - name: "contrasts - A role ID and a color"
    snapshot: true
    template: "../../../utility/contrasts.gohtml"
    context:
      args: ["876543210987654321", "#ff0000"]
      guild:
        roles:
          - { id: 876543210987654321, name: "Blurple", color: 5793266, position: 3 }
    assertions:
      sent_messages:
        - { embed_title: "Contrast Ratios for `#5865f2`" }
        - { embed_title: "Contrast Ratios for `#ff0000`", nth: 2 }

  - name: "contrasts - Only invalid words"
    template: "../../../utility/contrasts.gohtml"
    context:
      args: ["red", "12345678901234567"]
    assertions:
      sent_messages: [{ embed_title: "Invalid Argument" }]

  - name: "contrasts - Extra colors beyond the execCC limit get a warning"
    template: "../../../utility/contrasts.gohtml"
    context:
      # ExecCC Limit is 10 (shared Global); 11 valid colors drop 1
      args:
        [
          "#000000 #111111 #222222 #333333 #444444 #555555 #666666 #777777 #888888 #999999 #aaaaaa",
        ]
    assertions:
      sent_messages:
        [
          {
            # the warning is sent before the fan-out loop (a blocking sendMessage always
            # lands before an execCC child), so it's the first message, not the 11th
            content_contains: "⚠️ Warning: 1 color was not analyzed because only 10 colors can be analyzed at a time.",
            sent_after_seconds: 0,
          },
          { embed_title: "Contrast Ratios for `#000000`", nth: 2 },
        ]

  - name: "contrasts - ExecCC Limit above 10 still clamps to YAGPDB's per-run cap"
    template: "../../../utility/contrasts.gohtml"
    context:
      # 12 valid colors; unclamped (limit 20) all 12 would be attempted and the 11th
      # execCC would hit YAGPDB's real 10-per-run cap and error out the whole command
      args:
        [
          "#000000 #111111 #222222 #333333 #444444 #555555 #666666 #777777 #888888 #999999 #aaaaaa #bbbbbb",
        ]
    setup_db:
      - user_id: 0
        key: "Global"
        value: { Delete Trigger Delay: 5, Delete Response Delay: 10, ExecCC Limit: 20 }
    assertions:
      sent_messages:
        [
          {
            content_contains: "⚠️ Warning: 2 colors were not analyzed because only 10 colors can be analyzed at a time.",
            sent_after_seconds: 0,
          },
          { embed_title: "Contrast Ratios for `#000000`", nth: 2 },
        ]

  - name: "hugemoji - Discord custom emoji"
    snapshot: true
    template: "../../../utility/hugemoji.gohtml"
    context:
      args: ["<:test:123456789012345678>"]

  - name: "hugemoji - Animated emoji"
    snapshot: true
    template: "../../../utility/hugemoji.gohtml"
    context:
      args: ["<a:dance:987654321098765432>"]

  - name: "hugemoji - ExecCC Limit above 10 still clamps to YAGPDB's per-run cap"
    template: "../../../utility/hugemoji.gohtml"
    context:
      # 12 distinct custom emoji; unclamped (limit 20) all 12 would be attempted and the
      # 11th execCC would hit YAGPDB's real 10-per-run cap and error out the whole command
      args:
        [
          "<:e01:100000000000000001> <:e02:100000000000000002> <:e03:100000000000000003> <:e04:100000000000000004> <:e05:100000000000000005> <:e06:100000000000000006> <:e07:100000000000000007> <:e08:100000000000000008> <:e09:100000000000000009> <:e10:100000000000000010> <:e11:100000000000000011> <:e12:100000000000000012>",
        ]
    setup_db:
      - user_id: 0
        key: "Global"
        value: { Delete Trigger Delay: 5, Delete Response Delay: 10, ExecCC Limit: 20 }
    assertions:
      sent_messages:
        [
          {
            content_contains: "⚠️ Warning: 2 emojis were not displayed because only 10 emojis can be expanded at a time.",
            sent_after_seconds: 0,
          },
          { embed_title: "Emoji Expander", nth: 2 },
        ]

  - name: "hugemoji - Emoji taken from a linked message"
    template: "../../../utility/hugemoji.gohtml"
    context:
      args: ["https://discord.com/channels/111222333444555666/700000000000000002/800000000000000001"]
      guild:
        channels:
          - { id: 999999999, name: "yagpdb" }
          - { id: 700000000000000002, name: "lounge" }
      messages:
        - id: 800000000000000001
          channel_id: 700000000000000002
          author_id: 222333444555666777
          content: "<:test:123456789012345678>"
    assertions:
      sent_messages:
        [{ embed_title: "Emoji Expander", embed_contains: "Click or tap here to view the message" }]

  # The linked message is in an NSFW channel, linked from a non-NSFW one: refused for a
  # non-staff user (hugemoji.gohtml's $nsfwCheck); the user is warned why nothing showed up
  - name: "hugemoji - A link to an NSFW channel from a non-NSFW channel is refused for a non-staff user"
    snapshot: true
    template: "../../../utility/hugemoji.gohtml"
    context:
      args: ["https://discord.com/channels/111222333444555666/700000000000000003/800000000000000002"]
      guild:
        channels:
          - { id: 999999999, name: "yagpdb" }
          - { id: 700000000000000003, name: "nsfw-lounge", nsfw: true }
      messages:
        - id: 800000000000000002
          channel_id: 700000000000000003
          author_id: 222333444555666777
          content: "<:test:123456789012345678>"
    assertions:
      sent_messages:
        [
          {
            content_contains: "⚠️ Warning: 1 linked message was skipped: emoji from an NSFW channel can only be expanded in an NSFW channel.",
            sent_after_seconds: 0,
          },
        ]

  - name: "hugemoji - Two links refused for NSFW use plural grammar"
    template: "../../../utility/hugemoji.gohtml"
    context:
      args:
        [
          "https://discord.com/channels/111222333444555666/700000000000000003/800000000000000002 https://discord.com/channels/111222333444555666/700000000000000003/800000000000000004",
        ]
      guild:
        channels:
          - { id: 999999999, name: "yagpdb" }
          - { id: 700000000000000003, name: "nsfw-lounge", nsfw: true }
      messages:
        - id: 800000000000000002
          channel_id: 700000000000000003
          author_id: 222333444555666777
          content: "<:test:123456789012345678>"
        - id: 800000000000000004
          channel_id: 700000000000000003
          author_id: 222333444555666777
          content: "<:test2:123456789012345679>"
    assertions:
      sent_messages:
        [
          {
            content_contains: "⚠️ Warning: 2 linked messages were skipped: emoji from an NSFW channel can only be expanded in an NSFW channel.",
            sent_after_seconds: 0,
          },
        ]

  # A refused NSFW link alongside a directly-typed emoji that IS expanded: the NSFW
  # warning is computed and sent before the execCC loop fans out, so it lands first now
  - name: "hugemoji - An NSFW refusal alongside an expanded emoji: the warning goes first"
    template: "../../../utility/hugemoji.gohtml"
    context:
      args:
        [
          "<:test:123456789012345678> https://discord.com/channels/111222333444555666/700000000000000003/800000000000000002",
        ]
      guild:
        channels:
          - { id: 999999999, name: "yagpdb" }
          - { id: 700000000000000003, name: "nsfw-lounge", nsfw: true }
      messages:
        - id: 800000000000000002
          channel_id: 700000000000000003
          author_id: 222333444555666777
          content: "<:test2:123456789012345679>"
    assertions:
      sent_messages:
        - {
            content_contains: "⚠️ Warning: 1 linked message was skipped: emoji from an NSFW channel can only be expanded in an NSFW channel.",
            sent_after_seconds: 0,
          }
        - { embed_title: "Emoji Expander", nth: 2, sent_after_seconds: 0 }

  - name: "hugemoji - Plain text with no custom emoji sends an Invalid Argument error"
    template: "../../../utility/hugemoji.gohtml"
    context:
      args: ["hello there, no emoji here"]
    assertions:
      sent_messages:
        [
          {
            embed_title: "Invalid Argument",
            embed_contains: "No custom emoji were found in the input or linked messages",
            sent_after_seconds: 0,
          },
        ]

  - name: "hugemoji - A link to an NSFW channel from a non-NSFW channel is allowed for staff"
    template: "../../../utility/hugemoji.gohtml"
    context:
      args: ["https://discord.com/channels/111222333444555666/700000000000000003/800000000000000002"]
      user: { roles: [111111111] }
      guild:
        channels:
          - { id: 999999999, name: "yagpdb" }
          - { id: 700000000000000003, name: "nsfw-lounge", nsfw: true }
      messages:
        - id: 800000000000000002
          channel_id: 700000000000000003
          author_id: 222333444555666777
          content: "<:test:123456789012345678>"
    assertions:
      sent_messages:
        [{ embed_title: "Emoji Expander", embed_contains: "Click or tap here to view the message" }]

  - name: "hugemoji - Exactly one emoji over the limit uses singular grammar"
    template: "../../../utility/hugemoji.gohtml"
    context:
      # 11 distinct custom emoji; the default ExecCC Limit (10, shared Global) drops 1
      args:
        [
          "<:e01:100000000000000001> <:e02:100000000000000002> <:e03:100000000000000003> <:e04:100000000000000004> <:e05:100000000000000005> <:e06:100000000000000006> <:e07:100000000000000007> <:e08:100000000000000008> <:e09:100000000000000009> <:e10:100000000000000010> <:e11:100000000000000011>",
        ]
    assertions:
      sent_messages:
        [
          {
            content_contains: "⚠️ Warning: 1 emoji was not displayed because only 10 emojis can be expanded at a time.",
            sent_after_seconds: 0,
          },
          { embed_title: "Emoji Expander", nth: 2 },
        ]

  - name: "kb - Knowledge base lookup"
    snapshot: true
    template: "../../../utility/kb.gohtml"
    context:
      args: ["FAQ"]

  - name: "define - Simple term slugifies to lowercase-hyphenated"
    template: "../../../utility/define.gohtml"
    context:
      args: ["Chaos Magick"]
    assertions:
      sent_messages:
        [
          {
            embed_title: "Glossary: Chaos Magick",
            embed_contains: "https://thenighthouse.org/glossary/#chaos-magick\"",
          },
        ]

  - name: "define - Multi-word term with internal spaces"
    template: "../../../utility/define.gohtml"
    context:
      args: ["Right hand path"]
    assertions:
      sent_messages:
        [
          {
            embed_title: "Glossary: Right hand path",
            embed_contains: "https://thenighthouse.org/glossary/#right-hand-path\"",
          },
        ]

  - name: "define - All-caps term lowercases in the slug"
    template: "../../../utility/define.gohtml"
    context:
      args: ["UPG"]
    assertions:
      sent_messages:
        [
          {
            embed_title: "Glossary: UPG",
            embed_contains: "https://thenighthouse.org/glossary/#upg\"",
          },
        ]

  - name: "define - Existing hyphen in the term is kept as one hyphen"
    template: "../../../utility/define.gohtml"
    context:
      args: ["Clair-senses"]
    assertions:
      sent_messages:
        [
          {
            embed_title: "Glossary: Clair-senses",
            embed_contains: "https://thenighthouse.org/glossary/#clair-senses\"",
          },
        ]

  - name: "define - Accented letters fold to their base letter"
    template: "../../../utility/define.gohtml"
    context:
      args: ["Ásatrú"]
    assertions:
      sent_messages:
        [
          {
            embed_title: "Glossary: Ásatrú",
            embed_contains: "https://thenighthouse.org/glossary/#asatru\"",
          },
        ]

  - name: "define - Another accented term folds correctly"
    template: "../../../utility/define.gohtml"
    context:
      args: ["Santería"]
    assertions:
      sent_messages:
        [
          {
            embed_title: "Glossary: Santería",
            embed_contains: "https://thenighthouse.org/glossary/#santeria\"",
          },
        ]

  - name: "define - Punctuation runs collapse and edges trim"
    template: "../../../utility/define.gohtml"
    context:
      args: ["  --Foo!!  Bar-- "]
    assertions:
      sent_messages:
        [
          {
            embed_title: "Glossary: --Foo!!  Bar--",
            embed_contains: "https://thenighthouse.org/glossary/#foo-bar\"",
          },
        ]

  - name: "define - No argument links the bare glossary page"
    template: "../../../utility/define.gohtml"
    context:
      args: []
    assertions:
      sent_messages:
        [
          {
            embed_title: "Glossary",
            embed_contains: "https://thenighthouse.org/glossary/\"",
          },
        ]

  - name: "define - All-punctuation term has no slug, so links the bare glossary page"
    template: "../../../utility/define.gohtml"
    context:
      args: ["!!!"]
    assertions:
      sent_messages:
        [
          {
            embed_title: "Glossary: !!!",
            embed_contains: "https://thenighthouse.org/glossary/\"",
          },
        ]

  - name: "define - Unquoted multi-token args rejoin into one term"
    template: "../../../utility/define.gohtml"
    context:
      args: ["Chaos", "Magick"]
    assertions:
      sent_messages:
        [
          {
            embed_title: "Glossary: Chaos Magick",
            embed_contains: "https://thenighthouse.org/glossary/#chaos-magick\"",
          },
        ]

  - name: "define - Macron vowel folds to its base letter"
    template: "../../../utility/define.gohtml"
    context:
      args: ["Ātman"]
    assertions:
      sent_messages:
        [
          {
            embed_title: "Glossary: Ātman",
            embed_contains: "https://thenighthouse.org/glossary/#atman\"",
          },
        ]

  - name: "message_pointer - Valid message link"
    snapshot: true
    template: "../../../utility/message_pointer.gohtml"
    context:
      args: ["https://discord.com/channels/111222333444555666/888888888888888888/999888777666555444"]
      messages:
        - id: 999888777666555444
          channel_id: 888888888888888888
          author_id: 222333444555666777
          content: "Hi everyone! I'm new here and glad to join."

  - name: "pyramid - Simple text"
    snapshot: true
    template: "../../../utility/pyramid.gohtml"
    context:
      args: ["hello"]

  - name: "pyramid - ExecCC Limit above 10 still clamps to YAGPDB's per-run cap"
    template: "../../../utility/pyramid.gohtml"
    context:
      # 12 words; unclamped (limit 20) all 12 would be attempted and the 11th execCC
      # (each recurses into pyramid's OWN nested run, but still counts against this run's
      # cap) would hit YAGPDB's real 10-per-run cap and error out the whole command
      args: ["one two three four five six seven eight nine ten eleven twelve"]
    setup_db:
      - user_id: 0
        key: "Global"
        value: { Delete Trigger Delay: 5, Delete Response Delay: 10, ExecCC Limit: 20 }
      - user_id: 0
        key: "Commands"
        value: # embed_exec/gematria kept so nested execCC still resolves; pyramid added for this test
          embed_exec: "123"
          gematria: "124"
          pyramid: "131"
    command_map:
      131: "../../../utility/pyramid.gohtml"
    assertions:
      sent_messages:
        - { content_contains: "Skipping execCC call #11 due to having exceeded the limit of 10 calls!" }
        - { nth: 2, content_contains: "Skipping execCC call #12 due to having exceeded the limit of 10 calls!" }

  # Several words: pyramid.gohtml execCC's its own template once per word (up to the limit),
  # each a delayed (1s) call, so this run schedules them rather than running them (execCC's
  # own doc: "They aren't run: test that command separately" - the single-word branch above,
  # "pyramid - Simple text", is that separate test, run once per word when scheduled for real)
  - name: "pyramid - Several words each schedule their own pyramid execCC"
    template: "../../../utility/pyramid.gohtml"
    context:
      args: ["hi bye lo"]
    setup_db:
      - user_id: 0
        key: "Commands"
        value: # embed_exec/gematria kept so nested execCC still resolves; pyramid added for this test
          embed_exec: "123"
          gematria: "124"
          pyramid: "131"
    assertions:
      scheduled_runs:
        - { cc_id: 131, delay: 1s, exec_data_contains: '"Description":"hi"' }
        - { cc_id: 131, delay: 1s, exec_data_contains: '"Description":"bye"' }
        - { cc_id: 131, delay: 1s, exec_data_contains: '"Description":"lo"' }

  - name: "rand_hebrew - Generate random letters"
    snapshot: true
    template: "../../../utility/rand_hebrew.gohtml"
    context:
      args: ["5"]
      seed: 1 # the letters are random

  - name: "rand_hebrew - NxM group mode"
    snapshot: true
    template: "../../../utility/rand_hebrew.gohtml"
    context:
      args: ["2x3"]
      seed: 1 # the letters are random; sofit forms replace the last letter of each group

  - name: "rand_hebrew - An invalid format is rejected"
    template: "../../../utility/rand_hebrew.gohtml"
    context:
      args: ["abc"]
    assertions:
      sent_messages: [{ embed_title: "Invalid Argument" }]

  - name: "rule - View rule 1"
    snapshot: true
    template: "../../../utility/rule.gohtml"
    context:
      args: ["1"]

  - name: "rule - View rule 2"
    snapshot: true
    template: "../../../utility/rule.gohtml"
    context:
      args: ["2"]

  - name: "rule - Reads a rule past a gap"
    template: "../../../utility/rule.gohtml"
    context:
      args: ["3"]
    setup_db:
      - user_id: 0
        key: "Rules"
        value: # Rule #2 removed, leaving a gap before the highest rule
          "Rule #1": "Be respectful to all members."
          "Rule #3": "Keep discussions on topic."
    assertions:
      sent_messages: [{ embed_title: "Rule #3" }]

  - name: "rules - Skips a gap without a lookup failure or counting it"
    snapshot: true
    template: "../../../staff_utility/rules.gohtml"
    context:
      args: []
    setup_db:
      - user_id: 0
        key: "Rules"
        value: # Rule #2 removed, leaving a gap before the highest rule
          "Rule #1": "Be respectful to all members."
          "Rule #3": "Keep discussions on topic."
    assertions:
      # both land in the same (only) message: rules.gohtml no longer execCC's `rule`
      # or sleeps between rules, it builds and packs the embeds itself
      sent_messages:
        - { embed_title: "Rule #1", sent_after_seconds: 0 }
        - { embed_title: "Rule #3", sent_after_seconds: 0 }

  - name: "rules - Three rules pack into one message, in order"
    snapshot: true
    template: "../../../staff_utility/rules.gohtml"
    context:
      args: []
    setup_db:
      - user_id: 0
        key: "Rules"
        value:
          "Rule #1": "One"
          "Rule #2": "Two"
          "Rule #3": "Three"
    assertions:
      sent_messages:
        - { embed_title: "Rule #1" }
        - { embed_title: "Rule #2" }
        - { embed_title: "Rule #3" }

  - name: "rules - No actual rules is treated as none configured"
    template: "../../../staff_utility/rules.gohtml"
    context:
      args: []
    setup_db:
      - user_id: 0
        key: "Rules"
        value: # holds a key, but none of them are "Rule #N"
          "Some Other Key": "not a rule"
    assertions:
      sent_messages: [{ embed_title: "Rules Lookup Failed" }]

  - name: "rules - A skipped gap doesn't count toward the 10-embeds-per-message pack"
    template: "../../../staff_utility/rules.gohtml"
    context:
      # rules 1-11, with #5 missing: 10 real rules. If the gap counted as an embed, rule
      # #11 would spill into a second message instead of packing into the first with #1-10
      args: ["1", "11"]
    setup_db:
      - user_id: 0
        key: "Rules"
        value:
          "Rule #1": "One"
          "Rule #2": "Two"
          "Rule #3": "Three"
          "Rule #4": "Four"
          "Rule #6": "Six"
          "Rule #7": "Seven"
          "Rule #8": "Eight"
          "Rule #9": "Nine"
          "Rule #10": "Ten"
          "Rule #11": "Eleven"
    assertions:
      # both in message 1: a counter that also advances on the skipped #5 would push #11
      # into message 2 instead
      sent_messages:
        - { embed_title: "Rule #1" }
        - { embed_title: "Rule #11" }

  - name: "rules - 12 short rules pack into 2 messages (10 + 2)"
    template: "../../../staff_utility/rules.gohtml"
    context:
      args: []
    setup_db:
      - user_id: 0
        key: "Rules"
        value:
          "Rule #1": "One"
          "Rule #2": "Two"
          "Rule #3": "Three"
          "Rule #4": "Four"
          "Rule #5": "Five"
          "Rule #6": "Six"
          "Rule #7": "Seven"
          "Rule #8": "Eight"
          "Rule #9": "Nine"
          "Rule #10": "Ten"
          "Rule #11": "Eleven"
          "Rule #12": "Twelve"
    assertions:
      # 10 embeds/message is Discord's cap (docs/API_REFERENCE.md; vendor
      # common/templates/general.go's maxEmbeds), so #1-10 pack into message 1 and #11-12
      # spill into message 2
      sent_messages:
        - { embed_title: "Rule #1" }
        - { embed_title: "Rule #10" }
        - { embed_title: "Rule #11", nth: 2 }
        - { embed_title: "Rule #12", nth: 2 }

  - name: "rules - Embeds exceeding 6,000 characters together split before the limit"
    template: "../../../staff_utility/rules.gohtml"
    context:
      args: []
    setup_db:
      - user_id: 0
        key: "Rules"
        value:
          "Rule #1": ""
          "Rule #2": ""
          "Rule #3": ""
    assertions:
      sent_messages:
        - { embed_title: "Rule #1" }
        - { embed_title: "Rule #2" }
        - { embed_title: "Rule #3", nth: 2 }

  # ===== Staff Utility Commands =====

  - name: "bootstrap - Initialize with command IDs"
    snapshot: true
    template: "../../../staff_utility/bootstrap.gohtml"
    context:
      # embed_exec 123, db 130 (setup_db has 129, so bootstrap's write shows), the Staff
      # role; run in #yagpdb, which bootstrap records as the YAGPDB channel
      args: ["123", "130", "111111111"]
      channel: { id: 999999999, name: "yagpdb" }

  - name: "inactivity - Prune an inactive member"
    snapshot: true
    template: "../../../staff_utility/inactivity.gohtml"
    context:
      # prune checks the member's Active/Inactive roles; this one is Inactive only
      args: ["prune", "<@222333444555666777>"]
      user: { roles: [111111111] }
      member_roles: { 222333444555666777: [333333333, 121212121] }
      # YAGPDB's kick response (moderation/commands.go ~330, GenericCmdResp with noDur=true),
      # with the target's String() as the emulator gives it here ("MockUser", discriminator "0")
      exec_responses: { 'kick 222333444555666777 "pruned due to inactivity"': "👢 Kicked `MockUser`" }
      guild:
        roles:
          - { id: 111111111, name: "Staff" }
          - { id: 222222222, name: "Guest" }
          - { id: 333333333, name: "Member" }
          - { id: 444444444, name: "Minor" }
          - { id: 555555555, name: "Adult" }
          - { id: 121212121, name: "Inactive" }
          - { id: 131313131, name: "Active" }
    setup_db:
      - user_id: 0
        key: "Roles"
        value:
          Staff: 111111111
          Guest: 222222222
          Member: 333333333
          Minor: 444444444
          Adult: 555555555
          Inactive: 121212121
          Active: 131313131
      - user_id: 0
        key: "Inactivity Prune"
        value:
          Previous Date: "June 1"
          Next Date: "September 1"
          Message Threshold: "10"
          Minute Threshold: "30"

  - name: "inactivity - date action rotates the previous/next dates via the db execCC"
    template: "../../../staff_utility/inactivity.gohtml"
    context:
      args: ["date", "October 1"]
    setup_db:
      - user_id: 0
        key: "Inactivity Prune"
        value:
          Previous Date: "June 1"
          Next Date: "September 1"
          Message Threshold: "10"
          Minute Threshold: "30"
    assertions:
      db_checks:
        - { user_id: 0, key: "Inactivity Prune", value_contains: '"Previous Date":"September 1"' }
        - { user_id: 0, key: "Inactivity Prune", value_contains: '"Next Date":"October 1"' }

  - name: "inactivity - date action without a parameter asks for one"
    template: "../../../staff_utility/inactivity.gohtml"
    context:
      args: ["date"]
    assertions:
      sent_messages: [{ embed_title: "Missing Date Parameter" }]

  - name: "inactivity - start action posts the opening announcement with placeholders filled in"
    template: "../../../staff_utility/inactivity.gohtml"
    context:
      args: ["start"]
    setup_db:
      - user_id: 0
        key: "Inactivity Prune"
        value:
          Previous Date: "June 1"
          Next Date: "September 1"
