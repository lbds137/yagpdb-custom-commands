name: "Command Integration Tests"
description: "Tests for utility and staff_utility commands that require arguments"

defaults:
  user:
    id: 987654321098765432
    username: "TestUser"
    discriminator: "0001"
  channel:
    id: 123456789012345678
    name: "test-channel"
  guild:
    channels:
      - { id: 999999999, name: "yagpdb" }
      - { id: 888888888888888888, name: "introduction" }
      - { id: 777777777, name: "introduction-archive" }
      - { id: 666666666, name: "welcome" }
      - { id: 555555555, name: "admission-log" }
    id: 111222333444555666
    name: "Test Server"
    roles:
      - { id: 111111111, name: "Staff" }
      - { id: 222222222, name: "Guest" }
      - { id: 333333333, name: "Member" }
      - { id: 444444444, name: "Minor" }
      - { id: 555555555, name: "Adult" }

# The Gematria tables come from the real bootstrap (alefbet, atbash, pyramid and rand_hebrew
# read them; gematria has its own suite)
setup_templates: ["../../../staff_utility/gematria_bootstrap.gohtml"]

# Common database setup for all tests
setup_db:
  - user_id: 0
    key: "Global"
    value:
      Delete Trigger Delay: 5
      Delete Response Delay: 10
      ExecCC Limit: 10
  - user_id: 0
    key: "Commands"
    value: # strings, as the bootstrap stores them (str); commands toInt them
      embed_exec: "123"
      gematria: "124"
      message_link: "125"
      db_get_embed: "126"
      db_get_text: "127"
      contrast: "128"
      db: "129"
  - user_id: 0
    key: "Channels"
    value:
      YAGPDB: 999999999
      Introduction: 888888888888888888
      Introduction Archive: 777777777
      Welcome: 666666666
      Admission Log: 555555555
  - user_id: 0
    key: "Roles"
    value:
      Staff: 111111111
      Guest: 222222222
      Member: 333333333
      Minor: 444444444
      Adult: 555555555
  - user_id: 0
    key: "Admin"
    value:
      Welcome Message: "Welcome to the server!"
  - user_id: 0
    key: "Rules"
    value:
      "Rule #1": "Be respectful to all members."
      "Rule #2": "No spamming or flooding the chat."
      "Rule #3": "Keep discussions on topic."
  - user_id: 0
    key: "Knowledge"
    value: # keys title-cased, as kb/simple_db_edit store and look them up ("FAQ" -> "Faq")
      Faq: "This is the FAQ content."
      Guidelines: "These are the guidelines."
  - user_id: 0
    key: "Directory"
    value:
      Exclude Categories:
        - "Staff Only"
        - "Bot Commands"
        - "Archive"
      Show Empty: false
      Show NSFW: false

command_map:
  123: "templates/recording_embed_exec.gohtml"
  124: "../../../utility/gematria.gohtml"
  125: "../../../utility/message_link.gohtml"
  126: "../../../utility/db_get_embed.gohtml"
  127: "../../../utility/db_get_text.gohtml"
  128: "../../../utility/contrast.gohtml"
  129: "../../../utility/db.gohtml"

tests:
  # ===== Utility Commands =====

  - name: "alefbet - Paleo-Hebrew to Hebrew"
    snapshot: true
    template: "../../../utility/alefbet.gohtml"
    context:
      args: ["𐤔𐤋𐤌"]

  - name: "alefbet - Rejects text that is already Hebrew"
    snapshot: true
    template: "../../../utility/alefbet.gohtml"
    context:
      args: ["שלום"]

  - name: "alefbet - Arabic to Hebrew"
    snapshot: true
    template: "../../../utility/alefbet.gohtml"
    context:
      args: ["سلام"]

  - name: "atbash - Basic cipher"
    snapshot: true
    template: "../../../utility/atbash.gohtml"
    context:
      args: ["אבגד"]

  - name: "contrast - Valid hex color"
    snapshot: true
    template: "../../../utility/contrast.gohtml"
    context:
      args: ["#FF5500"]

  - name: "contrast - Hex without hash"
    snapshot: true
    template: "../../../utility/contrast.gohtml"
    context:
      args: ["00FF00"]

  - name: "contrast - Role ID"
    snapshot: true
    template: "../../../utility/contrast.gohtml"
    context:
      args: ["876543210987654321"]
      guild:
        roles:
          - { id: 876543210987654321, name: "Blurple", color: 5793266, position: 3 }

  - name: "contrast - White is the embed color once"
    template: "../../../utility/contrast.gohtml"
    context:
      args: ["#ffffff"]
    assertions:
      sent_messages: [{ embed_contains: '"color": 16777215' }]

  - name: "contrasts - Multiple colors"
    snapshot: true
    template: "../../../utility/contrasts.gohtml"
    context:
      args: ["FF0000 00FF00 0000FF"]

  - name: "contrasts - Colors separated by a comma"
    snapshot: true
    template: "../../../utility/contrasts.gohtml"
    context:
      args: ["#ff0000,", "00ff00"]
    assertions:
      sent_messages:
        - { embed_title: "Contrast Ratios for `#ff0000`" }
        - { embed_title: "Contrast Ratios for `#00ff00`", nth: 2 }

  - name: "contrasts - Colors in a sentence"
    template: "../../../utility/contrasts.gohtml"
    context:
      args: ["#ff0000;#00ff00 and 0000ff."]
    assertions:
      sent_messages:
        - { embed_title: "Contrast Ratios for `#ff0000`" }
        - { embed_title: "Contrast Ratios for `#00ff00`", nth: 2 }
        - { embed_title: "Contrast Ratios for `#0000ff`", nth: 3 }

  - name: "contrasts - A role ID"
    snapshot: true
    template: "../../../utility/contrasts.gohtml"
    context:
      args: ["876543210987654321"]
      guild:
        roles:
          - { id: 876543210987654321, name: "Blurple", color: 5793266, position: 3 }
    assertions:
      sent_messages: [{ embed_title: "Contrast Ratios for `#5865f2`" }]

  - name: "contrasts - A role ID and a color"
    snapshot: true
    template: "../../../utility/contrasts.gohtml"
    context:
      args: ["876543210987654321", "#ff0000"]
      guild:
        roles:
          - { id: 876543210987654321, name: "Blurple", color: 5793266, position: 3 }
    assertions:
      sent_messages:
        - { embed_title: "Contrast Ratios for `#5865f2`" }
        - { embed_title: "Contrast Ratios for `#ff0000`", nth: 2 }

  - name: "contrasts - Only invalid words"
    template: "../../../utility/contrasts.gohtml"
    context:
      args: ["red", "12345678901234567"]
    assertions:
      sent_messages: [{ embed_title: "Invalid Argument" }]

  - name: "hugemoji - Discord custom emoji"
    snapshot: true
    template: "../../../utility/hugemoji.gohtml"
    context:
      args: ["<:test:123456789012345678>"]

  - name: "hugemoji - Animated emoji"
    snapshot: true
    template: "../../../utility/hugemoji.gohtml"
    context:
      args: ["<a:dance:987654321098765432>"]

  - name: "kb - Knowledge base lookup"
    snapshot: true
    template: "../../../utility/kb.gohtml"
    context:
      args: ["FAQ"]

  - name: "message_pointer - Valid message link"
    snapshot: true
    template: "../../../utility/message_pointer.gohtml"
    context:
      args: ["https://discord.com/channels/111222333444555666/888888888888888888/999888777666555444"]
      messages:
        - id: 999888777666555444
          channel_id: 888888888888888888
          author_id: 222333444555666777
          content: "Hi everyone! I'm new here and glad to join."

  - name: "pyramid - Simple text"
    snapshot: true
    template: "../../../utility/pyramid.gohtml"
    context:
      args: ["hello"]

  - name: "rand_hebrew - Generate random letters"
    snapshot: true
    template: "../../../utility/rand_hebrew.gohtml"
    context:
      args: ["5"]
      seed: 1 # the letters are random

  - name: "rule - View rule 1"
    snapshot: true
    template: "../../../utility/rule.gohtml"
    context:
      args: ["1"]

  - name: "rule - View rule 2"
    snapshot: true
    template: "../../../utility/rule.gohtml"
    context:
      args: ["2"]

  # ===== Staff Utility Commands =====

  - name: "bootstrap - Initialize with command IDs"
    snapshot: true
    template: "../../../staff_utility/bootstrap.gohtml"
    context:
      # embed_exec 123, db 130 (setup_db has 129, so bootstrap's write shows), the Staff
      # role; run in #yagpdb, which bootstrap records as the YAGPDB channel
      args: ["123", "130", "111111111"]
      channel: { id: 999999999, name: "yagpdb" }

  - name: "inactivity - Prune an inactive member"
    snapshot: true
    template: "../../../staff_utility/inactivity.gohtml"
    context:
      # prune checks the member's Active/Inactive roles; this one is Inactive only
      args: ["prune", "<@222333444555666777>"]
      user: { roles: [111111111] }
      member_roles: { 222333444555666777: [333333333, 121212121] }
      guild:
        roles:
          - { id: 111111111, name: "Staff" }
          - { id: 222222222, name: "Guest" }
          - { id: 333333333, name: "Member" }
          - { id: 444444444, name: "Minor" }
          - { id: 555555555, name: "Adult" }
          - { id: 121212121, name: "Inactive" }
          - { id: 131313131, name: "Active" }
    setup_db:
      - user_id: 0
        key: "Roles"
        value:
          Staff: 111111111
          Guest: 222222222
          Member: 333333333
          Minor: 444444444
          Adult: 555555555
          Inactive: 121212121
          Active: 131313131
      - user_id: 0
        key: "Inactivity Prune"
        value:
          Previous Date: "June 1"
          Next Date: "September 1"
          Message Threshold: "10"
          Minute Threshold: "30"

  - name: "role_ping - Ping a role"
    snapshot: true
    template: "../../../staff_utility/role_ping.gohtml"
    context:
      args: ["Member:Important announcement!"]

  - name: "role_ping - A lowercase role name without a message"
    template: "../../../staff_utility/role_ping.gohtml"
    context:
      args: ["member"]
    assertions:
      response_pings: { roles: [333333333] }

  - name: "role_ping - An unknown role sends only the error"
    snapshot: true
    template: "../../../staff_utility/role_ping.gohtml"
    context:
      args: ["Nope:hello everyone"]
    assertions:
      sent_messages: [{ embed_title: "Invalid Argument" }]

  - name: "role_ping - (nil) sends the message without a ping"
    snapshot: true
    template: "../../../staff_utility/role_ping.gohtml"
    context:
      args: ["(nil):hello everyone"]
    assertions:
      sent_messages: [{ content_equals: "hello everyone" }]
      response_pings: {}

  - name: "rule_edit - Edit a rule"
    snapshot: true
    template: "../../../staff_utility/rule_edit.gohtml"
    context:
      args: ["1", "Updated rule text here."]

  - name: "simple_db_lookup - Lookup knowledge entry"
    snapshot: true
    template: "../../../staff_utility/simple_db_lookup.gohtml"
    context:
      args: ["Knowledge", "FAQ"]

  - name: "simple_db_edit - Edit knowledge entry"
    snapshot: true
    template: "../../../staff_utility/simple_db_edit.gohtml"
    context:
      args: ["Knowledge", "FAQ", "Updated FAQ content"]

  # `<op>:0` works on the global data (user 0), and only for a member with the Staff
  # role (Roles "Staff" = 111111111)

  # ===== Database Dump =====

  - name: "db dump - Dump all keys"
    snapshot: true
    template: "../../../utility/db.gohtml"
    context:
      args: ["dump:0"]
      user: { roles: [111111111] }
      clock: 2026-01-02T03:04:05Z # the file name holds the time

  - name: "db dump - Dump specific key"
    snapshot: true
    template: "../../../utility/db.gohtml"
    context:
      args: ["dump:0", "Global"]
      user: { roles: [111111111] }
      clock: 2026-01-02T03:04:05Z # the file name holds the time

  # ===== Database Add (Array Append) =====

  # a stored array reads back as a *templates.Slice, so db.gohtml asks kindOf to look
  # through the pointer
  - name: "db add - Append to array via nested key"
    snapshot: true
    template: "../../../utility/db.gohtml"
    context:
      args: ["add:0", "Directory:Exclude Categories", "New Category"]
      user: { roles: [111111111] }
    assertions:
      sent_messages: [{ embed_contains: "Value successfully added!" }]
      db_checks: [{ user_id: 0, key: "Directory", value_contains: '"Archive","New Category"]' }]

  - name: "db add - JSON array appends to a stored array"
    template: "../../../utility/db.gohtml"
    context:
      args: ["add:0", "Directory", "{\"Exclude Categories\": [\"Memes\"]}"]
      user: { roles: [111111111] }
    assertions:
      sent_messages: [{ embed_contains: "Value successfully added!" }]
      db_checks: [{ user_id: 0, key: "Directory", value_contains: '"Archive","Memes"]' }]

  - name: "db add - JSON merges into a nested dictionary"
    template: "../../../utility/db.gohtml"
    context:
      args: ["add:0", "Nested:Inner", "{\"b\": 2}"]
      user: { roles: [111111111] }
    setup_db:
      - { user_id: 0, key: "Nested", value: { Inner: { a: 1 }, Other: 3 } }
    assertions:
      sent_messages: [{ embed_contains: "Value successfully added!" }]
      db_checks: [{ user_id: 0, key: "Nested", value_equals: { Inner: { a: 1, b: 2 }, Other: 3 } }]

  - name: "db add - A missing key is not a success"
    template: "../../../utility/db.gohtml"
    context:
      args: ["add:0", "Nothing", "x"]
      user: { roles: [111111111] }
    assertions:
      sent_messages: [{ embed_contains: "No array or dictionary found for the given key!" }]
      db_checks: [{ user_id: 0, key: "Nothing", not_exists: true }]

  - name: "db add - A missing nested key is not a success"
    template: "../../../utility/db.gohtml"
    context:
      args: ["add:0", "Global:Nothing", "x"]
      user: { roles: [111111111] }
    assertions:
      sent_messages: [{ embed_contains: "No array or dictionary found for the given key!" }]
      db_checks: [{ user_id: 0, key: "Global", value_equals: { Delete Trigger Delay: 5, Delete Response Delay: 10, ExecCC Limit: 10 } }]

  - name: "db add - Text into a dictionary is refused"
    template: "../../../utility/db.gohtml"
    context:
      args: ["add:0", "Global", "x"]
      user: { roles: [111111111] }
    assertions:
      sent_messages: [{ embed_contains: "Invalid value provided!" }]
      db_checks: [{ user_id: 0, key: "Global", value_equals: { Delete Trigger Delay: 5, Delete Response Delay: 10, ExecCC Limit: 10 } }]

  - name: "db get - Read a nested array"
    snapshot: true
    template: "../../../utility/db.gohtml"
    context:
      args: ["get:0", "Directory:Exclude Categories"]
      user: { roles: [111111111] }

  # ===== Database Remove (Array Remove) =====

  - name: "db remove - Remove item from array via nested key"
    snapshot: true
    template: "../../../utility/db.gohtml"
    context:
      args: ["remove:0", "Directory:Exclude Categories", "Staff Only"]
      user: { roles: [111111111] }
    assertions:
      sent_messages: [{ embed_contains: "Value successfully removed!" }]
      db_checks: [{ user_id: 0, key: "Directory", value_contains: '["Bot Commands","Archive"]' }]

  - name: "db remove - An item not in the array is not a success"
    template: "../../../utility/db.gohtml"
    context:
      args: ["remove:0", "Directory:Exclude Categories", "Nope"]
      user: { roles: [111111111] }
    assertions:
      sent_messages: [{ embed_contains: "No value found!" }]
      db_checks: [{ user_id: 0, key: "Directory", value_contains: '["Staff Only","Bot Commands","Archive"]' }]

  - name: "db remove - A key not in the dictionary is not a success"
    template: "../../../utility/db.gohtml"
    context:
      args: ["remove:0", "Global", "{\"Nope\": \"\"}"]
      user: { roles: [111111111] }
    assertions:
      sent_messages: [{ embed_contains: "No value found!" }]

  - name: "db remove - JSON removes from a nested dictionary"
    template: "../../../utility/db.gohtml"
    context:
      args: ["remove:0", "Nested:Inner", "{\"a\": \"\"}"]
      user: { roles: [111111111] }
    setup_db:
      - { user_id: 0, key: "Nested", value: { Inner: { a: 1, b: 2 }, a: 3 } }
    assertions:
      sent_messages: [{ embed_contains: "Value successfully removed!" }]
      db_checks: [{ user_id: 0, key: "Nested", value_equals: { Inner: { b: 2 }, a: 3 } }]

  - name: "db remove - Remove with JSON from dict"
    snapshot: true
    template: "../../../utility/db.gohtml"
    context:
      args: ["remove:0", "Global", "{\"Delete Trigger Delay\": \"\"}"]
      user: { roles: [111111111] }

  # ===== Database Edge Cases =====

  - name: "db keys - List dictionary keys"
    snapshot: true
    template: "../../../utility/db.gohtml"
    context:
      args: ["keys:0", "Global"]
      user: { roles: [111111111] }

  - name: "db delete - Delete a nested key"
    snapshot: true
    template: "../../../utility/db.gohtml"
    context:
      args: ["delete:0", "Directory:Exclude Categories"]
      user: { roles: [111111111] }

  - name: "db get - A stored false is a value"
    template: "../../../utility/db.gohtml"
    context:
      args: ["get:0", "Directory:Show Empty"]
      user: { roles: [111111111] }
    assertions:
      sent_messages: [{ embed_contains: "Value successfully retrieved!" }]

  - name: "db get - A stored 0 is a value"
    template: "../../../utility/db.gohtml"
    context:
      args: ["get:0", "Counter"]
      user: { roles: [111111111] }
    setup_db:
      - { user_id: 0, key: "Counter", value: 0 }
    assertions:
      sent_messages: [{ embed_contains: "Value successfully retrieved!" }]

  - name: "db get - A path through a missing key finds nothing"
    template: "../../../utility/db.gohtml"
    context:
      args: ["get:0", "Directory:Nope:Show Empty"]
      user: { roles: [111111111] }
    assertions:
      sent_messages: [{ embed_contains: "No value found!" }]

  - name: "db get - A path through a value that isn't a dictionary finds nothing"
    template: "../../../utility/db.gohtml"
    context:
      args: ["get:0", "Admin:Welcome Message:Deeper"]
      user: { roles: [111111111] }
    assertions:
      sent_messages: [{ embed_contains: "No value found!" }]

  - name: "db delete - A stored false is deleted"
    template: "../../../utility/db.gohtml"
    context:
      args: ["delete:0", "Directory:Show Empty"]
      user: { roles: [111111111] }
    assertions:
      sent_messages: [{ embed_contains: "Value successfully deleted!" }]
      db_checks:
        - user_id: 0
          key: "Directory"
          value_equals: { Exclude Categories: ["Staff Only", "Bot Commands", "Archive"], Show NSFW: false }

  - name: "db delete - A stored 0 is deleted"
    template: "../../../utility/db.gohtml"
    context:
      args: ["delete:0", "Counter"]
      user: { roles: [111111111] }
    setup_db:
      - { user_id: 0, key: "Counter", value: 0 }
    assertions:
      sent_messages: [{ embed_contains: "Value successfully deleted!" }]
      db_checks: [{ user_id: 0, key: "Counter", not_exists: true }]

  - name: "db set - A path through a missing key is refused"
    template: "../../../utility/db.gohtml"
    context:
      args: ["set:0", "Global:Nope:Deeper", "{\"a\": 1}"]
      user: { roles: [111111111] }
    assertions:
      sent_messages: [{ embed_contains: "No dictionary found for the given key!" }]
      db_checks: [{ user_id: 0, key: "Global", value_equals: { Delete Trigger Delay: 5, Delete Response Delay: 10, ExecCC Limit: 10 } }]

  - name: "db set - A nested key"
    template: "../../../utility/db.gohtml"
    context:
      args: ["set:0", "Global:New", "{\"a\": 1}"]
      user: { roles: [111111111] }
    assertions:
      sent_messages: [{ embed_contains: "Value successfully set!" }]
      db_checks: [{ user_id: 0, key: "Global", value_contains: '"New":{"a":1}' }]

  - name: "message_pointer - Not a link"
    template: "../../../utility/message_pointer.gohtml"
    context:
      args: ["hello"]
    assertions:
      sent_messages: [{ embed_title: "Invalid Message Link" }]

  - name: "message_pointer - A long comment is cut between characters"
    template: "../../../utility/message_pointer.gohtml"
    context:
      # 1025 characters, the last three 3 bytes long; the field holds 1023 and "…" (1024)
      args: ["https://discord.com/channels/111222333444555666/888888888888888888/999888777666555444", "€€€"]
      messages:
        - { id: 999888777666555444, channel_id: 888888888888888888, author_id: 222333444555666777, content: "hi" }
    assertions:
      sent_messages: [{ embed_contains: "a€…" }]

  - name: "message_pointer - A comment of exactly 1024 characters is kept whole"
    template: "../../../utility/message_pointer.gohtml"
    context:
      # 1024 characters: Discord's field-value limit, so nothing is cut
      args: ["https://discord.com/channels/111222333444555666/888888888888888888/999888777666555444", "€€"]
      messages:
        - { id: 999888777666555444, channel_id: 888888888888888888, author_id: 222333444555666777, content: "hi" }
    assertions:
      sent_messages: [{ embed_contains: "a€€\"" }]

  # "J" is stored as `db set` stores JSON: its nested dictionary and array are a plain map
  # and a plain slice (setup_db would make them an sdict and a cslice)
  - name: "db add - JSON merges into a nested dictionary made by db set"
    template: "../../../utility/db.gohtml"
    context:
      args: ["add:0", "J:Inner", "{\"b\": 2}"]
      user: { roles: [111111111] }
    setup_templates: ["templates/json_dict_setup.gohtml"]
    assertions:
      sent_messages: [{ embed_contains: "Value successfully added!" }]
      db_checks: [{ user_id: 0, key: "J", value_equals: { Inner: { a: 1, b: 2 }, arr: ["x"] } }]

  - name: "db get - A key in a nested dictionary made by db set"
    template: "../../../utility/db.gohtml"
    context:
      args: ["get:0", "J:Inner:a"]
      user: { roles: [111111111] }
    setup_templates: ["templates/json_dict_setup.gohtml"]
    assertions:
      sent_messages:
        - { embed_contains: '"description": "```\n1\n```"' }
        - { embed_contains: "Value successfully retrieved!" }

  - name: "db add - JSON array appends to an array made by db set"
    template: "../../../utility/db.gohtml"
    context:
      args: ["add:0", "J", "{\"arr\": [\"y\"]}"]
      user: { roles: [111111111] }
    setup_templates: ["templates/json_dict_setup.gohtml"]
    assertions:
      sent_messages: [{ embed_contains: "Value successfully added!" }]
      db_checks: [{ user_id: 0, key: "J", value_equals: { Inner: { a: 1 }, arr: ["x", "y"] } }]

  - name: "db get - A stored empty text is a value"
    template: "../../../utility/db.gohtml"
    context:
      args: ["get:0", "Empty"]
      user: { roles: [111111111] }
    setup_db:
      - { user_id: 0, key: "Empty", value: "" }
    assertions:
      sent_messages:
        - { embed_contains: '"description": "```\n\"\"\n```"' }
        - { embed_contains: "Value successfully retrieved!" }

  # ===== db_get_text / db_get_embed =====
  # (a numeric first argument reads that user's data; 0 is the server's)

  - name: "db_get_text - A stored false is a value"
    template: "../../../utility/db_get_text.gohtml"
    context:
      args: ["0", "Directory:Show Empty"]
    assertions:
      sent_messages: [{ content_contains: "### Directory > Show Empty\n\n```\nfalse\n```" }]

  - name: "db_get_text - A key in a nested dictionary made by db set"
    template: "../../../utility/db_get_text.gohtml"
    context:
      args: ["0", "J:Inner:a"]
    setup_templates: ["templates/json_dict_setup.gohtml"]
    assertions:
      sent_messages: [{ content_contains: "### J > Inner > a\n\n```\n1\n```" }]

  - name: "db_get_text - A key past a text value finds nothing"
    template: "../../../utility/db_get_text.gohtml"
    context:
      args: ["0", "Admin:Welcome Message:Deeper"]
    assertions:
      sent_messages: [{ content_equals: "### Admin > Welcome Message > Deeper\n\n(no result found)" }]

  - name: "db_get_text - A missing nested key keeps its title"
    template: "../../../utility/db_get_text.gohtml"
    context:
      args: ["0", "Nope:x"]
    assertions:
      sent_messages: [{ content_equals: "### Nope > x\n\n(no result found)" }]

  - name: "db_get_embed - A stored 0 is a value"
    template: "../../../utility/db_get_embed.gohtml"
    context:
      args: ["0", "Nested:n"]
    setup_db:
      - { user_id: 0, key: "Nested", value: { n: 0 } }
    assertions:
      sent_messages: [{ embed_contains: '"description": "```\n0\n```"' }]

  - name: "db_get_text - A key without a colon"
    template: "../../../utility/db_get_text.gohtml"
    context:
      args: ["0", "Admin"]
    assertions:
      sent_messages: [{ content_equals: "### Admin\n\n```\n{\n\t\"Welcome Message\": \"Welcome to the server!\"\n}\n```" }]

  - name: "db_get_text - A missing key without a colon"
    template: "../../../utility/db_get_text.gohtml"
    context:
      args: ["0", "Nope"]
    assertions:
      sent_messages: [{ content_equals: "### Nope\n\n(no result found)" }]

  - name: "db_get_text - A stored empty text is a value"
    template: "../../../utility/db_get_text.gohtml"
    context:
      args: ["0", "Empty"]
    setup_db:
      - { user_id: 0, key: "Empty", value: "" }
    assertions:
      sent_messages: [{ content_equals: "### Empty\n\n\"\"" }]

  - name: "db_get_embed - A key without a colon"
    template: "../../../utility/db_get_embed.gohtml"
    context:
      args: ["0", "Admin"]
    assertions:
      sent_messages: [{ embed_title: "Admin", embed_contains: "Welcome to the server!" }]

  - name: "db_get_embed - A key in a nested dictionary made by db set"
    template: "../../../utility/db_get_embed.gohtml"
    context:
      args: ["0", "J:Inner:a"]
    setup_templates: ["templates/json_dict_setup.gohtml"]
    assertions:
      sent_messages: [{ embed_title: "J > Inner > a", embed_contains: '"description": "```\n1\n```"' }]
