name: "define_slash (/define)"

# The slash root of define: ONE execCC to embed_exec with Respond (public). The slug logic
# is copied from retired/define.gohtml (command_tests.yaml covers the text twin's slug cases).

defaults:
  user: { id: 500000000000000001, username: "Invoker" }
  channel: { id: 123456789012345678 }
  guild:
    id: 333333333333333333
    name: "Test Server"

setup_db:
  - user_id: 0
    key: "Global"
    value: { Embed Color: 9807270 }
  - user_id: 0
    key: "Commands"
    value: { embed_exec: "1" }

command_map:
  1: "../../../commands/plumbing/embed_exec.gohtml"

tests:
  - name: "define_slash: no term links the whole glossary"
    template: "../../../commands/knowledge/define_slash.gohtml"
    context:
      interaction: { type: slash }
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: false
          embed_title: "Glossary"
          embed_contains: "https://thenighthouse.org/glossary/\""

  - name: "define_slash: an accented term folds into its slug"
    template: "../../../commands/knowledge/define_slash.gohtml"
    context:
      interaction: { type: slash, options: { term: "Ásatrú" } }
    assertions:
      interaction_responses:
        - kind: message
          ephemeral: false
          embed_title: "Glossary: Ásatrú"
          embed_contains: "https://thenighthouse.org/glossary/#asatru\""

  - name: "define_slash: a multi-word term is hyphenated, with spaces trimmed"
    template: "../../../commands/knowledge/define_slash.gohtml"
    context:
      interaction: { type: slash, options: { term: "  Right hand path " } }
    assertions:
      interaction_responses:
        - kind: message
          embed_title: "Glossary: Right hand path"
          embed_contains: "https://thenighthouse.org/glossary/#right-hand-path\""

  - name: "define_slash: a retired kb slug aliases to seven-tenets"
    template: "../../../commands/knowledge/define_slash.gohtml"
    context:
      interaction: { type: slash, options: { term: "The Seven Satanic Tenets" } }
    assertions:
      interaction_responses:
        - kind: message
          embed_title: "Glossary: The Seven Satanic Tenets"
          embed_contains: "https://thenighthouse.org/glossary/#seven-tenets\""

  # An ephemeral response is itself a sent message in the emulator, so `sent_messages: []`
  # can't pin "no extra channel message"; the snapshot lists every sent message.
  - name: "define_slash: without embed_exec in Commands is an ephemeral refusal"
    template: "../../../commands/knowledge/define_slash.gohtml"
    snapshot: true
    context:
      interaction: { type: slash, options: { term: "Ásatrú" } }
    setup_db:
      - user_id: 0
        key: "Commands"
        value: { }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "This command isn't set up on this server yet." }

  - name: "define_slash: a bare run prints the usage hint"
    template: "../../../commands/knowledge/define_slash.gohtml"
    context:
      exec_data: { probe: true }
    expected:
      output_contains: "Use /define as a slash command"

  # config_sync is an Interval command: execCC to it errors as YAGPDB's does for a stale id
  - name: "define_slash: an embed_exec id YAGPDB cannot execCC is an ephemeral refusal"
    template: "../../../commands/knowledge/define_slash.gohtml"
    context:
      interaction: { type: slash, options: { term: "Ásatrú" } }
    command_map:
      1: "../../../commands/plumbing/config_sync.gohtml"
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "This command isn't set up on this server yet." }
