name: "bump_remind (no bump recorded yet, so it reminds right away)"

defaults:
  guild:
    name: "Test Server"
    owner_id: 400000000000000001
    roles:
      - { id: 111111111111111111, name: "Staff" }
      - { id: 222222222222222222, name: "Bump" }
  channel:
    id: 123456789012345678

setup_db:
  - user_id: 0
    key: "Global"
    value: { Delete Trigger Delay: "5" }

tests:
  - name: "bump_remind: no bump role, so it pings the server owner"
    template: "../../../commands/bump/bump_remind.gohtml"
    setup_db:
      - { user_id: 0, key: "Roles", value: { Staff: "111111111111111111" } }
    assertions:
      sent_messages:
        - { content_contains: "It's time to bump **Test Server**!" }
    snapshot: true

  - name: "bump_remind: pings the bump role"
    template: "../../../commands/bump/bump_remind.gohtml"
    setup_db:
      - { user_id: 0, key: "Roles", value: { Bump: "222222222222222222" } }
    expected:
      output_contains: "<@&222222222222222222>"

  - name: "bump_check: before the cooldown, it says so and doesn't touch Last Bump"
    template: "../../../commands/bump/bump_check.gohtml"
    context:
      clock: 2026-01-01T12:00:00Z
      message_content: "👍"
    setup_db:
      - { user_id: 0, key: "Global", value: { Delete Trigger Delay: "5", Delete Response Delay: 10, Last Bump: 2026-01-01T11:00:00Z } }
    assertions:
      sent_messages:
        - { content_equals: "It is not time to bump yet!" }

  - name: "bump_check: past the cooldown, it updates Last Bump"
    template: "../../../commands/bump/bump_check.gohtml"
    context:
      clock: 2026-01-01T12:00:00Z
      message_content: "👍"
    setup_db:
      - { user_id: 0, key: "Global", value: { Delete Trigger Delay: "5", Delete Response Delay: 10, Last Bump: 2026-01-01T09:00:00Z } }
    assertions:
      sent_messages:
        - { content_equals: "`Last Bump` updated!" }

  - name: "bump_reset: clears Last Bump"
    template: "../../../commands/bump/bump_reset.gohtml"
    setup_db:
      - { user_id: 0, key: "Global", value: { Delete Trigger Delay: "5", Delete Response Delay: 10, Last Bump: 2026-01-01T09:00:00Z } }
    assertions:
      db_checks:
        - { user_id: 0, key: "Global", value_equals: { Delete Trigger Delay: "5", Delete Response Delay: 10 } }
      sent_messages:
        - { content_equals: "✅ Bump timer reset." }
