name: "Directory"
description: "staff_utility/directory: the channel list, from .Guild.Channels"

# Declared out of position order: .Guild.Channels is sorted by position, as YAGPDB's
# state tracker sorts it. The run's channel (#directory, 99) is in the Info category.
defaults:
  channel: { id: 99, name: "directory" }
  guild:
    channels:
      - { id: 20, name: "Chat", type: 4, position: 1 }
      - { id: 21, name: "general", parent_id: 20, position: 0, topic: "Talk about anything" }
      - { id: 22, name: "Lounge", type: 2, parent_id: 20, position: 0 }
      - { id: 10, name: "⋙ Info ⋘", type: 4, position: 0 }
      - { id: 12, name: "announcements", type: 5, parent_id: 10, position: 1 }
      - { id: 11, name: "rules", parent_id: 10, position: 0, topic: "Read these first" }
      - { id: 99, name: "directory", parent_id: 10, position: 2 }
      - { id: 30, name: "Staff Only", type: 4, position: 2 }
      - { id: 31, name: "staff", parent_id: 30, position: 0 }
      - { id: 40, name: "loose", position: 5 }

setup_db:
  - { user_id: 0, key: "Global", value: { Embed Color: 3447003 } }
  - { user_id: 0, key: "Directory", value: { Exclude Categories: [30] } }

tests:
  - name: "directory - lists the channels by category"
    template: "../../../staff_utility/directory.gohtml"
    snapshot: true
    assertions:
      execs: [{ line: 'Clean 100 "<@204255221017214977>"' }]
      sent_messages:
        # the uncategorized channels come first, then the categories in position order
        - { channel_id: 99, embed_title: "❓ Uncategorized ❓" }
        - { channel_id: 99, nth: 2, content_equals: "<#40>" }
        - { channel_id: 99, nth: 3, embed_title: "Info" }
        - { channel_id: 99, nth: 4, content_equals: "<#11>\nRead these first\n\n<#12>\n\n<#99>" }
        - { channel_id: 99, nth: 5, embed_title: "Chat" }
        # voice channels after the text ones
        - { channel_id: 99, nth: 6, content_equals: "<#21>\nTalk about anything\n\n<#22>" }
        - { channel_id: 99, nth: 7, embed_contains: "Back to Top](https://discord.com/channels/" }
