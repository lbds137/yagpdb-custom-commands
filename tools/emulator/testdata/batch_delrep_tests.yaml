name: "batch_delrep (bulk-purges Reputation leaderboard entries by user ID)"

defaults:
  guild:
    channels:
      - { id: 999999999, name: "yagpdb" }
  channel:
    id: 123456789012345678
  user:
    id: 500000000000000001

setup_db:
  - user_id: 0
    key: "Global"
    value: { Delete Trigger Delay: 5, Delete Response Delay: 10, Command Prefix: "-" }
  - user_id: 0
    key: "Commands"
    value: { embed_exec: "1" }
  - user_id: 0
    key: "Channels"
    value: { YAGPDB: 999999999 }

command_map:
  1: "../../../utility/embed_exec.gohtml"

tests:
  - name: "batch_delrep: IDs in the message become delrep exec calls"
    template: "../../../staff_utility/batch_delrep.gohtml"
    context:
      message_content: "-batch_delrep 100000000000000001 100000000000000002"
      exec_responses:
        'delrep "100000000000000001"': "ok"
        'delrep "100000000000000002"': "ok"
    assertions:
      execs:
        - { line: 'delrep "100000000000000001"' }
        - { line: 'delrep "100000000000000002"' }
      sent_messages:
        - { embed_title: "Batch Reputation Deletion", embed_contains: "<@100000000000000001>" }

  - name: "batch_delrep: more than 5 IDs purges only the first 5, listing the rest as not purged"
    template: "../../../staff_utility/batch_delrep.gohtml"
    context:
      message_content: "-batch_delrep 100000000000000001 100000000000000002 100000000000000003 100000000000000004 100000000000000005 100000000000000006 100000000000000007"
      exec_responses:
        'delrep "100000000000000001"': "ok"
        'delrep "100000000000000002"': "ok"
        'delrep "100000000000000003"': "ok"
        'delrep "100000000000000004"': "ok"
        'delrep "100000000000000005"': "ok"
    assertions:
      execs:
        - { line: 'delrep "100000000000000001"' }
        - { line: 'delrep "100000000000000002"' }
        - { line: 'delrep "100000000000000003"' }
        - { line: 'delrep "100000000000000004"' }
        - { line: 'delrep "100000000000000005"' }
      sent_messages:
        - embed_contains: "could not be purged due to custom command limits"
        - embed_contains: "<@100000000000000006>"
        - embed_contains: "<@100000000000000007>"

  - name: "batch_delrep: no IDs at all shows the missing-IDs error and purges nothing"
    template: "../../../staff_utility/batch_delrep.gohtml"
    context:
      message_content: "-batch_delrep"
    assertions:
      execs: []
      sent_messages:
        - { embed_title: "Missing User IDs", embed_contains: "at least one user ID" }
