name: "prompt (/prompt opens the form; the form posts it)"

# The role_ping_slash world: Mod 111111111111111111 is the Staff role, the invoker
# 500000000000000001 (staff tests give them Mod), 555555555555555555 is a non-staff
# member, Helper 222222222222222222 is the role being pinged. The clock is frozen at
# 2026-01-02T03:04:05Z, where the default -4 offset's date (2026-01-01) differs from
# UTC's (2026-01-02) — that is the point of the offset. The guild is the main server,
# so the success links are exact; channels: prompts (forum), staff-chat (text),
# a-thread (a thread the inline mode posts straight into).

defaults:
  user: { id: 500000000000000001, username: "Invoker" }
  channel: { id: 123456789012345678 }
  clock: 2026-01-02T03:04:05Z
  guild:
    id: 462036216909398026
    name: "Gay Night House"
    roles:
      - { id: 111111111111111111, name: "Mod" }
      - { id: 222222222222222222, name: "Helper" }
    channels:
      - { id: 333333333333333333, name: "prompts", type: 15 }
      - { id: 444444444444444444, name: "staff-chat" }
      - { id: 555555555555555559, name: "a-thread", type: 11 }

setup_db:
  - user_id: 0
    key: "Roles"
    value: { Staff: "111111111111111111", Helper: "222222222222222222" }

tests:
  # ---------- panel 101: the form /prompt opens ----------
  - name: "prompt: a forum channel forces thread mode, both fields, the forum ID in the custom ID"
    template: "../../../commands/general/prompt.gohtml"
    snapshot: true
    context:
      user: { roles: [111111111111111111] }
      interaction: { type: slash, options: { channel: 333333333333333333 } }
    assertions:
      interaction_responses:
        - { kind: modal, title: "New prompt", custom_id: "prompt:post:t:333333333333333333:0",
            fields: ["prompt_title", "prompt_body"] }

  - name: "prompt: no options targets this channel, inline mode, the body field alone"
    template: "../../../commands/general/prompt.gohtml"
    snapshot: true
    context:
      user: { roles: [111111111111111111] }
      interaction: { type: slash }
    assertions:
      interaction_responses:
        - { kind: modal, title: "New prompt", custom_id: "prompt:post:i:123456789012345678:0",
            fields: ["prompt_body"] }

  - name: "prompt: the thread toggle turns a text channel into thread mode"
    template: "../../../commands/general/prompt.gohtml"
    snapshot: true
    context:
      user: { roles: [111111111111111111] }
      interaction: { type: slash, options: { thread: true } }
    assertions:
      interaction_responses:
        - { kind: modal, title: "New prompt", custom_id: "prompt:post:t:123456789012345678:0",
            fields: ["prompt_title", "prompt_body"] }

  - name: "prompt: a non-staff run is refused ephemerally, no modal opens"
    template: "../../../commands/general/prompt.gohtml"
    context:
      user: { id: 555555555555555555, username: "Other" }
      interaction: { type: slash }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "⚠️ Staff only." }

  # ---------- panel 102: the form's writer ----------
  - name: "prompt_post: thread mode posts the bare body into the created thread and pings the run channel"
    template: "../../../commands/general/prompt_post.gohtml"
    snapshot: true
    context:
      user: { roles: [111111111111111111] }
      interaction:
        type: modal
        custom_id: "prompt:post:t:333333333333333333:222222222222222222"
        fields: { prompt_title: "A Cool Topic", prompt_body: "hello" }
    assertions:
      # the post is the created thread's first message, the bare body, pinging no one:
      # a bot-created thread's messages don't notify until a human has spoken in it
      # (2026-10-02 probe), so the role ping goes to the RUN channel, whose normal
      # messages always notify
      sent_messages:
        - channel_id: 1200000000000000000
          content_equals: "hello"
          pings: {}
        - channel_id: 123456789012345678
          content_contains: "🔔 New prompt for <@&222222222222222222>"
          pings: { roles: [222222222222222222] }
        - channel_id: 123456789012345678
          nth: 2
          ephemeral: true
      # the date-prefixed title and the post link, ephemerally (clock 2026-01-02T03:04Z
      # at the default -4 offset is the evening of 2026-01-01); the ack still links the
      # POST
      interaction_responses:
        - { kind: message, ephemeral: true,
            content_contains:
              "✅ Posted 2026-01-01: A Cool Topic: https://discord.com/channels/462036216909398026/1200000000000000000" }

  - name: "prompt_post: the thread toggle in a text channel creates a thread and pings the run channel"
    template: "../../../commands/general/prompt_post.gohtml"
    snapshot: true
    context:
      user: { roles: [111111111111111111] }
      interaction:
        type: modal
        custom_id: "prompt:post:t:123456789012345678:222222222222222222"
        fields: { prompt_title: "A Text Topic", prompt_body: "hello" }
    assertions:
      # not a forum: createThread (public, not attached to a message), then the bare
      # body into it — a bot-created thread's messages don't notify until a human has
      # spoken in it (2026-10-02 probe), so a mention there would be silently dead;
      # the role ping goes to the run channel instead
      sent_messages:
        - channel_id: 1200000000000000000
          content_equals: "hello"
          pings: {}
        - channel_id: 123456789012345678
          content_contains: "🔔 New prompt for <@&222222222222222222>"
          pings: { roles: [222222222222222222] }
        - channel_id: 123456789012345678
          nth: 2
          ephemeral: true
      # the ack links the MESSAGE (first send in a modal run is +1)
      interaction_responses:
        - { kind: message, ephemeral: true,
            content_contains:
              "✅ Created 2026-01-01: A Text Topic: https://discord.com/channels/462036216909398026/1200000000000000000/1100000000000000001" }

  - name: "prompt_post: inline mode sends to the target channel and links the message"
    template: "../../../commands/general/prompt_post.gohtml"
    snapshot: true
    context:
      user: { roles: [111111111111111111] }
      interaction:
        type: modal
        custom_id: "prompt:post:i:444444444444444444:222222222222222222"
        fields: { prompt_body: "standup notes" }
    assertions:
      sent_messages:
        - channel_id: 444444444444444444
          content_contains: "<@&222222222222222222> standup notes"
          pings: { roles: [222222222222222222] }
        - channel_id: 123456789012345678
          ephemeral: true
      interaction_responses:
        - { kind: message, ephemeral: true,
            content_contains:
              "✅ Sent: https://discord.com/channels/462036216909398026/444444444444444444/1100000000000000001" }

  - name: "prompt_post: with no role, a typed role mention renders but never pings; a user does"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { roles: [111111111111111111] }
      interaction:
        type: modal
        custom_id: "prompt:post:i:444444444444444444:0"
        fields: { prompt_body: "ping <@555555555555555555> not <@&111111111111111111>" }
    assertions:
      sent_messages:
        - channel_id: 444444444444444444
          content_contains: "ping <@555555555555555555> not <@&111111111111111111>"
          pings: { users: [555555555555555555] }

  - name: "prompt_post: a non-staff submission is refused ephemerally, nothing posted"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { id: 555555555555555555, username: "Other" }
      interaction:
        type: modal
        custom_id: "prompt:post:i:444444444444444444:0"
        fields: { prompt_body: "hi" }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "⚠️ Staff only." }
      sent_messages:
        - channel_id: 123456789012345678
          ephemeral: true

  - name: "prompt_post: a body over 2000 characters is refused ephemerally, nothing posted"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { roles: [111111111111111111] }
      interaction:
        type: modal
        custom_id: "prompt:post:i:444444444444444444:0"
        fields:
          prompt_body: ""
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "the limit is 2000." }
      sent_messages:
        - channel_id: 123456789012345678
          ephemeral: true

  - name: "prompt_post: an unknown thread target creates nothing; the refusal is bare"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { roles: [111111111111111111] }
      interaction:
        type: modal
        custom_id: "prompt:post:t:987654321000000000:0"
        fields: { prompt_title: "Ghost", prompt_body: "hello" }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "the post." }
      # bare: the nil return carries no error detail, and the message pins that
      sent_messages:
        - channel_id: 123456789012345678
          ephemeral: true
          content_equals: "⚠️ Couldn't create the post."

  - name: "prompt_post: inline mode posts straight into a thread target"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { roles: [111111111111111111] }
      interaction:
        type: modal
        custom_id: "prompt:post:i:555555555555555559:0"
        fields: { prompt_body: "straight into the thread" }
    assertions:
      sent_messages:
        - channel_id: 555555555555555559
          content_contains: "straight into the thread"
        - channel_id: 123456789012345678
          ephemeral: true

  - name: "prompt_post: the Global Timezone Offset drives the date prefix (0 = UTC here)"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { roles: [111111111111111111] }
      interaction:
        type: modal
        custom_id: "prompt:post:t:333333333333333333:0"
        fields: { prompt_title: "Later Topic", prompt_body: "hi" }
    setup_db:
      - user_id: 0
        key: "Global"
        value: { Timezone Offset: 0 }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true,
            content_contains:
              "✅ Posted 2026-01-02: Later Topic: https://discord.com/channels/462036216909398026/1200000000000000000" }

  - name: "prompt_post: a hand-made over-length title is refused server-side (the field caps at 88)"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { roles: [111111111111111111] }
      interaction:
        type: modal
        custom_id: "prompt:post:t:333333333333333333:0"
        fields:
          prompt_title: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          prompt_body: "hi"
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "the limit is 100." }
      sent_messages:
        - channel_id: 123456789012345678
          ephemeral: true

  - name: "prompt_post: a malformed custom ID fails soft"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { roles: [111111111111111111] }
      interaction:
        type: modal
        custom_id: "prompt:post:x:444444444444444444:0"
        fields: { prompt_body: "hi" }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "Malformed prompt form" }
      sent_messages:
        - channel_id: 123456789012345678
          ephemeral: true

  - name: "prompt_post: the role ping can push the content over the limit"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { roles: [111111111111111111] }
      interaction:
        type: modal
        custom_id: "prompt:post:i:444444444444444444:222222222222222222"
        fields:
          prompt_body: ""
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "Shorten the prompt or drop the role." }
      sent_messages:
        - channel_id: 123456789012345678
          ephemeral: true

  # Two mid-flow failure acks, with two levers. The ghost-thread trick (a channel
  # declared at the deterministic first-thread ID with bot_cannot_send) fails only the
  # in-thread prompt send — createThread checks the PARENT's id, the send checks the
  # thread's own. The run channel declared bot_cannot_send fails only the ping —
  # createForumPost checks the forum's id, so the post lands, while the ping's send
  # there refuses; the ephemeral ack is an interaction response, not a send.

  - name: "prompt_post: a run-channel ping that cannot send is acknowledged honestly (forum path)"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { roles: [111111111111111111] }
      guild:
        id: 462036216909398026
        name: "Gay Night House"
        roles:
          - { id: 111111111111111111, name: "Mod" }
          - { id: 222222222222222222, name: "Helper" }
        channels:
          - { id: 333333333333333333, name: "prompts", type: 15 }
          - { id: 123456789012345678, name: "general", bot_cannot_send: true }
      interaction:
        type: modal
        custom_id: "prompt:post:t:333333333333333333:222222222222222222"
        fields: { prompt_title: "Pinged", prompt_body: "hello" }
    assertions:
      sent_messages:
        - channel_id: 1200000000000000000
          content_equals: "hello"
          pings: {}
        - channel_id: 123456789012345678
          ephemeral: true
          content_contains: "(couldn't send the ping)"

  - name: "prompt_post: a prompt that cannot send into the new thread is acknowledged honestly"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { roles: [111111111111111111] }
      guild:
        id: 462036216909398026
        name: "Gay Night House"
        roles:
          - { id: 111111111111111111, name: "Mod" }
          - { id: 222222222222222222, name: "Helper" }
        channels:
          - { id: 123456789012345678, name: "general" }
          - { id: 1200000000000000000, name: "ghost", bot_cannot_send: true }
      interaction:
        type: modal
        custom_id: "prompt:post:t:123456789012345678:0"
        fields: { prompt_title: "Ghosty", prompt_body: "hi" }
    assertions:
      sent_messages:
        - channel_id: 123456789012345678
          ephemeral: true
          content_contains: "but the prompt couldn't be sent into it"

  # The length refusal keys on INLINE only: the thread paths send the bare body, so a
  # body whose content plus the role mention crosses 2000 is legal there (1990 + the
  # 22-character Helper mention = 2012; the old `(not $isForum)` check refused it).
  - name: "prompt_post: a body plus the role over 2000 refuses only in inline mode"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { roles: [111111111111111111] }
      interaction:
        type: modal
        custom_id: "prompt:post:t:123456789012345678:222222222222222222"
        fields: { prompt_title: "Long But Legal", prompt_body: "" }
    assertions:
      sent_messages:
        - channel_id: 1200000000000000000
          content_equals: ""
          pings: {}
        - channel_id: 123456789012345678
          content_contains: "🔔 New prompt for <@&222222222222222222>"
          pings: { roles: [222222222222222222] }
        - channel_id: 123456789012345678
          nth: 2
          ephemeral: true
      interaction_responses:
        - { kind: message, ephemeral: true,
            content_contains:
              "✅ Created 2026-01-01: Long But Legal: https://discord.com/channels/462036216909398026/1200000000000000000/1100000000000000001" }

  # ---------- the prompt is pinned where it landed ----------
  # Forum post: the starter message has the thread's own ID. Text-channel thread: the
  # prompt sent into it (the first send of the run, 1100000000000000001). Inline: the
  # message in the target channel. A refused pin (30003, the pin list is full) never
  # fails the post: pins_full names the channel (a created thread by its deterministic
  # ID), nothing is pinned, and the ack says so. A role ping's failure adds its own
  # suffix; both can apply.
  - name: "prompt_post: pin, forum post's starter message is pinned in the new thread"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { roles: [111111111111111111] }
      interaction:
        type: modal
        custom_id: "prompt:post:t:333333333333333333:0"
        fields: { prompt_title: "Pinned", prompt_body: "hello" }
    assertions:
      pins:
        - { action: pin, channel_id: 1200000000000000000, message_id: 1200000000000000000 }
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "✅ Posted 2026-01-01: Pinned: " }

  - name: "prompt_post: pin, thread-mode prompt is pinned in the created thread"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { roles: [111111111111111111] }
      interaction:
        type: modal
        custom_id: "prompt:post:t:123456789012345678:0"
        fields: { prompt_title: "Pinned", prompt_body: "hello" }
    assertions:
      pins:
        - { action: pin, channel_id: 1200000000000000000, message_id: 1100000000000000001 }

  - name: "prompt_post: pin, inline prompt is pinned in the target channel"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { roles: [111111111111111111] }
      interaction:
        type: modal
        custom_id: "prompt:post:i:444444444444444444:0"
        fields: { prompt_body: "standup notes" }
    assertions:
      pins:
        - { action: pin, channel_id: 444444444444444444, message_id: 1100000000000000001 }
      interaction_responses:
        - { kind: message, ephemeral: true,
            content_contains: "✅ Sent: https://discord.com/channels/462036216909398026/444444444444444444/1100000000000000001" }

  - name: "prompt_post: pin refused, forum post still lands and the ack says it couldn't pin"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { roles: [111111111111111111] }
      pins_full: [1200000000000000000]
      interaction:
        type: modal
        custom_id: "prompt:post:t:333333333333333333:222222222222222222"
        fields: { prompt_title: "Full", prompt_body: "hello" }
    assertions:
      pins: []
      sent_messages:
        - channel_id: 1200000000000000000
          content_equals: "hello"
        - channel_id: 123456789012345678
          content_contains: "🔔 New prompt for <@&222222222222222222>"
      interaction_responses:
        - { kind: message, ephemeral: true,
            content_contains: "(couldn't pin it: the pin list may be full, or I can't pin there)" }

  - name: "prompt_post: pin refused, created thread still holds the prompt and the ack says it couldn't pin"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { roles: [111111111111111111] }
      pins_full: [1200000000000000000]
      interaction:
        type: modal
        custom_id: "prompt:post:t:123456789012345678:0"
        fields: { prompt_title: "Full", prompt_body: "hello" }
    assertions:
      pins: []
      sent_messages:
        - channel_id: 1200000000000000000
          content_equals: "hello"
      interaction_responses:
        - { kind: message, ephemeral: true,
            content_contains: "(couldn't pin it: the pin list may be full, or I can't pin there)" }

  - name: "prompt_post: pin refused, inline prompt still sends and the ack says it couldn't pin"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { roles: [111111111111111111] }
      pins_full: [444444444444444444]
      interaction:
        type: modal
        custom_id: "prompt:post:i:444444444444444444:0"
        fields: { prompt_body: "standup notes" }
    assertions:
      pins: []
      sent_messages:
        - channel_id: 444444444444444444
          content_equals: "standup notes"
      interaction_responses:
        - { kind: message, ephemeral: true,
            content_contains: "✅ Sent: https://discord.com/channels/462036216909398026/444444444444444444/1100000000000000001 (couldn't pin it: the pin list may be full, or I can't pin there)" }

  - name: "prompt_post: pin refused and ping refused, both suffixes apply"
    template: "../../../commands/general/prompt_post.gohtml"
    context:
      user: { roles: [111111111111111111] }
      pins_full: [1200000000000000000]
      guild:
        id: 462036216909398026
        name: "Gay Night House"
        roles:
          - { id: 111111111111111111, name: "Mod" }
          - { id: 222222222222222222, name: "Helper" }
        channels:
          - { id: 333333333333333333, name: "prompts", type: 15 }
          - { id: 123456789012345678, name: "general", bot_cannot_send: true }
      interaction:
        type: modal
        custom_id: "prompt:post:t:333333333333333333:222222222222222222"
        fields: { prompt_title: "Both", prompt_body: "hello" }
    assertions:
      pins: []
      interaction_responses:
        - { kind: message, ephemeral: true,
            content_contains: "(couldn't send the ping) (couldn't pin it: the pin list may be full, or I can't pin there)" }
