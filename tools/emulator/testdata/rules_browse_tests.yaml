name: "rules browse (rule browse + rules_pager)"
description: >
  The member-facing browse view: `rule browse` (the retired text rule, kept here as a pager
  test driver; `/rule` replaced it) execCCs rules_pager for page 1 (one rule
  per page, a summary line, a jump select), and Component clicks — `rules:<page>` buttons
  and the `rules:jump` select — rebuild the page in place. rules_pager is in the Utility
  group on purpose: members click it (the panel group gates every run).

defaults:
  user:
    id: 987654321098765432
    username: "TestUser"
  channel:
    id: 123456789012345678
    name: "general"
  guild:
    id: 111222333444555666
    name: "Test Server"
    channels:
      - { id: 999999999, name: "yagpdb" }

setup_db:
  - user_id: 0
    key: "Global"
    value:
      Delete Trigger Delay: 5
      Embed Color: 3447003
      Server URL: "https://example.com"
      Guild Premium Tier: 0
      Default Avatar: "https://example.com/a.png"
  - user_id: 0
    key: "Commands"
    value: # strings, as config_sync stores them
      embed_exec: "123"
      rules_pager: "130"
  - user_id: 0
    key: "Channels"
    value:
      YAGPDB: 999999999
  - user_id: 0
    key: "Rules"
    value:
      "Rule #1": "Be respectful to all members."
      "Rule #2": "No spamming or flooding the chat."
      "Rule #3": "Keep discussions on topic."

command_map:
  123: "../../../commands/plumbing/embed_exec.gohtml"
  130: "../../../commands/rules/rules_pager.gohtml"

tests:
  # the entry path
  - name: "rule browse: opens page 1 (lowest rule) via the pager, trigger deleted"
    template: "../../../retired/rule.gohtml"
    snapshot: true
    context:
      args: ["browse"]
    assertions:
      sent_messages:
        - channel_id: 123456789012345678
          embed_title: "Rule #1"
          embed_contains: 'Be respectful to all members.'
          components_contains: '"custom_id": "templates-rules:jump:987654321098765432"'
      deletions:
        - { of: trigger, channel_id: 123456789012345678, delay: 5s }

  - name: "rule browse: rules_pager missing from Commands says so instead of execCC 0"
    template: "../../../retired/rule.gohtml"
    context:
      args: ["browse"]
    setup_db:
      - user_id: 0
        key: "Commands"
        value: { embed_exec: "123" } # no rules_pager yet (config_sync hasn't picked it up)
    assertions:
      sent_messages:
        - { channel_id: 123456789012345678, embed_title: "Rules Browse Unavailable" }

  # the number path is unchanged by the browse keyword
  - name: "rule 2 still views rule 2 through embed_exec"
    template: "../../../retired/rule.gohtml"
    context:
      args: ["2"]
    assertions:
      sent_messages:
        - { channel_id: 123456789012345678, embed_title: "Rule #2" }
      deletions:
        - { of: trigger, channel_id: 123456789012345678, delay: 5s }

  - name: "rule: a non-number still fails with the old usage text (the second parse)"
    template: "../../../retired/rule.gohtml"
    context:
      args: ["abc"]
    expected:
      error_contains: "Please enter a valid rule number (1-3)."

  - name: "rule: no argument fails with the old usage text"
    template: "../../../retired/rule.gohtml"
    expected:
      error_contains: "Please enter a valid rule number (1-3)."

  # the pager, clicked directly. The clicked message is the bot's earlier page (a real
  # click carries the page state in the button's custom ID, not in the message)
  - name: "rules_pager: next button shows rule 2, prev re-enabled"
    template: "../../../commands/rules/rules_pager.gohtml"
    context:
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      interaction: { type: component, custom_id: "rules:2", message_id: 7 }
    expected:
      output_equals: ""
    assertions:
      sent_messages: []
      interaction_responses:
        - kind: update
          embed_contains: 'No spamming or flooding the chat.'
          components_contains: "\"disabled\": false,\n      \"emoji\": {\n        \"name\": \"◀\"\n      },\n      \"custom_id\": \"templates-rules:1:987654321098765432\""
      edited_messages:
        - { channel_id: 123456789012345678, embed_title: "Rule #2" }

  - name: "rules_pager: an animated (a_) guild icon is a gif in the author"
    template: "../../../commands/rules/rules_pager.gohtml"
    context:
      guild: { icon: "a_abc123" }
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      interaction: { type: component, custom_id: "rules:2", message_id: 7 }
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - { kind: update, embed_contains: "https://cdn.discordapp.com/icons/111222333444555666/a_abc123.gif" }

  - name: "rules_pager: a plain guild icon stays a png even with Guild Premium Tier 1"
    template: "../../../commands/rules/rules_pager.gohtml"
    setup_db:
      - user_id: 0
        key: "Global"
        value:
          Delete Trigger Delay: 5
          Embed Color: 3447003
          Server URL: "https://example.com"
          Guild Premium Tier: 1
          Default Avatar: "https://example.com/a.png"
    context:
      guild: { icon: "abc123" }
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      interaction: { type: component, custom_id: "rules:2", message_id: 7 }
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - { kind: update, embed_contains: "https://cdn.discordapp.com/icons/111222333444555666/abc123.png" }

  - name: "rules_pager: last page disables next; an out-of-range click clamps to it"
    template: "../../../commands/rules/rules_pager.gohtml"
    context:
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      interaction: { type: component, custom_id: "rules:99", message_id: 7 }
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: update
          embed_contains: 'Keep discussions on topic.'
          components_contains: "\"disabled\": true,\n      \"emoji\": {\n        \"name\": \"▶\"\n      },\n      \"custom_id\": \"templates-rules:4:987654321098765432\""

  - name: "rules_pager: the jump select opens the chosen rule and marks its option default"
    template: "../../../commands/rules/rules_pager.gohtml"
    context:
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      interaction: { type: component, custom_id: "rules:jump", message_id: 7, component: string_menu, values: ["3"] }
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: update
          embed_contains: 'Keep discussions on topic.'
          components_contains: '"default": true'

  # gaps and degenerate dicts
  - name: "rules_pager: a deleted middle rule leaves a 2-page book (browse opens the lowest)"
    # snapshot pins the select offering exactly Rule #1 and Rule #3 (no gap phantom)
    template: "../../../retired/rule.gohtml"
    snapshot: true
    context:
      args: ["browse"]
    setup_db:
      - user_id: 0
        key: "Rules"
        value: # Rule #2 removed
          "Rule #1": "Be respectful to all members."
          "Rule #3": "Keep discussions on topic."
    assertions:
      sent_messages:
        - channel_id: 123456789012345678
          embed_title: "Rule #1"
          embed_contains: "Be respectful to all members."

  - name: "rules_pager: a jump past a gap lands on the next existing rule"
    template: "../../../commands/rules/rules_pager.gohtml"
    context:
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      interaction: { type: component, custom_id: "rules:jump", message_id: 7, component: string_menu, values: ["2"] }
    setup_db:
      - user_id: 0
        key: "Rules"
        value: # Rule #2 removed; jumping to 2 lands on 3
          "Rule #1": "Be respectful to all members."
          "Rule #3": "Keep discussions on topic."
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: update
          embed_contains: 'Keep discussions on topic.'

  - name: "rules_pager: no rules at all is one informational page with only a dismiss button"
    # snapshot pins the near-component-less message: embed + the dismiss row, no select/pager
    template: "../../../retired/rule.gohtml"
    snapshot: true
    context:
      args: ["browse"]
    setup_db:
      - user_id: 0
        key: "Rules"
        value:
          "Some Other Key": "not a rule"
    assertions:
      sent_messages:
        - { channel_id: 123456789012345678, embed_title: "Rules", embed_contains: "No rules are configured yet." }

  # the dismiss button
  - name: "rules_pager: the opener's dismiss click deletes the browser and confirms ephemerally"
    template: "../../../commands/rules/rules_pager.gohtml"
    snapshot: true
    context:
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      # the clicker is the opener (defaults.user.id rides in the custom ID)
      interaction: { type: component, custom_id: "rules:close:987654321098765432", message_id: 7 }
    expected:
      output_equals: ""
    assertions:
      deletions:
        - { of: message, channel_id: 123456789012345678, message_id: 7, delay: 0s }
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "Rule browser dismissed." }

  - name: "rules_pager: someone else's dismiss click is refused ephemerally, nothing deleted"
    template: "../../../commands/rules/rules_pager.gohtml"
    context:
      user: { id: 111222333444555001 }
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      interaction: { type: component, custom_id: "rules:close:987654321098765432", message_id: 7 }
    expected:
      output_equals: ""
    assertions:
      deletions: []
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "Only the person who opened this browser can dismiss it." }

  - name: "rules_pager: a rule over the description cap is cut with an ellipsis (one rule: title Rules)"
    template: "../../../commands/rules/rules_pager.gohtml"
    context:
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      interaction: { type: component, custom_id: "rules:1", message_id: 7 }
    setup_db:
      - user_id: 0
        key: "Rules"
        value:
          "Rule #1": ""
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: update
          embed_title: "Rules"
          embed_contains: "xx…"

  - name: "rules_pager: the description cut is by code point, not bytes (a multibyte char is never torn)"
    # db_tests.yaml "A long value is cut between characters" is the pattern: a byte-based
    # cut would tear the first \xe2\x82\xac and the description would not end in whole
    # characters before the ellipsis
    template: "../../../commands/rules/rules_pager.gohtml"
    context:
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      interaction: { type: component, custom_id: "rules:1", message_id: 7 }
    setup_db:
      - user_id: 0
        key: "Rules"
        value:
          "Rule #1": "€€€€€xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: update
          embed_title: "Rules"
          embed_contains: '€€…'

  # one stored huge number must not break the rulebook (no `seq` over 1..max: it errors
  # past 10,000 elements)
  - name: "rules_pager: a stray huge Rule #1000000 does not break the browser (page 1 opens)"
    template: "../../../retired/rule.gohtml"
    context:
      args: ["browse"]
    setup_db:
      - user_id: 0
        key: "Rules"
        value: { "Rule #1": "a", "Rule #1000000": "typo" }
    assertions:
      sent_messages:
        - { channel_id: 123456789012345678, embed_title: "Rule #1", embed_contains: "a" }

  - name: "rules_pager: with a stray Rule #1000000, page 2 shows it"
    template: "../../../commands/rules/rules_pager.gohtml"
    context:
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      interaction: { type: component, custom_id: "rules:2:987654321098765432", message_id: 7 }
    setup_db:
      - user_id: 0
        key: "Rules"
        value: { "Rule #1": "a", "Rule #1000000": "typo" }
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: update
          embed_title: "Rule #1000000"
          embed_contains: "typo"

  - name: "rules: with a stray Rule #1000000 the no-argument listing prints both rules"
    template: "../../../commands/rules/rules.gohtml"
    context:
      args: []
    setup_db:
      - user_id: 0
        key: "Rules"
        value: { "Rule #1": "a", "Rule #1000000": "typo" }
    assertions:
      sent_messages:
        - { embed_title: "Rule #1" }
        - { embed_title: "Rule #1000000" }

  # the snapshot pins Rule #1000000's absence (embed matchers match ANY embed, so
  # sent_messages alone can't assert it is missing)
  - name: "rules: with a stray Rule #1000000, `rules 1 5` prints only rule 1"
    template: "../../../commands/rules/rules.gohtml"
    snapshot: true
    context:
      args: ["1", "5"]
    setup_db:
      - user_id: 0
        key: "Rules"
        value: { "Rule #1": "a", "Rule #1000000": "typo" }
    assertions:
      sent_messages:
        - { embed_title: "Rule #1" }

  # a stored "Rule #0" is not a rule: both readers start at 1, as the old seq scan did
  - name: "rules_pager: a stored Rule #0 is skipped, page 1 is Rule #1"
    template: "../../../commands/rules/rules_pager.gohtml"
    context:
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      interaction: { type: component, custom_id: "rules:1:987654321098765432", message_id: 7 }
    setup_db:
      - user_id: 0
        key: "Rules"
        value: { "Rule #0": "zero", "Rule #1": "a", "Rule #2": "b" }
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: update
          embed_title: "Rule #1"
          components_contains: "Page 1/2"

  - name: "rules: a stored Rule #0 is not listed"
    template: "../../../commands/rules/rules.gohtml"
    snapshot: true
    context:
      args: []
    setup_db:
      - user_id: 0
        key: "Rules"
        value: { "Rule #0": "zero", "Rule #1": "a" }
    assertions:
      sent_messages:
        - { embed_title: "Rule #1" }

  # Dismiss stays the opener's however many members page the browser
  - name: "rules_pager: another member paging keeps the opener's Dismiss and paging ids"
    template: "../../../commands/rules/rules_pager.gohtml"
    context:
      user: { id: 111222333444555001 }
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      interaction: { type: component, custom_id: "rules:2:987654321098765432", message_id: 7 }
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: update
          embed_contains: 'No spamming or flooding the chat.'
          components_contains: '"custom_id": "templates-rules:close:987654321098765432"'

  - name: "rules_pager: another member paging keeps the opener in the next button id"
    template: "../../../commands/rules/rules_pager.gohtml"
    context:
      user: { id: 111222333444555001 }
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      interaction: { type: component, custom_id: "rules:2:987654321098765432", message_id: 7 }
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: update
          components_contains: '"custom_id": "templates-rules:3:987654321098765432"'

  - name: "rules_pager: another member paging keeps the opener in the jump select id"
    template: "../../../commands/rules/rules_pager.gohtml"
    context:
      user: { id: 111222333444555001 }
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      interaction: { type: component, custom_id: "rules:2:987654321098765432", message_id: 7 }
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: update
          components_contains: '"custom_id": "templates-rules:jump:987654321098765432"'

  - name: "rules_pager: the jump select keeps the opener too"
    template: "../../../commands/rules/rules_pager.gohtml"
    context:
      user: { id: 111222333444555001 }
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      interaction: { type: component, custom_id: "rules:jump:987654321098765432", message_id: 7, component: string_menu, values: ["3"] }
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: update
          embed_contains: 'Keep discussions on topic.'
          components_contains: '"custom_id": "templates-rules:close:987654321098765432"'

  - name: "rules_pager: after B paged A's browser, B's Dismiss is refused (the id names A)"
    template: "../../../commands/rules/rules_pager.gohtml"
    context:
      user: { id: 111222333444555001 }
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      interaction: { type: component, custom_id: "rules:close:987654321098765432", message_id: 7 }
    expected:
      output_equals: ""
    assertions:
      deletions: []
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "Only the person who opened this browser can dismiss it." }

  # messages already in production carry the old ids (no opener): the clicker is the
  # opener, as before
  - name: "rules_pager: a legacy rules:2 id still pages, Dismiss falls back to the clicker"
    template: "../../../commands/rules/rules_pager.gohtml"
    context:
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      interaction: { type: component, custom_id: "rules:2", message_id: 7 }
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: update
          embed_contains: 'No spamming or flooding the chat.'
          components_contains: '"custom_id": "templates-rules:close:987654321098765432"'

  - name: "rules_pager: a legacy rules:jump id still jumps, Dismiss falls back to the clicker"
    template: "../../../commands/rules/rules_pager.gohtml"
    context:
      messages: [{ id: 7, channel_id: 123456789012345678, author_id: 1234567890, embeds: [{ title: "Rules" }] }]
      interaction: { type: component, custom_id: "rules:jump", message_id: 7, component: string_menu, values: ["3"] }
    expected:
      output_equals: ""
    assertions:
      interaction_responses:
        - kind: update
          embed_contains: 'Keep discussions on topic.'
          components_contains: '"custom_id": "templates-rules:close:987654321098765432"'
