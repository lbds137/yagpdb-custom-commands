name: "role_ping_slash (/role_ping pings any role, staff only)"

# The slash version of role_ping: Discord's role picker instead of the Roles
# dictionary's names. Mod 111111111111111111 is the Staff role; the invoker is
# 500000000000000001 (staff tests give them Mod), 555555555555555555 is another
# non-staff member. Helper 222222222222222222 is the role being pinged.

defaults:
  user: { id: 500000000000000001, username: "Invoker" }
  channel: { id: 123456789012345678 }
  guild:
    roles:
      - { id: 111111111111111111, name: "Mod" }
      - { id: 222222222222222222, name: "Helper" }

setup_db:
  - user_id: 0
    key: "Roles"
    value: { Staff: "111111111111111111", Helper: "222222222222222222" }

tests:
  - name: "role_ping_slash: staff with a message answer publicly, message then mention, the role allowlisted"
    template: "../../../commands/members/role_ping_slash.gohtml"
    context:
      user: { id: 500000000000000001, roles: [111111111111111111] }
      interaction: { type: slash, options: { role: 222222222222222222, message: "standup in 5" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: false, content_contains: "standup in 5\n<@&222222222222222222>" }
      # the mention text alone proves nothing — pin that the role is actually
      # allowlisted on the response (notify), not just rendered
      response_pings: { roles: [222222222222222222] }

  - name: "role_ping_slash: staff without a message answer with the mention alone, still pinging"
    template: "../../../commands/members/role_ping_slash.gohtml"
    context:
      user: { id: 500000000000000001, roles: [111111111111111111] }
      interaction: { type: slash, options: { role: 222222222222222222 } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: false, content_contains: "<@&222222222222222222>" }
      response_pings: { roles: [222222222222222222] }

  - name: "role_ping_slash: a non-staff run is refused ephemerally, pinging no one"
    template: "../../../commands/members/role_ping_slash.gohtml"
    context:
      user: { id: 555555555555555555, username: "Other" }
      interaction: { type: slash, options: { role: 222222222222222222, message: "hi" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "⚠️ Staff only." }
      response_pings: {}

  # A Slash Command trigger takes an interaction, so the bare run rides the execCC
  # path (no trigger check there) — the smoke's plain-message run, which lands here
  - name: "role_ping_slash: a bare run prints the usage hint"
    template: "../../../commands/members/role_ping_slash.gohtml"
    context:
      exec_data: { probe: true }
    expected:
      output_contains: "Use /role_ping as a slash command"

  # the clamp: Discord caps content at 2000 characters; a 1990-char message plus the
  # mention would be 2013, so the message is cut to 1976 and an ellipsis appended
  - name: "role_ping_slash: a message that would overflow is clamped to 2000 characters"
    template: "../../../commands/members/role_ping_slash.gohtml"
    context:
      user: { id: 500000000000000001, roles: [111111111111111111] }
      interaction: { type: slash, options: { role: 222222222222222222, message: "" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: false, content_contains: "…\n<@&222222222222222222>" }
      response_pings: { roles: [222222222222222222] }
