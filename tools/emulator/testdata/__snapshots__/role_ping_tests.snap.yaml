'role_ping: with no usable Roles entries the bare run posts an error embed, no select':
    output: ""
    messages:
        - channel_id: 123456789012345678
          embeds:
            - |-
              {
                "author": {
                  "name": "Test Server"
                },
                "description": "⚠️ The Roles dictionary has no entries to ping!",
                "image": {},
                "thumbnail": {},
                "title": "No Pingable Roles"
              }
    deletions:
        - message 1100000000000000001 in channel 123456789012345678 after 10s
        - trigger 234567890 in channel 123456789012345678 after 5s
    db:
        - user_id: 0
          key: Channels
          value: '{"YAGPDB":999999999}'
        - user_id: 0
          key: Commands
          value: '{"embed_exec":"1"}'
        - user_id: 0
          key: Global
          value: '{"Command Prefix":"-","Delete Response Delay":10,"Delete Trigger Delay":5}'
        - user_id: 0
          key: Roles
          value: '{"Staff":""}'
