'avatar_viewer: a mod log entry gives the moderated user''s avatar':
    output: ""
    messages:
        - channel_id: 123456789012345678
          embed: "{\n  \"fields\": [\n    {\n      \"name\": \"ID\",\n      \"value\": \"666666666666666666\"\n    },\n    {\n      \"name\": \"Timestamp\",\n      \"value\": \"2020-01-14 15:35:19.401 +0000 UTC\"\n    },\n    {\n      \"name\": \"Name\",\n      \"value\": \"bad_user\"\n    },\n    {\n      \"name\": \"Original Message\",\n      \"value\": \"\U0001F517 [Click or tap here to view the message.](https://discord.com/channels/111222333444555666/900000000000000002/700000000000000002)\"\n    }\n  ],\n  \"image\": {\n    \"url\": \"https://cdn.discordapp.com/avatars/666666666666666666/def.png?size=1024\"\n  },\n  \"title\": \"Avatar Viewer\"\n}"
    deletions:
        - trigger 234567890 in channel 123456789012345678 after 5s
    db:
        - user_id: 0
          key: Channels
          value: '{"YAGPDB":900000000000000001}'
        - user_id: 0
          key: Commands
          value: '{"embed_exec":"1"}'
        - user_id: 0
          key: Global
          value: '{"Default Avatar":"https://example.com/default.png","Delete Trigger Delay":5}'
