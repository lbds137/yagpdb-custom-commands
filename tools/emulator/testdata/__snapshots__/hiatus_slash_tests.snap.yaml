'hiatus_slash: holding none of the staff roles is an ephemeral refusal':
    output: ⚠️ You don't hold any of the staff roles! (If you're already on hiatus, /unhiatus restores them.)
    messages:
        - channel_id: 123456789012345678
          content: ⚠️ You don't hold any of the staff roles! (If you're already on hiatus, /unhiatus restores them.)
          ephemeral: true
    interaction_responses:
        - kind: deferred_edit
          ephemeral: true
          message_id: 1100000000000000001
          content: ⚠️ You don't hold any of the staff roles! (If you're already on hiatus, /unhiatus restores them.)
    db:
        - user_id: 0
          key: Channels
          value: '{"Mod Log":888888888,"YAGPDB":999999999}'
        - user_id: 0
          key: Commands
          value: '{"embed_exec":"123"}'
        - user_id: 0
          key: Global
          value: '{"Default Avatar":"https://example.com/a.png"}'
        - user_id: 0
          key: Staff
          value: '{"Roles":[111111111,222222222]}'
