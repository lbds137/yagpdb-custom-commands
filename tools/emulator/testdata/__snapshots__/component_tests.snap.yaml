'Pager click: updateMessage edits the message in place (update response)':
    output: ""
    edits:
        - channel_id: 123456789012345678
          embeds:
            - |-
              {
                "description": "Page 2 of 3 (stale)",
                "title": "Channels"
              }
          components:
            - |-
              {
                "components": [
                  {
                    "label": "Prev",
                    "style": 2,
                    "disabled": false,
                    "custom_id": "templates-pg:stale:1",
                    "type": 2
                  },
                  {
                    "label": "Next",
                    "style": 1,
                    "disabled": false,
                    "custom_id": "templates-pg:stale:3",
                    "type": 2
                  }
                ],
                "type": 1
              }
    interaction_responses:
        - kind: update
          message_id: 7
          embeds:
            - |-
              {
                "description": "Page 2 of 3 (stale)",
                "title": "Channels"
              }
          components:
            - |-
              {
                "components": [
                  {
                    "label": "Prev",
                    "style": 2,
                    "disabled": false,
                    "custom_id": "templates-pg:stale:1",
                    "type": 2
                  },
                  {
                    "label": "Next",
                    "style": 1,
                    "disabled": false,
                    "custom_id": "templates-pg:stale:3",
                    "type": 2
                  }
                ],
                "type": 1
              }
Printed output with ephemeralResponse becomes an ephemeral reply (message response):
    output: 'Only you see this, TestUser: info:stale (button)'
    messages:
        - channel_id: 123456789012345678
          content: 'Only you see this, TestUser: info:stale (button)'
          ephemeral: true
    interaction_responses:
        - kind: message
          ephemeral: true
          message_id: 1100000000000000001
          content: 'Only you see this, TestUser: info:stale (button)'
