'rule browse: opens page 1 (lowest rule) via the pager, trigger deleted':
    output: ""
    messages:
        - channel_id: 123456789012345678
          embeds:
            - |-
              {
                "author": {
                  "icon_url": "https://example.com/a.png",
                  "name": "Test Server",
                  "url": "https://example.com"
                },
                "color": 3447003,
                "description": "Be respectful to all members.",
                "image": {},
                "thumbnail": {},
                "title": "Rule #1"
              }
          components:
            - |-
              {
                "components": [
                  {
                    "custom_id": "templates-rules:jump",
                    "placeholder": "Jump to rule",
                    "options": [
                      {
                        "label": "Rule #1",
                        "value": "1",
                        "description": "",
                        "default": true
                      },
                      {
                        "label": "Rule #2",
                        "value": "2",
                        "description": "",
                        "default": false
                      },
                      {
                        "label": "Rule #3",
                        "value": "3",
                        "description": "",
                        "default": false
                      }
                    ],
                    "disabled": false,
                    "required": false,
                    "type": 3
                  }
                ],
                "type": 1
              }
            - "{\n  \"components\": [\n    {\n      \"label\": \"\",\n      \"style\": 2,\n      \"disabled\": true,\n      \"emoji\": {\n        \"name\": \"◀\"\n      },\n      \"custom_id\": \"templates-rules:0\",\n      \"type\": 2\n    },\n    {\n      \"label\": \"Page 1/3\",\n      \"style\": 2,\n      \"disabled\": true,\n      \"custom_id\": \"templates-rules:noop\",\n      \"type\": 2\n    },\n    {\n      \"label\": \"\",\n      \"style\": 2,\n      \"disabled\": false,\n      \"emoji\": {\n        \"name\": \"▶\"\n      },\n      \"custom_id\": \"templates-rules:2\",\n      \"type\": 2\n    },\n    {\n      \"label\": \"\",\n      \"style\": 4,\n      \"disabled\": false,\n      \"emoji\": {\n        \"name\": \"\U0001F5D1\"\n      },\n      \"custom_id\": \"templates-rules:close:987654321098765432\",\n      \"type\": 2\n    }\n  ],\n  \"type\": 1\n}"
    deletions:
        - trigger 234567890 in channel 123456789012345678 after 5s
    db:
        - user_id: 0
          key: Channels
          value: '{"YAGPDB":999999999}'
        - user_id: 0
          key: Commands
          value: '{"embed_exec":"123","rules_pager":"130"}'
        - user_id: 0
          key: Global
          value: '{"Default Avatar":"https://example.com/a.png","Delete Trigger Delay":5,"Embed Color":3447003,"Guild Premium Tier":0,"Server URL":"https://example.com"}'
        - user_id: 0
          key: Rules
          value: '{"Rule #1":"Be respectful to all members.","Rule #2":"No spamming or flooding the chat.","Rule #3":"Keep discussions on topic."}'
