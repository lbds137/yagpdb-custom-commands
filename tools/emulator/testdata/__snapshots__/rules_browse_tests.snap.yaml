'rule browse: opens page 1 (lowest rule) via the pager, trigger deleted':
    output: ""
    messages:
        - channel_id: 123456789012345678
          embeds:
            - |-
              {
                "author": {
                  "icon_url": "https://example.com/a.png",
                  "name": "Test Server",
                  "url": "https://example.com"
                },
                "color": 3447003,
                "description": "Be respectful to all members.",
                "image": {},
                "thumbnail": {},
                "title": "Rule #1"
              }
          components:
            - |-
              {
                "components": [
                  {
                    "custom_id": "templates-rules:jump",
                    "placeholder": "Jump to rule",
                    "options": [
                      {
                        "label": "Rule #1",
                        "value": "1",
                        "description": "",
                        "default": true
                      },
                      {
                        "label": "Rule #2",
                        "value": "2",
                        "description": "",
                        "default": false
                      },
                      {
                        "label": "Rule #3",
                        "value": "3",
                        "description": "",
                        "default": false
                      }
                    ],
                    "disabled": false,
                    "required": false,
                    "type": 3
                  }
                ],
                "type": 1
              }
            - |-
              {
                "components": [
                  {
                    "label": "",
                    "style": 2,
                    "disabled": true,
                    "emoji": {
                      "name": "◀"
                    },
                    "custom_id": "templates-rules:0",
                    "type": 2
                  },
                  {
                    "label": "Page 1/3",
                    "style": 2,
                    "disabled": true,
                    "custom_id": "templates-rules:noop",
                    "type": 2
                  },
                  {
                    "label": "",
                    "style": 2,
                    "disabled": false,
                    "emoji": {
                      "name": "▶"
                    },
                    "custom_id": "templates-rules:2",
                    "type": 2
                  }
                ],
                "type": 1
              }
    deletions:
        - trigger 234567890 in channel 123456789012345678 after 5s
    db:
        - user_id: 0
          key: Channels
          value: '{"YAGPDB":999999999}'
        - user_id: 0
          key: Commands
          value: '{"embed_exec":"123","rules_pager":"130"}'
        - user_id: 0
          key: Global
          value: '{"Default Avatar":"https://example.com/a.png","Delete Trigger Delay":5,"Embed Color":3447003,"Guild Premium Tier":0,"Server URL":"https://example.com"}'
        - user_id: 0
          key: Rules
          value: '{"Rule #1":"Be respectful to all members.","Rule #2":"No spamming or flooding the chat.","Rule #3":"Keep discussions on topic."}'
