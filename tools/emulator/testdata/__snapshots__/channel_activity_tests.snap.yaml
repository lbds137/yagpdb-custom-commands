'channel_activity: 200-entry cap hit -> note appears, Never seen shows ? and is disabled, no third call':
    output: ""
    messages:
        - channel_id: 99
          embeds:
            - |-
              {
                "color": 3447003,
                "description": "200+ channels: 0 active · 0 quiet · 200 stale · ? never seen\nActive: a message in the last 7 days · Quiet: 7-29 days · Stale: 30+ days · Never seen: none recorded\n\n**Stale**, oldest first — page 1 of 14\n_Only the oldest 200 tracked channels were checked; untracked channels can't be listed._\n<#600000001> — <t:2001:R>\n<#600000002> — <t:2002:R>\n<#600000003> — <t:2003:R>\n<#600000004> — <t:2004:R>\n<#600000005> — <t:2005:R>\n<#600000006> — <t:2006:R>\n<#600000007> — <t:2007:R>\n<#600000008> — <t:2008:R>\n<#600000009> — <t:2009:R>\n<#600000010> — <t:2010:R>\n<#600000011> — <t:2011:R>\n<#600000012> — <t:2012:R>\n<#600000013> — <t:2013:R>\n<#600000014> — <t:2014:R>\n<#600000015> — <t:2015:R>",
                "title": "Channel activity"
              }
          components:
            - |-
              {
                "components": [
                  {
                    "label": "Active (0)",
                    "style": 2,
                    "disabled": false,
                    "custom_id": "templates-ca:active:1:b",
                    "type": 2
                  },
                  {
                    "label": "Quiet (0)",
                    "style": 2,
                    "disabled": false,
                    "custom_id": "templates-ca:quiet:1:b",
