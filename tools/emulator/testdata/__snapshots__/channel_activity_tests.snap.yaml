                "type": 1
              }
            - |-
              {
                "components": [
                  {
                    "label": "",
                    "style": 2,
                    "disabled": true,
                    "emoji": {
                      "name": "◀"
                    },
                    "custom_id": "templates-ca:stale:0",
                    "type": 2
