'bump_remind: no bump role, so it pings the server owner':
    output: ""
    messages:
        - channel_id: 123456789012345678
          content: "It's time to bump **Test Server**! \nTo bump the server, use the `/bump` command in this channel. \n**Then, __send a message__ with a :thumbsup: to confirm the bump.**"
        - channel_id: 123456789012345678
          content: <@400000000000000001>
    db:
        - user_id: 0
          key: Global
          value: '{"Delete Trigger Delay":"5"}'
        - user_id: 0
          key: Roles
          value: '{"Staff":"111111111111111111"}'
