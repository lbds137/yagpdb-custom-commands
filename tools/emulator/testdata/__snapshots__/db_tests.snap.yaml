    messages:
        - channel_id: 123456789012345678
          embeds:
            - |-
              {
                "author": {
                  "name": "Test Server"
                },
                "description": "```\n{\n\t\"Delete Trigger Delay\": 5\n}\n```",
                "fields": [
                  {
                    "inline": true,
                    "name": "User ID",
                    "value": "```\n0```"
                  },
                  {
                    "inline": true,
                    "name": "Key",
                    "value": "```\nGlobal```"
                  },
                  {
                    "name": "Result",
                    "value": "```\n✅ Value successfully retrieved!```"
                  }
                ],
                "image": {},
                "thumbnail": {},
                "title": "Database Operation: `get`"
              }
    deletions:
        - trigger 234567890 in channel 123456789012345678 after 5s
    db:
        - user_id: 0
          key: Channels
          value: '{"YAGPDB":999999999}'
        - user_id: 0
          key: Commands
          value: '{"db":"456","embed_exec":"123"}'
        - user_id: 0
          key: Global
          value: '{"Delete Trigger Delay":5}'
        - user_id: 0
          key: Roles
          value: '{"Staff":888888888}'
