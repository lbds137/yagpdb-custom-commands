name: "channel_link (regex trigger on a channel mention)"
description: "Someone in #general (123456789012345678) mentions #introduction (900000000000000002)."

defaults:
  user:
    id: 987654321098765432
    username: "Linker"
  channel:
    id: 123456789012345678
    name: "general"
  guild:
    channels:
      - { id: 900000000000000001, name: "yagpdb" }
      - { id: 900000000000000002, name: "introduction" }
    id: 111222333444555666
    name: "Test Server"
    roles:
      - { id: 111111111111111111, name: "Staff" }

setup_db:
  - user_id: 0
    key: "Global"
    value: { Embed Color: 5793266, Delete Trigger Delay: 5, Default Avatar: "https://example.com/a.png" }
  - user_id: 0
    key: "Commands"
    value: { embed_exec: "1" } # a string, as config_sync stores it
  - user_id: 0
    key: "Roles"
    value: { Staff: 111111111111111111 }
  - user_id: 0
    key: "Channels"
    value: { YAGPDB: 900000000000000001 }

tests:
  - name: "channel_link: links both channels by editing its placeholders"
    template: "../../../commands/channels/channel_link.gohtml"
    strict: true
    context:
      message_content: "<#900000000000000002>"
    assertions:
      sent_messages:
        - { channel_id: 900000000000000002, content_equals: "Loading..." }
        - { channel_id: 123456789012345678, content_equals: "Loading..." }
      edited_messages:
        - { channel_id: 900000000000000002, embed_contains: "A server member has linked from **#general** to here." }
        - { channel_id: 123456789012345678, embed_contains: "A server member has linked to" }

  - name: "channel_link: a staff member moves the conversation"
    template: "../../../commands/channels/channel_link.gohtml"
    strict: true
    context:
      message_content: "<#900000000000000002>"
      user: { roles: [111111111111111111] }
    assertions:
      edited_messages:
        - { channel_id: 900000000000000002, embed_contains: "A staff member has moved a conversation from **#general**" }
        - { channel_id: 123456789012345678, embed_contains: "A staff member has moved this conversation" }

  - name: "channel_link: the target channel refuses the message, so it says so instead of aborting"
    template: "../../../commands/channels/channel_link.gohtml"
    strict: true
    command_map: { 1: "../../../commands/plumbing/embed_exec.gohtml" }
    context:
      message_content: "<#900000000000000002>"
      guild:
        channels:
          - { id: 900000000000000001, name: "yagpdb" }
          - { id: 900000000000000002, name: "introduction", bot_cannot_send: true }
    assertions:
      sent_messages:
        - { channel_id: 123456789012345678, has_embed: true, embed_contains: "couldn't post in <#900000000000000002>" }

  # Mentioning the CURRENT channel (or one that doesn't exist) fails the "and $thereChannel
  # $selfLinkCheck" gate, so channel_link falls into the else branch and shows this
  # channel's own "Channel Details" (ID, Type, Topic) instead of linking anywhere
  - name: "channel_link: mentioning the current channel shows its own Channel Details"
    template: "../../../commands/channels/channel_link.gohtml"
    strict: true
    command_map: { 1: "../../../commands/plumbing/embed_exec.gohtml" }
    context:
      message_content: "<#123456789012345678>" # the trigger's own channel
    assertions:
      sent_messages:
        - channel_id: 123456789012345678
          embed_title: "Channel Details"
          embed_contains: '"name": "ID"'
        - channel_id: 123456789012345678
          embed_contains: '"value": "123456789012345678"'
        - channel_id: 123456789012345678
          embed_contains: '"value": "Normal"'

  # A channel mention for an ID that doesn't exist in the guild never resolves a target
  # either, so it shows the same "Channel Details" about the CURRENT channel; here it's
  # NSFW and has a topic, so both show up in the fields
  - name: "channel_link: mentioning a channel that doesn't exist also shows the current channel's Channel Details"
    template: "../../../commands/channels/channel_link.gohtml"
    strict: true
    command_map: { 1: "../../../commands/plumbing/embed_exec.gohtml" }
    context:
      message_content: "<#900000000000099999>" # not in guild.channels
      guild:
        channels:
          - { id: 900000000000000001, name: "yagpdb" }
          - { id: 123456789012345678, name: "general", nsfw: true, topic: "General chat" }
    assertions:
      sent_messages:
        - channel_id: 123456789012345678
          embed_title: "Channel Details"
          embed_contains: '"value": "NSFW"'
        - channel_id: 123456789012345678
          embed_contains: '"name": "Topic"'
        - channel_id: 123456789012345678
          embed_contains: '"value": "General chat"'
