name: "Long user strings can't break /db or /edit responses"

# A user-supplied key, category or value that lands in an embed or a message unbounded
# makes Discord refuse the response, so the user sees "The application did not respond".
# Every case is strict: the emulator then returns Discord's limit error from the send
# (content 2000, embed title 256, field value 1024, whole embed 6000). The long strings
# are seeded by shell (K1100 is 1100 'k's, SK its stored title-cased form "K" + 1099
# 'k's, K300 and K2100 likewise; C2100 is 2100 'c's, O1500 1500 'o's, V4000 4000 'v's,
# X4001 4001 'x's).
defaults:
  user: { id: 111111111111111111, username: "Invoker" }
  channel: { id: 222222222222222222, name: "test-channel" }
  clock: 2026-01-02T15:04:05Z
  members: [111111111111111111, 555555555555555555]
  guild:
    id: 333333333333333333
    name: "Test Server"
    roles: [{ id: 888888888, name: "Staff" }]
    channels: [{ id: 999999999, name: "yagpdb" }]
  messages:
    - id: 7
      channel_id: 222222222222222222
      author_id: 1234567890
      content: ""

setup_db:
  - { user_id: 0, key: "Global", value: { Embed Color: 9807270, Delete Trigger Delay: 5 } }
  - { user_id: 0, key: "Roles", value: { Staff: 888888888 } }
  - { user_id: 0, key: "Channels", value: { YAGPDB: 999999999 } }
  - { user_id: 0, key: "Commands", value: { embed_exec: "123" } }
  - user_id: 0
    key: "Admin"
    value:
      Greeting: "hello"
      ? ""
      : ""

command_map:
  123: "../../../commands/plumbing/embed_exec.gohtml"

tests:
  # ---------- db_slash: the Key field (value max 1024) ----------
  - name: "db_slash view: a 1100-character key is cut to fit the Key field"
    strict: true
    template: "../../../commands/db/db_slash.gohtml"
    context:
      interaction: { type: slash, subcommand: view, options: { key: "" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, embed_contains: "kkkkkkkkkkkkkkkkkkkkkkkkkkkkkk…" }

  - name: "db_slash ExecData: a 1100-character key is cut to fit the Key field"
    strict: true
    template: "../../../commands/db/db_slash.gohtml"
    context:
      exec_data:
        ChannelID: 222222222222222222
        UserID: 0
        Operation: "get"
        Key: ""
    assertions:
      sent_messages:
        - { embed_contains: "kkkkkkkkkkkkkkkkkkkkkkkkkkkkkk…" }

  # ---------- edit_modal: title 256, Was + Stored as + description beside 6000 ----------
  - name: "submit entry: a 300-character key can't push the title past 256"
    strict: true
    template: "../../../commands/edit/edit_modal.gohtml"
    context:
      user: { roles: [888888888] }
      interaction: { type: modal, custom_id: "edit:entry:1767366245",
                     fields: { category: "Admin", key: "", value: "short" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, embed_contains: "… added" }

  - name: "submit entry: a long key, Was, Stored as and a 4000-character value fit 6000"
    strict: true
    template: "../../../commands/edit/edit_modal.gohtml"
    context:
      user: { roles: [888888888] }
      interaction: { type: modal, custom_id: "edit:entry:1767366245",
                     fields: { category: "Admin", key: "", value: "" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, embed_contains: "Stored as" }

  - name: "submit entry: a 2100-character unknown category is refused within 2000"
    strict: true
    template: "../../../commands/edit/edit_modal.gohtml"
    context:
      user: { roles: [888888888] }
      interaction: { type: modal, custom_id: "edit:entry:1767366245",
                     fields: { category: "", key: "Name", value: "short" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "There is no `Ccc" }

  # ---------- edit_slash: the delete confirm and its refusals ----------
  - name: "edit delete entry: a 1100-character key can't push the title past 256"
    strict: true
    template: "../../../commands/edit/edit_slash.gohtml"
    context:
      user: { roles: [888888888] }
      interaction: { type: slash, subcommand: delete,
                     options: { category: "Admin", key: "" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, embed_contains: "…?" }

  - name: "edit delete entry: a 2100-character unknown key is refused within 2000"
    strict: true
    template: "../../../commands/edit/edit_slash.gohtml"
    context:
      user: { roles: [888888888] }
      interaction: { type: slash, subcommand: delete,
                     options: { category: "Admin", key: "" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "There is no `Kkk" }

  - name: "edit delete entry: a 2100-character unknown category is refused within 2000"
    strict: true
    template: "../../../commands/edit/edit_slash.gohtml"
    context:
      user: { roles: [888888888] }
      interaction: { type: slash, subcommand: delete,
                     options: { category: "", key: "Name" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "There is no `Ccc" }

  # the engine records only a modal's shape, not its prefills, so this pins that a
  # prefill over the input's 4000 max still opens the modal (the prefill is skipped)
  - name: "edit entry: a 4001-character category and key still open the modal"
    strict: true
    template: "../../../commands/edit/edit_slash.gohtml"
    context:
      user: { roles: [888888888] }
      interaction: { type: slash, subcommand: entry,
                     options: { category: "", key: "" } }
    assertions:
      interaction_responses:
        - { kind: modal, title: "Edit entry", custom_id: "edit:entry:1767366245",
            fields: ["category", "key", "value"] }

  # ---------- edit_confirm: the removed title and the not-found message ----------
  - name: "confirm go: a 1100-character key can't push the removed title past 256"
    strict: true
    template: "../../../commands/edit/edit_confirm.gohtml"
    setup_db:
      - { user_id: 111111111111111111, key: "Edit Pending",
          value: { kind: entry, category: "Admin", key: "", stamp: 1767366245 } }
    context:
      user: { roles: [888888888] }
      interaction: { type: component, custom_id: "editdel:111111111111111111:1767366245:go",
                     message_id: 7 }
    assertions:
      interaction_responses:
        - { kind: update, embed_contains: "… removed" }

  - name: "confirm go: a 2100-character gone key acks not found within 2000"
    strict: true
    template: "../../../commands/edit/edit_confirm.gohtml"
    setup_db:
      - { user_id: 111111111111111111, key: "Edit Pending",
          value: { kind: entry, category: "Admin", key: "", stamp: 1767366245 } }
    context:
      user: { roles: [888888888] }
      interaction: { type: component, custom_id: "editdel:111111111111111111:1767366245:go",
                     message_id: 7 }
    assertions:
      interaction_responses:
        - { kind: update, content_contains: "not found" }

  # review follow-ups: the longest suffix (" unchanged", 10) and the not-a-dictionary refusal
  - name: "submit entry: a 300-character key, value unchanged, keeps the title within 256"
    strict: true
    template: "../../../commands/edit/edit_modal.gohtml"
    setup_db:
      - { user_id: 0, key: "Admin", value: { "": "same" } }
    context:
      user: { roles: [888888888] }
      interaction: { type: modal, custom_id: "edit:entry:1767366245",
                     fields: { category: "Admin", key: "", value: "same" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, embed_contains: "… unchanged" }

  - name: "submit entry: a 2100-character category holding a string is refused within 2000"
    strict: true
    template: "../../../commands/edit/edit_modal.gohtml"
    setup_db:
      - { user_id: 0, key: "", value: "not a dictionary" }
    context:
      user: { roles: [888888888] }
      interaction: { type: modal, custom_id: "edit:entry:1767366245",
                     fields: { category: "", key: "k", value: "v" } }
    assertions:
      interaction_responses:
        - { kind: message, ephemeral: true, content_contains: "doesn't hold a dictionary" }
